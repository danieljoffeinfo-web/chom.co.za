name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only reads the code. Its GitHub token cannot push, comment,
# or change settings.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Type check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: No environment files committed
        # .gitignore stops accidental commits; this also catches `git add -f`.
        run: |
          found=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "::error::Environment files must not be committed:"
            echo "$found"
            exit 1
          fi

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Lint (ESLint, plus design token drift check)
        run: pnpm lint

      - name: Build web
        run: pnpm build

      - name: Bundle mobile (iOS + Android)
        run: pnpm --filter @chom/mobile bundle

      - name: Build static site (live chom.co.za)
        run: pnpm build:site
