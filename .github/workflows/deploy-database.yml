name: Deploy database

# Applies new migrations in supabase/migrations/ to the production Supabase project,
# after CI has passed on main. It always deploys the latest main, so a run that
# waited or was replaced never leaves a newer migration behind, and only once CI has
# passed on that exact commit. If CI on the latest main is still running, this run
# stops and that commit's own CI completion starts the deploy instead.
#
# Needs the SUPABASE_ACCESS_TOKEN secret on the "productionchom" environment
# (GitHub: Settings > Environments > productionchom). See README "Deployments".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show which migrations would be applied
        type: boolean
        default: true

permissions:
  contents: read
  # To check the CI result of the commit being deployed.
  actions: read

env:
  # The chom.co.za project (eu-west-1). Not a secret.
  SUPABASE_PROJECT_REF: xgbayvzxbwgvpspdrmme

jobs:
  deploy:
    name: Apply migrations to production
    # Automatic runs: only after CI passed on a push to main (not pull requests).
    # Manual runs: only from main, so only reviewed, merged migrations can be applied.
    # The productionchom environment also only allows main (README "Deployments").
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    # One deploy at a time, never cancelled halfway. Set on the job, so runs skipped
    # by the condition above (failed CI, pull requests) never join the queue. Manual
    # previews use their own queue, so they can't replace a waiting deploy. A waiting
    # deploy may be replaced by a newer one; both deploy the latest main, so nothing
    # is lost.
    concurrency:
      group: deploy-database-${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'preview' || 'apply' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: productionchom
    steps:
      - uses: actions/checkout@v4
        with:
          # Always the latest main, even if this run was triggered by an older commit.
          ref: main
          persist-credentials: false

      - name: CI passed on this exact commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(git rev-parse HEAD)
          result=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&branch=main&per_page=1" \
            --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"')
          echo "Latest main is $sha; its CI run: ${result:-none}"
          case "$result" in
            "completed success")
              echo "passed=true" >> "$GITHUB_OUTPUT" ;;
            "completed "*)
              echo "::error::CI did not pass on $sha, so nothing is deployed. Fix main; the next green CI run deploys."
              exit 1 ;;
            *)
              echo "::notice::CI on $sha hasn't finished. Its own completion will start the deploy, so this run stops here."
              echo "passed=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: pnpm/action-setup@v4
        if: steps.ci.outputs.passed == 'true'

      - uses: actions/setup-node@v4
        if: steps.ci.outputs.passed == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install (includes the pinned Supabase CLI)
        if: steps.ci.outputs.passed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check the access token is set
        if: steps.ci.outputs.passed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set on the productionchom environment. See README 'Deployments'."
            exit 1
          fi

      - name: Migrations in the repo vs production
        if: steps.ci.outputs.passed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase migration list --remote="$SUPABASE_PROJECT_REF"

      - name: Preview (dry run)
        if: steps.ci.outputs.passed == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase db push --remote="$SUPABASE_PROJECT_REF" --skip-vault --dry-run

      - name: Apply
        if: steps.ci.outputs.passed == 'true' && (github.event_name == 'workflow_run' || inputs.dry_run == false)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Fails, without changing anything, if production has a migration the repo
        # doesn't (someone changed it outside the repo). The seed is never applied.
        run: pnpm exec supabase db push --remote="$SUPABASE_PROJECT_REF" --skip-vault --yes

      - name: Deploy Edge Functions
        if: steps.ci.outputs.passed == 'true' && (github.event_name == 'workflow_run' || inputs.dry_run == false)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Bundled by Supabase (no Docker). JWT checks are off per function in
        # supabase/config.toml: task-file-cleanup checks its own token.
        run: pnpm exec supabase functions deploy --remote="$SUPABASE_PROJECT_REF" --use-api --yes

      - name: Email templates
        if: steps.ci.outputs.passed == 'true' && (github.event_name == 'workflow_run' || inputs.dry_run == false)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # The sign-in emails carry a code (supabase/templates/code.html, also used
        # locally through supabase/config.toml). Only these four settings change.
        run: |
          subject='Your Chom code'
          jq -n --arg subject "$subject" --rawfile html supabase/templates/code.html '{
            mailer_subjects_magic_link: $subject,
            mailer_templates_magic_link_content: $html,
            mailer_subjects_confirmation: $subject,
            mailer_templates_confirmation_content: $html
          }' | curl -fsS -X PATCH \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            --data-binary @- -o /dev/null
          echo "Sign-in email templates updated."

      - name: Production after deploy
        if: steps.ci.outputs.passed == 'true' && (github.event_name == 'workflow_run' || inputs.dry_run == false)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase migration list --remote="$SUPABASE_PROJECT_REF"
