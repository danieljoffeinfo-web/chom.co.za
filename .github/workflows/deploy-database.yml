name: Deploy database

# Applies new migrations in supabase/migrations/ to the production Supabase project,
# after CI has passed on main. It deploys exactly the commit CI tested.
#
# Needs the SUPABASE_ACCESS_TOKEN secret on the "productionchom" environment
# (GitHub: Settings > Environments > productionchom). See README "Deployments".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only show which migrations would be applied
        type: boolean
        default: true

permissions:
  contents: read

# One deploy at a time, never cancelled halfway. Manual previews use their own queue,
# so they can never replace a waiting deploy. (A newer waiting deploy may replace an
# older one; that's safe because main only moves forward, so the newer commit
# includes every migration the older one had.)
concurrency:
  group: deploy-database-${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'preview' || 'apply' }}
  cancel-in-progress: false

env:
  # The chom.co.za project (eu-west-1). Not a secret.
  SUPABASE_PROJECT_REF: xgbayvzxbwgvpspdrmme

jobs:
  deploy:
    name: Apply migrations to production
    # Automatic runs: only after CI passed on a push to main (not pull requests).
    # Manual runs: only from main, so only reviewed, merged migrations can be applied.
    # The productionchom environment also only allows main (README "Deployments").
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: productionchom
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI tested (automatic runs) or the latest main (manual runs).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (includes the pinned Supabase CLI)
        run: pnpm install --frozen-lockfile

      - name: Check the access token is set
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not set on the productionchom environment. See README 'Deployments'."
            exit 1
          fi

      - name: Migrations in the repo vs production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase migration list --remote="$SUPABASE_PROJECT_REF"

      - name: Preview (dry run)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase db push --remote="$SUPABASE_PROJECT_REF" --skip-vault --dry-run

      - name: Apply
        if: github.event_name == 'workflow_run' || inputs.dry_run == false
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Fails, without changing anything, if production has a migration the repo
        # doesn't (someone changed it outside the repo). The seed is never applied.
        run: pnpm exec supabase db push --remote="$SUPABASE_PROJECT_REF" --skip-vault --yes

      - name: Production after deploy
        if: github.event_name == 'workflow_run' || inputs.dry_run == false
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase migration list --remote="$SUPABASE_PROJECT_REF"
