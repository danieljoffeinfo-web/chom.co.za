        gap: 12px;
        align-items: flex-end;
        justify-content: space-between;
        padding: 28px 24px 16px;
      }
      .cd-head h2 {
        font-size: 28px;
        line-height: 1.1;
        margin-top: 8px;
      }
      .cd-head .schedule-subtitle {
        font-size: 14px;
        margin-top: 8px;
      }
      .cd-section .cd-head {
        padding: 0 0 20px;
      }
      .cd-assign {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        padding: 0 24px 24px;
      }
      .cd-acard,
      .cd-class,
      .cd-service {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
        padding: 20px;
        border: 1px solid var(--line);
        text-align: left;
        color: var(--ink);
        transition: border-color 0.15s;
      }
      .cd-acard:hover,
      .cd-class:hover,
      .cd-service:hover {
        border-color: var(--ink);
      }
      .cd-acard {
        border-radius: 16px;
        background: var(--bg);
      }
      .cd-aicon {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: var(--blue-soft);
        color: var(--blue);
      }
      .cd-acard strong,
      .cd-class strong,
      .cd-service strong {
        display: block;
        font-size: 18px;
        font-weight: 800;
      }
      .cd-acard small,
      .cd-service small {
        display: block;
        margin-top: 4px;
        font-size: 14px;
        color: var(--muted);
      }
      .cd-bar-label {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 700;
      }
      .cd-bar {
        display: block;
        height: 8px;
        margin-top: 8px;
        border-radius: 8px;
        background: var(--line);
        overflow: hidden;
      }
      .cd-bar i {
        display: block;
        height: 100%;
        width: var(--value);
        border-radius: 8px;
        background: var(--orange);
      }
      .cd-classes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }
      .cd-class {
        border-radius: 24px;
        background: var(--card);
      }
      .cd-class-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .cd-avatar {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--bg);
        border: 1px solid var(--line);
        font-size: 15px;
        font-weight: 800;
      }
      .cd-class small {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }
      .cd-next {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .cd-next span {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .cd-next b {
        font-size: 15px;
        font-weight: 700;
      }
      .cd-class.live {
        background: var(--fill);
        border-color: var(--fill);
        color: var(--on-fill);
      }
      .cd-class.live small {
        color: var(--on-fill);
      }
      .cd-class.live .cd-avatar {
        background: var(--orange);
        border-color: var(--orange);
        color: var(--on-orange);
      }
      .cd-class.live .cd-next {
        border-top-color: var(--muted);
      }
      .cd-class.live .cd-next span {
        color: var(--accent-on-fill);
      }
      .cd-beyond {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
      .cd-service {
        gap: 20px;
        padding: 24px;
        border-radius: 24px;
        background: var(--card);
      }
      .cd-service > .icon {
        width: 40px;
        height: 40px;
        color: var(--orange);
      }
      .page-footer {
        color: var(--muted);
        border-color: var(--line);
        font-size: 13px;
        flex-wrap: wrap;
      }
      .now-tag:before {
        display: none;
      }
      @media (max-width: 520px) {
        .cd {
          gap: 32px;
        }
        .cd-head {
          padding: 20px 20px 12px;
        }
        .cd-assign {
          padding: 0 20px 20px;
        }
        .cd-now {
          padding: 20px;
        }
        .cd-num {
          font-size: 36px;
        }
        .cd-stats,
        .cd-classes {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }
        .cd-class {
          padding: 16px;
        }
        .schedule-panel .schedule-days,
        .schedule-panel .schedule-list,
        .schedule-panel .schedule-footer {
          margin-left: 16px;
          margin-right: 16px;
          padding-left: 0;
          padding-right: 0;
        }
      }
      /* Dashboard task list */
      .dt-all {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--ink);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
      }
      .dt-all:hover {
        background: var(--fill);
        color: var(--on-fill);
      }
      .dt-group {
        padding: 8px 24px 16px;
      }
      .dt-group + .dt-group {
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .dt-group:last-child {
        padding-bottom: 24px;
      }
      .dt-group-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.2px;
        color: var(--ink);
      }
      .dt-group-title span {
        font-size: 14px;
        font-weight: 700;
        color: var(--muted);
      }
      .dt-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .dt-row {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 64px;
        padding: 12px 16px 12px 20px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--bg);
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .dt-row:hover {
        border-color: var(--ink);
      }
      .dt-copy {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .dt-name {
        font-size: 16px;
        font-weight: 700;
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .dt-subject {
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
      }
      .dt-due {
        flex-shrink: 0;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--peach);
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }
      .dt-due.is-done {
        background: none;
        color: var(--muted);
        padding-right: 0;
      }
      .dt-check {
        appearance: none;
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        margin: 0;
        border: 2px solid var(--ink);
        border-radius: 8px;
        background: var(--card);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .dt-check:checked {
        background: var(--ink);
      }
      .dt-check:checked:after {
        content: "";
        width: 10px;
        height: 6px;
        border: solid var(--card);
        border-width: 0 0 2.5px 2.5px;
        transform: rotate(-45deg) translateY(-1px);
      }
      .dt-row.done {
        background: none;
      }
      .dt-row.done .dt-name {
        color: var(--muted);
        text-decoration: line-through;
        font-weight: 600;
      }
      @media (max-width: 520px) {
        .dt-group {
          padding-left: 16px;
          padding-right: 16px;
        }
        .dt-row {
          flex-wrap: wrap;
          padding: 12px 14px;
          gap: 8px 12px;
        }
        .dt-copy {
          flex-basis: calc(100% - 44px);
        }
        .dt-due {
          order: 3;
        }
        .dt-check {
          order: 2;
        }
      }
      /* Panel headers: title left, action right */
      .cd .panel > .cd-head {
        align-items: center;
        padding: 24px 24px 16px;
      }
      .cd .panel > .cd-head .text-button,
      .cd .panel > .cd-head .dt-all {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--ink);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
        text-decoration: none;
      }
      .cd .panel > .cd-head .text-button:hover,
      .cd .panel > .cd-head .dt-all:hover {
        background: var(--fill);
        color: var(--on-fill);
      }
      .dt-group {
        padding-top: 12px;
      }
      @media (max-width: 520px) {
        .cd .panel > .cd-head {
          padding: 20px 16px 16px;
        }
      }
      .cd + .page-footer {
        max-width: 1180px;
        margin-left: auto;
        margin-right: auto;
      }
      .sign-out {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        margin-top: 12px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 16px;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
      }
      .sign-out:hover {
        border-color: var(--ink);
        background: var(--soft);
      }
      /* ---------- Subject badges: one fixed colour and icon per subject, on every dashboard ---------- */
      .subject-badge {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        flex: none;
        border-radius: 8px;
        background: var(--subject, var(--muted));
        color: var(--chom-on-subject);
      }
      .subject-badge .icon {
        width: 20px;
        height: 20px;
      }
      .subject-badge.small {
        width: 32px;
        height: 32px;
      }
      .subject-badge.small .icon {
        width: 16px;
        height: 16px;
      }
      :is(.subject-badge, .subject-tint).maths { --subject: var(--chom-subject-maths); }
      :is(.subject-badge, .subject-tint).english { --subject: var(--chom-subject-english); }
      :is(.subject-badge, .subject-tint).language { --subject: var(--chom-subject-language); }
      :is(.subject-badge, .subject-tint).life-orientation { --subject: var(--chom-subject-life-orientation); }
      :is(.subject-badge, .subject-tint).physical-sciences { --subject: var(--chom-subject-physical-sciences); }
      :is(.subject-badge, .subject-tint).life-sciences { --subject: var(--chom-subject-life-sciences); }
      :is(.subject-badge, .subject-tint).commerce { --subject: var(--chom-subject-commerce); }
      :is(.subject-badge, .subject-tint).humanities { --subject: var(--chom-subject-humanities); }
      :is(.subject-badge, .subject-tint).technology { --subject: var(--chom-subject-technology); }
      :is(.subject-badge, .subject-tint).arts { --subject: var(--chom-subject-arts); }

      /* ---------- Phones: the main sections as bottom tabs, Home first; search, alerts and
         profile move to the top right. More (where a dashboard has it) opens the menu. ---------- */
      .tab-dock {
        display: none;
      }
      @media (max-width: 900px) {
        .tab-dock {
          position: fixed;
          z-index: 30;
          left: 12px;
          right: 12px;
          bottom: calc(12px + env(safe-area-inset-bottom, 0px));
          max-width: 480px;
          margin: 0 auto;
          display: grid;
          grid-auto-flow: column;
          grid-auto-columns: minmax(0, 1fr);
          gap: 4px;
          padding: 6px;
          border: 1px solid var(--line);
          border-radius: 16px;
          background: var(--card);
          box-shadow: 0 8px 32px rgba(20, 20, 20, 0.08);
        }
        .tab-dock > a,
        .tab-dock > button {
          display: grid;
          justify-items: center;
          align-content: center;
          gap: 4px;
          min-width: 0;
          min-height: 52px;
          padding: 0 2px;
          border-radius: 12px;
          color: var(--muted);
          font-size: 11px;
          font-weight: 700;
          line-height: 1;
          text-decoration: none;
        }
        .tab-dock .icon {
          width: 20px;
          height: 20px;
        }
        .tab-dock .active {
          background: var(--fill);
          color: var(--on-fill);
        }
        .quick-actions {
          position: absolute;
          top: 14px;
          right: 14px;
          bottom: auto;
          left: auto;
          transform: none;
          padding: 0;
          border: 0;
          background: transparent;
          box-shadow: none;
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
        }
        .quick-actions .mobile-menu,
        .dock-divider {
          display: none;
        }
        .page {
          padding-top: 72px;
        }
      }
      /* ---------- Colour and play (docs/design/dashboard.md, "Accents") ----------
         Navy and vanilla stay the base; the accents (--chom-accent-*) add the fun. A part
         picks its accent with a .tone-* class (or by position) and reads it as --tone. */
      .tone-coral {
        --tone: var(--chom-accent-coral);
      }
      .tone-sunflower {
        --tone: var(--chom-accent-sunflower);
      }
      .tone-mint {
        --tone: var(--chom-accent-mint);
      }
      .tone-sky {
        --tone: var(--chom-accent-sky);
      }
      .tone-lilac {
        --tone: var(--chom-accent-lilac);
      }
      /* Glass for the hero. The colour washes and the frosted sheen are the panel's own
         background (no blurred layer), so they always clip cleanly to the rounded corners. */
      :root {
        --wash: 55%;
        --glass-sheen: linear-gradient(
          160deg,
          color-mix(in srgb, var(--card) 78%, transparent) 0%,
          color-mix(in srgb, var(--card) 40%, transparent) 100%
        );
        --glass-pane: color-mix(in srgb, var(--card) 58%, transparent);
        --glass-line: color-mix(in srgb, var(--ink) 9%, transparent);
        --glass-hi: color-mix(in srgb, var(--card) 100%, transparent);
        --glass-shadow: color-mix(in srgb, var(--ink) 22%, transparent);
      }
      :root[data-theme="dark"] {
        --wash: 26%;
        --glass-sheen: linear-gradient(
          160deg,
          color-mix(in srgb, var(--ink) 7%, transparent) 0%,
          color-mix(in srgb, var(--ink) 1%, transparent) 100%
        );
        --glass-pane: color-mix(in srgb, var(--ink) 6%, transparent);
        --glass-line: color-mix(in srgb, var(--ink) 12%, transparent);
        --glass-hi: color-mix(in srgb, var(--ink) 20%, transparent);
        --glass-shadow: color-mix(in srgb, var(--bg) 90%, transparent);
      }

      /* Hero: liquid glass. A frosted pane over soft accent light; dark text; the stats as
         smaller panes with an accent icon and bar. */
      .cd-top {
        position: relative;
        overflow: hidden;
        padding: 40px 44px;
        border: 1px solid var(--glass-line);
        border-radius: 32px;
        background:
          var(--glass-sheen),
          radial-gradient(70% 120% at 0% 0%, color-mix(in srgb, var(--chom-accent-sky) var(--wash), transparent), transparent 62%),
          radial-gradient(60% 120% at 100% 0%, color-mix(in srgb, var(--chom-accent-sunflower) var(--wash), transparent), transparent 62%),
          radial-gradient(60% 100% at 78% 100%, color-mix(in srgb, var(--chom-accent-lilac) var(--wash), transparent), transparent 62%),
          radial-gradient(50% 90% at 22% 100%, color-mix(in srgb, var(--chom-accent-mint) var(--wash), transparent), transparent 62%),
          var(--card);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 30px 60px -42px var(--glass-shadow);
        color: var(--ink);
      }
      .cd-top .cd-title,
      .cd-top .cd-lede,
      .cd-top .cd-label {
        color: var(--ink);
      }
      .cd-top .cd-label {
        opacity: 0.65;
      }
      .cd-top .cd-lede strong {
        text-decoration: underline;
        text-decoration-color: var(--chom-accent-sunflower);
        text-decoration-thickness: 3px;
        text-underline-offset: 5px;
      }
      .cd-top .cd-stats {
        flex-basis: 400px;
        gap: 12px;
      }
      .cd-top .cd-stat {
        border: 1px solid var(--glass-line);
        background: var(--glass-pane);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 12px 28px -22px var(--glass-shadow);
        backdrop-filter: blur(20px) saturate(170%);
        -webkit-backdrop-filter: blur(20px) saturate(170%);
      }
      .cd-top .cd-stat .cd-num,
      .cd-top .cd-stat strong {
        color: var(--ink);
      }
      .cd-top .cd-stat small,
      .cd-top .cd-stat .cd-of {
        color: var(--muted);
        opacity: 1;
      }
      .cd-top .cd-stat-icon {
        background: var(--tone);
        color: var(--chom-on-accent);
      }
      .cd-top .cd-meter {
        background: color-mix(in srgb, var(--ink) 12%, transparent);
      }
      .cd-top .cd-meter i {
        background: var(--tone);
      }
      /* Today's progress: one glass pane, a mint ring that fills as tasks are ticked. */
      .today-card {
        flex: 0 1 360px;
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 20px 24px 20px 20px;
        border: 1px solid var(--glass-line);
        border-radius: 24px;
        background: var(--glass-pane);
        box-shadow:
          inset 0 1px 0 var(--glass-hi),
          0 12px 28px -22px var(--glass-shadow);
        backdrop-filter: blur(20px) saturate(170%);
        -webkit-backdrop-filter: blur(20px) saturate(170%);
      }
      .today-ring {
        position: relative;
        display: grid;
        place-items: center;
        flex: none;
        width: 88px;
        height: 88px;
      }
      .today-ring svg {
        position: absolute;
        inset: 0;
        transform: rotate(-90deg);
      }
      .today-ring circle {
        fill: none;
        stroke: color-mix(in srgb, var(--ink) 12%, transparent);
        stroke-width: 4.5;
      }
      .today-ring .today-fill {
        stroke: var(--chom-accent-mint);
        stroke-linecap: round;
        transition: stroke-dasharray 0.6s ease;
      }
      .today-ring b {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .today-ring b small {
        font-size: 15px;
        color: var(--muted);
      }
      .today-text {
        display: grid;
        gap: 4px;
      }
      .today-text strong {
        font-size: 17px;
      }
      .today-text small {
        font-size: 14px;
        color: var(--muted);
      }
      @media (prefers-reduced-motion: reduce) {
        .today-ring .today-fill {
          transition: none;
        }
      }
      /* Stat tiles elsewhere (My subjects) stay bright accent tiles. */
      .cd-stat {
        position: relative;
        gap: 4px;
        min-height: 132px;
        padding: 18px 18px 16px;
        border-top: 0;
        border-radius: 22px;
        background: var(--tone);
        color: var(--chom-on-accent);
      }
      .cd-stat:nth-child(3n + 1) {
        --tone: var(--chom-accent-sunflower);
      }
      .cd-stat:nth-child(3n + 2) {
        --tone: var(--chom-accent-mint);
      }
      .cd-stat:nth-child(3n + 3) {
        --tone: var(--chom-accent-sky);
      }
      .cd-stat .cd-num,
      .cd-stat strong {
        color: var(--chom-on-accent);
      }
      .cd-stat .cd-num {
        margin-bottom: 6px;
      }
      .cd-stat small,
      .cd-stat .cd-of {
        color: var(--chom-on-accent);
        opacity: 0.8;
      }
      .cd-stat-icon {
        position: absolute;
        top: 14px;
        right: 14px;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: color-mix(in srgb, var(--chom-on-accent) 12%, transparent);
      }
      .cd-stat-icon .icon {
        width: 20px;
        height: 20px;
      }
      /* "4 of 6" as a bar. Decorative: the number beside it says the same. */
      .cd-meter {
        display: block;
        height: 8px;
        margin-top: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in srgb, var(--chom-on-accent) 16%, transparent);
      }
      .cd-meter i {
        display: block;
        width: var(--v);
        height: 100%;
        border-radius: inherit;
        background: var(--chom-on-accent);
      }
      @media (max-width: 600px) {
        .cd-top {
          margin: 0 -4px;
          padding: 28px 22px 22px;
          border-radius: 26px;
        }
        .cd-stat {
          min-height: 0;
        }
      }

      /* Section labels: a pill in the section's accent ("My tasks", "Academics"). */
      .cd-head .cd-label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px 5px 10px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--tone, var(--chom-accent-sky)) 28%, var(--card));
        color: var(--ink);
        font-size: 13px;
      }
      .cd-head .cd-label::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--tone, var(--chom-accent-sky));
      }

      /* Empty and coming-soon states: the icon sits in a bright blob. */
      .empty-message > .icon {
        box-sizing: content-box;
        width: 28px;
        height: 28px;
        margin: 10px auto 22px;
        padding: 18px;
        border-radius: 50%;
        background: var(--tone, var(--chom-accent-sunflower));
        color: var(--chom-on-accent);
        box-shadow: 0 0 0 10px color-mix(in srgb, var(--tone, var(--chom-accent-sunflower)) 30%, transparent);
      }
      .empty-message h2 {
        color: var(--ink);
      }
      .coming-list li {
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
      }
      .coming-list li::before {
        content: "";
        flex: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--chom-accent-coral);
      }
      .coming-list li:nth-child(5n + 2)::before {
        background: var(--chom-accent-sunflower);
      }
      .coming-list li:nth-child(5n + 3)::before {
        background: var(--chom-accent-mint);
      }
      .coming-list li:nth-child(5n + 4)::before {
        background: var(--chom-accent-sky);
      }
      .coming-list li:nth-child(5n + 5)::before {
        background: var(--chom-accent-lilac);
      }

      /* Notices: a lilac strip, not a grey one. */
      .notice {
        position: relative;
        padding: 16px 20px 16px 48px;
        border-radius: 18px;
        background: color-mix(in srgb, var(--chom-accent-lilac) 22%, var(--card));
        color: var(--ink);
        font-size: 13px;
      }
      .notice::before {
        content: "";
        position: absolute;
        top: 18px;
        left: 20px;
        width: 14px;
        height: 14px;
        border-radius: 4px;
        background: var(--chom-accent-lilac);
        transform: rotate(45deg);
      }

      /* The open section's icon in the sidebar, in sunflower (on navy, so light mode only). */
      :root:not([data-theme="dark"]) .nav a.active .icon {
        color: var(--chom-accent-sunflower);
      }
      /* Learner home: task rows carry their subject's badge; due pills say how soon. */
      .subject-badge.mine {
        --subject: var(--chom-accent-lilac);
        color: var(--chom-on-accent);
      }
      .dt-row {
        padding-left: 14px;
      }
      .dt-row:hover {
        border-color: var(--tone, var(--ink));
      }
      .dt-due.is-today {
        background: color-mix(in srgb, var(--chom-accent-coral) 30%, var(--card));
      }
      .dt-due.is-late {
        background: var(--chom-accent-coral);
        color: var(--chom-on-accent);
      }
      .dt-due.is-later {
        background: color-mix(in srgb, var(--chom-accent-sky) 30%, var(--card));
      }
      .dt-due.is-any {
        background: color-mix(in srgb, var(--chom-accent-lilac) 30%, var(--card));
      }
      .dt-due.is-done {
        color: var(--ink);
      }
      .dt-check {
        border-radius: 50%;
      }
      .dt-check:checked {
        border-color: var(--chom-accent-mint);
        background: var(--chom-accent-mint);
      }
      .dt-check:checked:after {
        border-color: var(--chom-on-accent);
      }
      @media (prefers-reduced-motion: no-preference) {
        .dt-check:checked {
          animation: dt-pop 0.35s ease-out;
        }
      }
      @keyframes dt-pop {
        40% {
          transform: scale(1.25);
          box-shadow: 0 0 0 8px color-mix(in srgb, var(--chom-accent-mint) 35%, transparent);
        }
      }
      .dt-row.done {
        background: color-mix(in srgb, var(--chom-accent-mint) 12%, transparent);
        border-color: transparent;
      }
      .dt-cheer {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 4px 0;
        padding: 18px 20px;
        border-radius: 18px;
        background: color-mix(in srgb, var(--tone, var(--chom-accent-mint)) 22%, var(--card));
        color: var(--ink);
      }
      .dt-cheer .icon {
        box-sizing: content-box;
        flex: none;
        width: 22px;
        height: 22px;
        padding: 10px;
        border-radius: 50%;
        background: var(--tone, var(--chom-accent-mint));
        color: var(--chom-on-accent);
      }
      .dt-cheer p {
        margin: 0;
        font-size: 15px;
      }

      /* Coming up: a calendar tile per date. */
      .when-list {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .when-row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px 10px 10px;
        border-radius: 18px;
        background: var(--bg);
      }
      .when-row h3 {
        margin: 0;
        font-size: 16px;
      }
      .when-row p {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .date-tile {
        display: grid;
        flex: none;
        width: 56px;
        overflow: hidden;
        border-radius: 14px;
        background: var(--card);
        text-align: center;
        box-shadow: inset 0 0 0 2px var(--tone);
      }
      .date-tile small {
        padding: 3px 0;
        background: var(--tone);
        color: var(--chom-on-accent);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .date-tile b {
        padding: 4px 0 6px;
        font-size: 22px;
        line-height: 1.1;
        color: var(--ink);
      }
      .revise-strip {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 12px;
        padding: 12px 14px;
        border-radius: 14px;
        background: color-mix(in srgb, var(--chom-accent-sunflower) 30%, var(--card));
        font-weight: 600;
      }
      /* Subject cards (learner My subjects, parent Home and Academics): tinted in the subject's
         colour (.subject-tint plus its family class), the goal as a ring. */
      .subject-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 24px 20px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .subject-card {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 18px;
        border-top: 6px solid var(--subject);
        border-radius: 22px;
        background: color-mix(in srgb, var(--subject) 12%, var(--card));
      }
      /* Every card the same height, so the grid lines up (on phones they just stack). */
      @media (min-width: 601px) {
        .subject-cards {
          grid-auto-rows: 1fr;
        }
      }
      .subject-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .subject-card-name {
        font-size: 17px;
        line-height: 1.25;
        font-weight: 800;
      }
      .subject-card-teacher {
        font-size: 13px;
        color: var(--muted);
      }
      .subject-card-unit {
        display: grid;
        margin-top: 10px;
        font-size: 13px;
        font-weight: 700;
      }
      .subject-card-unit small {
        font-size: 11px;
        color: var(--muted);
      }
      .subject-card-foot {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 12px;
        margin-top: auto;
        padding-top: 16px;
      }
      .subject-card-goal {
        flex: 1 1 auto;
        display: grid;
        line-height: 1.2;
      }
      .subject-card-goal small {
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
      }
      .subject-card-goal b {
        font-size: 13px;
      }
      .goal-ring {
        display: grid;
        place-items: center;
        flex: none;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background:
          radial-gradient(var(--card) 0 58%, transparent 59%),
          conic-gradient(var(--subject) var(--v), color-mix(in srgb, var(--subject) 22%, var(--card)) 0);
        font-size: 13px;
        font-weight: 800;
      }
      .goal-ring.empty {
        color: var(--muted);
      }
      .focus-tag {
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--chom-accent-sunflower);
        color: var(--chom-on-accent);
        font-size: 11px;
        font-style: normal;
        font-weight: 800;
      }

      /* My subjects: summary tiles, then cards that open the subject. */
      .subject-cards + .notice {
        margin-top: 32px;
      }
      .subject-stats {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        margin-bottom: 40px;
      }
      button.subject-card {
        width: 100%;
        height: 100%;
        border: 0;
        border-top: 6px solid var(--subject);
        font: inherit;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      button.subject-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 24px -14px var(--subject);
      }
      @media (prefers-reduced-motion: reduce) {
        button.subject-card {
          transition: none;
        }
        button.subject-card:hover {
          transform: none;
        }
      }
      .todo-pill {
        padding: 4px 10px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--chom-accent-coral) 32%, var(--card));
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }
      .todo-pill.clear {
        background: color-mix(in srgb, var(--chom-accent-mint) 32%, var(--card));
      }

      /* Subject dialog */
      .sd-hero {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px;
        border-radius: 20px;
        background: color-mix(in srgb, var(--subject) 16%, var(--card));
      }
      .sd-who {
        flex: 1 1 auto;
        display: grid;
        min-width: 0;
      }
      .sd-who small {
        font-size: 12px;
        color: var(--muted);
      }
      .goal-ring.big {
        width: 64px;
        height: 64px;
        font-size: 16px;
      }
      .sd-goal {
        margin: 14px 0 0;
      }
      .sd-title {
        margin: 22px 0 10px;
        font-size: 15px;
      }
      .dialog-body .sd-tasks,
      .dialog-body .unit-line {
        padding: 0;
      }
      .dialog-body .sd-tasks li,
      .dialog-body .unit-line li {
        margin: 0;
      }
      .sd-tasks {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .sd-tasks li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 10px 10px 14px;
        border-radius: 14px;
        background: var(--bg);
      }
      .sd-tasks button {
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        font-weight: 700;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
      }
      .sd-clear {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0 0;
        padding: 12px 14px;
        border-radius: 14px;
        background: color-mix(in srgb, var(--chom-accent-mint) 22%, var(--card));
        font-weight: 600;
      }
      .sd-clear .icon {
        flex: none;
        color: var(--ink);
      }
      /* Units as a line: done in mint, the current one in coral, the rest still to come. */
      .unit-line {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .unit-line li {
        position: relative;
        display: grid;
        padding: 0 0 14px 28px;
        font-size: 14px;
        font-weight: 700;
      }
      .unit-line li::before {
        content: "";
        position: absolute;
        top: 4px;
        left: 0;
        width: 10px;
        height: 10px;
        border: 2px solid var(--line);
        border-radius: 50%;
        background: var(--card);
      }
      .unit-line li:not(:last-child)::after {
        content: "";
        position: absolute;
        top: 20px;
        bottom: 0;
        left: 6px;
        width: 2px;
        background: var(--line);
      }
      .unit-line li.done::before {
        border-color: var(--chom-accent-mint);
        background: var(--chom-accent-mint);
      }
      .unit-line li.now::before {
        border-color: var(--chom-accent-coral);
        background: var(--chom-accent-coral);
        box-shadow: 0 0 0 5px color-mix(in srgb, var(--chom-accent-coral) 30%, transparent);
      }
      .unit-line li.done span {
        color: var(--muted);
      }
      .unit-line li > span {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
      }
      .unit-line .now-tag {
        background: var(--chom-accent-coral);
        color: var(--chom-on-accent);
      }
      @media (max-width: 600px) {
        .subject-stats {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 8px;
          margin-bottom: 28px;
        }
        .subject-stats .cd-stat {
          padding: 14px 12px 12px;
          border-radius: 18px;
        }
        .subject-stats .cd-num {
          font-size: 30px;
        }
        .subject-stats .cd-stat > small,
        .subject-stats .cd-stat-icon {
          display: none;
        }
      }
      .unit-line small {
        font-weight: 500;
        color: var(--muted);
      }
      /* Study with Chom: a calm, centred chat page. Chom's mark is four confetti dots. */
      .ask {
        max-width: 720px;
        margin: 0 auto;
        padding-top: 7vh;
      }
      .ask-mark,
      .ask-avatar {
        display: inline-grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        width: 44px;
        height: 44px;
      }
      .ask-mark i,
      .ask-avatar i {
        border-radius: 50%;
        background: #ffffff;
      }
      /* Chom's mark: four dots in shades of white. */
      .ask-mark i:nth-child(2),
      .ask-avatar i:nth-child(2) {
        background: #d4d4d4;
      }
      .ask-mark i:nth-child(3),
      .ask-avatar i:nth-child(3) {
        background: #a3a3a3;
      }
      .ask-mark i:nth-child(4),
      .ask-avatar i:nth-child(4) {
        background: #e5e5e5;
      }
      @media (prefers-reduced-motion: no-preference) {
        .ask-mark i {
          animation: ask-bob 2.4s ease-in-out infinite;
        }
        .ask-mark i:nth-child(2) {
          animation-delay: 0.15s;
        }
        .ask-mark i:nth-child(3) {
          animation-delay: 0.45s;
        }
        .ask-mark i:nth-child(4) {
          animation-delay: 0.3s;
        }
      }
      @keyframes ask-bob {
        50% {
          transform: scale(0.82);
        }
      }
      .ask-hero {
        margin-bottom: 28px;
        text-align: center;
      }
      .ask-hero h1 {
        margin: 18px 0 0;
        font-size: clamp(30px, 4.6vw, 46px);
        line-height: 1.08;
        letter-spacing: -1.2px;
      }
      .composer {
        padding: 16px 12px 10px 20px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--card);
        box-shadow: 0 18px 40px -26px color-mix(in srgb, var(--ink) 45%, transparent);
        transition: border-color 0.15s, box-shadow 0.15s;
      }
      .composer:focus-within {
        border-color: color-mix(in srgb, var(--ink) 45%, var(--line));
        box-shadow:
          0 0 0 4px color-mix(in srgb, var(--chom-accent-sky) 25%, transparent),
          0 18px 40px -26px color-mix(in srgb, var(--ink) 45%, transparent);
      }
      .composer textarea {
        display: block;
        width: 100%;
        max-height: 200px;
        min-height: 28px;
        padding: 0;
        border: 0;
        outline: 0;
        resize: none;
        background: none;
        color: var(--ink);
        font: inherit;
        font-size: 17px;
        line-height: 1.5;
      }
      .composer textarea::placeholder {
        color: var(--muted);
      }
      .composer-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 12px;
      }
      .composer-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px 5px 9px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--chom-accent-lilac) 26%, var(--card));
        font-size: 12px;
        font-weight: 700;
      }
      .composer-send {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 14px;
        background: var(--chom-accent-coral);
        color: var(--chom-on-accent);
        cursor: pointer;
        transition: transform 0.15s;
      }
      .composer-send:hover {
        transform: translateY(-1px);
      }
      .composer-send .icon {
        width: 20px;
        height: 20px;
      }
      .ask-chips {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
      }
      .ask-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 42px;
        padding: 6px 16px 6px 6px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.15s, border-color 0.15s;
      }
      .ask-chip:hover {
        border-color: var(--tone);
        background: color-mix(in srgb, var(--tone) 20%, var(--card));
      }
      .ask-chip .icon {
        box-sizing: content-box;
        padding: 7px;
        border-radius: 50%;
        background: var(--tone);
        color: var(--chom-on-accent);
      }
      .ask-note {
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }

      /* The conversation: the learner's words in a soft bubble, Chom's reply beside its mark. */
      .ask-thread {
        display: grid;
        gap: 32px;
      }
      .ask.has-thread {
        padding-top: 0;
      }
      .ask.has-thread .ask-hero {
        margin-bottom: 24px;
        text-align: left;
      }
      .ask.has-thread .ask-mark,
      .ask.has-thread .ask-chips,
      .ask.has-thread .ask-note {
        display: none;
      }
      .ask.has-thread .ask-hero h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.4px;
      }
      .ask.has-thread .ask-thread {
        margin-bottom: 28px;
      }
      .ask.has-thread .composer {
        position: sticky;
        z-index: 5;
        bottom: 24px;
      }
      .ask-turn {
        display: grid;
        gap: 20px;
        scroll-margin-top: 24px;
      }
      .ask-you {
        justify-self: end;
        max-width: 82%;
        padding: 12px 18px;
        border-radius: 22px 22px 6px 22px;
        background: color-mix(in srgb, var(--chom-accent-sky) 24%, var(--card));
        color: var(--ink);
        font-size: 15px;
      }
      .ask-you p {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .ask-chom {
        display: grid;
        grid-template-columns: 32px minmax(0, 1fr);
        gap: 14px;
      }
      .ask-avatar {
        width: 30px;
        height: 30px;
        gap: 3px;
        margin-top: 2px;
      }
      .ask-reply {
        font-size: 15px;
        line-height: 1.6;
        color: var(--ink);
      }
      .ask-reply h3 {
        margin: 2px 0 8px;
        font-size: 19px;
        letter-spacing: -0.3px;
      }
      .ask-reply p {
        margin: 0 0 10px;
      }
      .ask-reply ol {
        margin: 0 0 12px;
        padding-left: 20px;
      }
      .ask-reply li {
        margin: 6px 0;
      }
      .ask-reply .notice {
        margin-top: 14px;
      }

      /* The notebook: a sunflower page under the chat. */
      .ask-notebook {
        max-width: 720px;
        margin: 64px auto 0;
        padding: 22px;
        border-radius: 26px;
        background: color-mix(in srgb, var(--chom-accent-sunflower) 22%, var(--card));
      }
      .ask-notebook-head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
      }
      .ask-notebook-head h2 {
        margin: 0;
        font-size: 19px;
      }
      .ask-notebook-head label {
        font-size: 13px;
        color: var(--muted);
      }
      .ask-notebook-icon {
        display: grid;
        place-items: center;
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: var(--chom-accent-sunflower);
        color: var(--chom-on-accent);
      }
      /* Grey and black, like the sidebar. */
      :root[data-theme="dark"] .ask-notebook {
        background: var(--fill);
      }
      :root[data-theme="dark"] .ask-notebook-icon {
        background: var(--fill-accent);
        color: var(--ink);
      }
      :root[data-theme="dark"] .ask-notebook .notes-area {
        background: var(--bg);
      }
      :root[data-theme="dark"] .ask-notebook .button {
        background: var(--fill-accent);
      }
      :root[data-theme="dark"] .ask-notebook .button:hover {
        background: color-mix(in srgb, var(--ink) 38%, var(--bg));
      }
      .ask-notebook .notes-area {
        background: var(--card);
      }
      @media (max-width: 900px) {
        .ask {
          padding-top: 3vh;
        }
        .ask.has-thread .composer {
          bottom: 104px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .composer,
        .composer-send,
        .ask-chip {
          transition: none;
        }
      }
      /* My tasks: the three tiles are the filters; the open one is filled in. */
      .task-tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 28px;
      }
      .task-tab {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        min-height: 132px;
        padding: 18px;
        border: 2px solid transparent;
        border-radius: 22px;
        background: color-mix(in srgb, var(--tone) 22%, var(--card));
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: background-color 0.15s, transform 0.15s;
      }
      .task-tab:hover {
        transform: translateY(-2px);
        border-color: var(--tone);
      }
      .task-tab.active {
        background: var(--tone);
        color: var(--chom-on-accent);
      }
      .task-tab-icon {
        position: absolute;
        top: 14px;
        right: 14px;
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 12px;
        background: var(--tone);
        color: var(--chom-on-accent);
      }
      .task-tab.active .task-tab-icon {
        background: color-mix(in srgb, var(--chom-on-accent) 12%, transparent);
      }
      .task-tab-icon .icon {
        width: 20px;
        height: 20px;
      }
      .task-tab-num {
        margin-bottom: 6px;
        font-size: 40px;
        line-height: 1;
        font-weight: 800;
        letter-spacing: -1.5px;
      }
      .task-tab strong {
        font-size: 15px;
      }
      .task-tab small {
        font-size: 13px;
        opacity: 0.8;
      }
      .task-tab .cd-meter {
        width: 100%;
        margin-top: 8px;
        background: color-mix(in srgb, var(--ink) 14%, transparent);
      }
      .task-tab .cd-meter i {
        background: var(--ink);
      }
      .task-tab.active .cd-meter {
        background: color-mix(in srgb, var(--chom-on-accent) 16%, transparent);
      }
      .task-tab.active .cd-meter i {
        background: var(--chom-on-accent);
      }
      .task-panel {
        padding: 22px 24px 24px;
      }
      .task-panel-title {
        margin: 0 0 14px;
        font-size: 22px;
        letter-spacing: -0.3px;
      }
      @media (max-width: 600px) {
        .task-tabs {
          gap: 8px;
        }
        .task-tab {
          min-height: 0;
          padding: 14px 12px 12px;
          border-radius: 18px;
        }
        .task-tab-num {
          font-size: 30px;
        }
        .task-tab small,
        .task-tab-icon {
          display: none;
        }
        .task-panel {
          padding: 18px 16px 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .task-tab {
          transition: none;
        }
        .task-tab:hover {
          transform: none;
        }
      }
      /* Assignments: each a dropdown, tinted in its subject's colour. */
      .assign-group + .assign-group {
        margin-top: 40px;
      }
      .assign-list {
        display: grid;
        gap: 12px;
      }
      .assign {
        border: 1px solid var(--line);
        border-left: 6px solid var(--subject, var(--muted));
        border-radius: 20px;
        background: var(--card);
        overflow: hidden;
      }
      .assign[open] {
        background: color-mix(in srgb, var(--subject, var(--muted)) 7%, var(--card));
      }
      .assign summary {
        display: flex;
        align-items: center;
        gap: 14px;
        min-height: 72px;
        padding: 14px 18px 14px 16px;
        list-style: none;
        cursor: pointer;
      }
      .assign summary::-webkit-details-marker {
        display: none;
      }
      .assign summary:hover {
        background: color-mix(in srgb, var(--subject, var(--muted)) 10%, transparent);
      }
      .assign summary:focus-visible {
        outline-offset: -3px;
      }
      .assign-copy {
        flex: 1 1 auto;
        display: grid;
        min-width: 0;
      }
      .assign-copy strong {
        font-size: 16px;
        overflow-wrap: anywhere;
      }
      .assign-copy small {
        font-size: 13px;
        color: var(--muted);
      }
      .assign-status {
        padding: 5px 11px;
        border-radius: 999px;
        background: var(--soft);
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .assign-status.draft {
        background: color-mix(in srgb, var(--chom-accent-lilac) 32%, var(--card));
      }
      .assign-status.done {
        background: color-mix(in srgb, var(--chom-accent-mint) 32%, var(--card));
      }
      .assign-chevron {
        display: grid;
        transition: transform 0.2s;
      }
      .assign[open] .assign-chevron {
        transform: rotate(180deg);
      }
      .assign-body {
        padding: 4px 22px 22px 70px;
      }
      .assign-body h3 {
        margin: 10px 0 6px;
        font-size: 13px;
        color: var(--muted);
      }
      .assign-notes {
        white-space: pre-wrap;
        font-size: 15px;
        line-height: 1.6;
      }
      .assign-files {
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .assign-files .text-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .assign-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 20px;
        margin-top: 18px;
      }
      .assign-actions .button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .assign-done {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      @media (max-width: 600px) {
        .assign summary {
          flex-wrap: wrap;
          gap: 8px 12px;
        }
        .assign-copy {
          flex-basis: calc(100% - 100px);
        }
        .assign .dt-due {
          order: 0;
        }
        .assign-chevron {
          order: 1;
          margin-left: auto;
        }
        .assign-body {
          padding: 4px 16px 18px;
        }
      }

      /* Writing Studio: a quiet page to write on; pasted text sits on a yellow highlight. */
      .studio {
        max-width: 820px;
        margin: 0 auto;
      }
      .studio-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
      }
      .studio-back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 16px 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .studio-back .icon {
        transform: rotate(180deg);
      }
      .studio-saved {
        font-size: 13px;
        color: var(--muted);
      }
      .studio-head {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px;
        border-radius: 24px;
        background: color-mix(in srgb, var(--subject, var(--muted)) 16%, var(--card));
      }
      .studio-title {
        flex: 1 1 auto;
        display: grid;
        min-width: 0;
      }
      .studio-kicker {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .studio-title h1 {
        margin: 2px 0;
        font-size: clamp(24px, 3.4vw, 32px);
        line-height: 1.15;
        letter-spacing: -0.6px;
        overflow-wrap: anywhere;
      }
      .studio-title small {
        font-size: 13px;
        color: var(--muted);
      }
      .studio-brief {
        margin-top: 12px;
        padding: 12px 16px;
        border-radius: 16px;
        background: var(--soft);
      }
      .studio-brief summary {
        font-weight: 700;
        cursor: pointer;
      }
      .studio-brief div {
        margin-top: 8px;
        white-space: pre-wrap;
        line-height: 1.6;
      }
      .studio-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
        margin: 22px 0 10px;
      }
      .studio-chip {
        padding: 5px 12px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--chom-accent-sky) 26%, var(--card));
        font-size: 13px;
        font-weight: 700;
      }
      .studio-chip.pasted {
        background: var(--chom-accent-sunflower);
        color: var(--chom-on-accent);
      }
      .studio-legend {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        font-size: 13px;
        color: var(--muted);
      }
      .studio-legend i {
        width: 22px;
        height: 14px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--chom-accent-sunflower) 70%, transparent);
      }
      /* The text box sits over a copy of the essay that draws only the highlights, so both
         must lay text out identically: same font, size, padding and wrapping. */
      .studio-paper {
        position: relative;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 18px 40px -28px color-mix(in srgb, var(--ink) 45%, transparent);
      }
      .studio-paper:focus-within {
        border-color: color-mix(in srgb, var(--ink) 45%, var(--line));
        box-shadow:
          0 0 0 4px color-mix(in srgb, var(--chom-accent-sky) 25%, transparent),
          0 18px 40px -28px color-mix(in srgb, var(--ink) 45%, transparent);
      }
      .studio-text:focus-visible {
        outline: none;
      }
      .studio-mirror,
      .studio-text {
        margin: 0;
        padding: 36px 44px 48px;
        font: inherit;
        font-size: 18px;
        line-height: 1.75;
        letter-spacing: normal;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        word-break: normal;
        tab-size: 4;
      }
      .studio-mirror {
        position: absolute;
        inset: 0;
        overflow: hidden;
        color: transparent;
        pointer-events: none;
      }
      .studio-mirror mark {
        border-radius: 4px;
        background: color-mix(in srgb, var(--chom-accent-sunflower) 70%, transparent);
        color: transparent;
      }
      .studio-text {
        position: relative;
        display: block;
        width: 100%;
        min-height: 55vh;
        border: 0;
        outline: 0;
        resize: none;
        overflow: hidden;
        background: transparent;
        color: var(--ink);
      }
      .studio-text::placeholder {
        color: var(--muted);
      }
      /* On navy the highlight is softer, so the light text on it stays readable. */
      :root[data-theme="dark"] .studio-mirror mark,
      :root[data-theme="dark"] .studio-legend i {
        background: color-mix(in srgb, var(--chom-accent-sunflower) 46%, transparent);
      }
      .studio-note {
        margin: 14px 4px 0;
        font-size: 13px;
        color: var(--muted);
      }
      @media (max-width: 600px) {
        .studio-head {
          flex-wrap: wrap;
          padding: 16px;
        }
        .studio-mirror,
        .studio-text {
          padding: 22px 20px 32px;
          font-size: 16px;
        }
        .studio-legend {
          margin-left: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .assign-chevron {
          transition: none;
        }
      }
      /* School life: one bright card per service. */
      .life-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
      }
      .life-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        min-height: 220px;
        padding: 22px;
        border: 0;
        border-top: 6px solid var(--tone);
        border-radius: 24px;
        background: color-mix(in srgb, var(--tone) 18%, var(--card));
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .life-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px -18px color-mix(in srgb, var(--ink) 50%, transparent);
      }
      .life-icon {
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        margin-bottom: 12px;
        border-radius: 16px;
        background: var(--tone);
        color: var(--chom-on-accent);
      }
      .life-icon .icon {
        width: 26px;
        height: 26px;
      }
      .life-card strong {
        font-size: 20px;
        letter-spacing: -0.3px;
      }
      .life-copy {
        font-size: 14px;
        color: var(--muted);
      }
      .life-go {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: auto;
        padding: 8px 14px;
        border-radius: 999px;
        background: var(--card);
        font-size: 14px;
        font-weight: 700;
      }
      @media (prefers-reduced-motion: reduce) {
        .life-card {
          transition: none;
        }
        .life-card:hover {
          transform: none;
        }
      }
      /* Messages: a list of class teams and chats on the left, the open one on the right. */
      .msg {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        height: max(520px, calc(100vh - 230px));
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--card);
      }
      .msg-list {
        overflow-y: auto;
        padding: 14px 10px;
        border-right: 1px solid var(--line);
        background: var(--bg);
      }
      .msg-label {
        margin: 12px 10px 6px;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .msg-label:first-child {
        margin-top: 4px;
      }
      .msg-item {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 10px;
        border: 0;
        border-radius: 14px;
        background: none;
        color: var(--ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .msg-item:hover {
        background: var(--soft);
      }
      .msg-item.active {
        background: var(--card);
        box-shadow:
          inset 3px 0 0 var(--chom-accent-coral),
          0 6px 16px -12px color-mix(in srgb, var(--ink) 60%, transparent);
      }
      .msg-item-copy {
        flex: 1 1 auto;
        display: grid;
        min-width: 0;
      }
      .msg-item-copy strong,
      .msg-item-copy small {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .msg-item-copy strong {
        font-size: 14px;
      }
      .msg-item-copy small {
        font-size: 12px;
        color: var(--muted);
      }
      .msg-count {
        display: grid;
        place-items: center;
        min-width: 22px;
        height: 22px;
        padding: 0 6px;
        border-radius: 999px;
        background: var(--chom-accent-coral);
        color: var(--chom-on-accent);
        font-size: 12px;
        font-weight: 800;
      }
      .msg-avatar {
        display: grid;
        place-items: center;
        flex: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--tone);
        color: var(--chom-on-accent);
        font-size: 12px;
        font-weight: 800;
      }
      .msg-avatar.big {
        width: 40px;
        height: 40px;
        font-size: 14px;
      }
      .msg-pane {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .msg-back {
        display: none;
      }
      .msg-head {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--line);
      }
      .msg-head-copy h2 {
        margin: 0;
        font-size: 18px;
      }
      .msg-head-copy small {
        font-size: 13px;
        color: var(--muted);
      }
      .msg-tabs {
        display: flex;
        gap: 4px;
        padding: 0 18px;
        border-bottom: 1px solid var(--line);
      }
      .msg-tabs button {
        padding: 12px 10px 10px;
        border: 0;
        border-bottom: 3px solid transparent;
        background: none;
        color: var(--muted);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .msg-tabs button.active {
        border-bottom-color: var(--chom-accent-coral);
        color: var(--ink);
      }
      .msg-tabs button span {
        margin-left: 4px;
        padding: 1px 7px;
        border-radius: 999px;
        background: var(--soft);
        font-size: 12px;
      }
      .msg-feed {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        gap: 18px;
        overflow-y: auto;
        padding: 22px;
        background: color-mix(in srgb, var(--bg) 55%, var(--card));
      }
      .msg-post {
        display: flex;
        gap: 12px;
        max-width: 680px;
      }
      .msg-post-body {
        flex: 1 1 auto;
        min-width: 0;
      }
      .msg-post-meta {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px;
        margin-bottom: 6px;
        font-size: 14px;
      }
      .msg-post-meta span {
        font-size: 13px;
        color: var(--muted);
      }
      .msg-card {
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-left: 5px solid var(--subject, var(--muted));
        border-radius: 16px;
        background: var(--card);
      }
      .msg-card-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
      }
      .msg-card-head strong {
        flex: 1 1 200px;
        font-size: 15px;
      }
      .msg-card-icon {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: color-mix(in srgb, var(--subject, var(--muted)) 18%, var(--card));
      }
      .msg-card-icon .icon {
        width: 16px;
        height: 16px;
      }
      .msg-card-notes {
        display: -webkit-box;
        margin: 10px 0 0;
        overflow: hidden;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        font-size: 14px;
        line-height: 1.55;
        white-space: pre-wrap;
      }
      .msg-card-files {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin: 10px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .msg-card-open {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-top: 12px;
        padding: 7px 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .msg-card-open:hover {
        border-color: var(--ink);
      }
      .msg-files {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .msg-files a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        color: var(--ink);
      }
      .msg-files span {
        display: grid;
      }
      .msg-files small {
        font-size: 12px;
        color: var(--muted);
      }
      .msg-empty {
        display: grid;
        justify-items: center;
        gap: 14px;
        max-width: 420px;
        margin: auto;
        text-align: center;
        color: var(--muted);
      }
      .msg-empty .icon {
        box-sizing: content-box;
        width: 26px;
        height: 26px;
        padding: 16px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--chom-accent-lilac) 35%, var(--card));
        color: var(--ink);
      }
      .msg-empty p {
        margin: 0;
      }
      .msg-empty strong {
        color: var(--ink);
      }
      .msg-composer {
        display: flex;
        gap: 10px;
        margin: 0;
        padding: 14px 18px;
        border-top: 1px solid var(--line);
      }
      .msg-composer input {
        flex: 1 1 auto;
        min-width: 0;
        height: 44px;
        padding: 0 16px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--bg);
        color: var(--ink);
        font: inherit;
      }
      .msg-composer input::placeholder {
        color: var(--muted);
      }
      .msg-composer button {
        display: grid;
        place-items: center;
        flex: none;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 14px;
        background: var(--soft);
        color: var(--muted);
      }
      /* Phones: the list first; opening one shows it full width with a way back. */
      @media (max-width: 900px) {
        .msg {
          grid-template-columns: 1fr;
          height: calc(100vh - 290px);
          min-height: 460px;
        }
        .msg .msg-pane {
          display: none;
        }
        .msg.is-open .msg-list {
          display: none;
        }
        .msg.is-open .msg-pane {
          display: flex;
        }
        .msg-list {
          border-right: 0;
        }
        .msg-back {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          align-self: flex-start;
          margin: 12px 0 0 14px;
          padding: 6px 12px 6px 8px;
          border: 1px solid var(--line);
          border-radius: 999px;
          background: var(--card);
          color: var(--ink);
          font: inherit;
          font-size: 13px;
          font-weight: 700;
        }
        .msg-back .icon {
          transform: rotate(180deg);
        }
        .msg-head {
          padding: 12px 16px;
        }
        .msg-feed {
          padding: 16px;
        }
      }
      /* Bubbles that fill the page on the way into Study with Chom. */
      .study-bubbles {
        position: fixed;
        z-index: 1000;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        transition: opacity 0.45s ease;
      }
      .study-bubbles.done {

      /* ---------- Dark mode: one calm slate for coloured surfaces ----------

      :root[data-theme="dark"] .subject-badge {

            const id = studioTask;
            studioTask = null;
            assignOpen.add(id);
            render();
            $(`[data-assign="${id}"] summary`)?.focus();
          }
          if (a === "search") search();
          if (a === "search-go") {
            closeModal();
            taskFilter = b.dataset.taskFilter || "today";
            go(b.dataset.view);
            if (currentView === b.dataset.view) render();
          }
          if (a === "notifications") {
            state.notificationsRead = true;
            save();
            $("#notification-dot").hidden = true;
            modal(
              "Your little updates.",
              `<p>You’re all caught up.</p><p class="muted">Updates from your teachers and school will show here.</p>`,
            );
          }
          if (a === "profile")
            modal(
              "Your profile",
              `<div style="display:flex;align-items:center;gap:16px"><span class="avatar" style="width:54px;height:54px;font-size:17px">${esc(initials)}</span><div><h3 style="margin:0">${esc(me.fullName)}</h3><p class="muted">${esc(gradeLine)} · ${esc(me.schoolName)}</p></div></div><div class="notice">Signed in to ${esc(me.schoolName)}. Your subjects and teachers come from your school.</div><div class="form-actions"><button class="button secondary" data-action="search-go" data-view="settings">My preferences</button><a class="button" href="../">Sign out</a></div>`,
            );
          if (a === "service") {
            const info = serviceContent[b.dataset.service];
            if (info) modal(info[0], info[1]);
          }
          if (a === "reveal-algebra") {
            b.parentElement.querySelector("[data-answer]").hidden = false;
            b.hidden = true;
          }
          if (a === "open-tasks") {
            closeModal();
            go("tasks");
          }
          if (a === "essay-notes") {
            closeModal();
            go("chom");
            $("#study-notes")?.focus();
          }
          if (a === "save-notes") {
            state.notes = $("#study-notes").value;
            persist("Your notes are saved on this device.");
          }
          if (a === "quiz-next") {
            if (quizIndex < 2) {
              quizIndex++;
              quizQuestion();
            } else
              modal(
                "Look at that — you showed up.",
                `<div class="large-stat" style="text-align:center">${quizScore} / 3</div><p style="text-align:center">${quizScore === 3 ? "You’ve got the core ideas of osmosis." : "Every question is a chance to learn. Try again when you’re ready."}</p><div class="form-actions"><button class="button secondary" data-action="study" data-topic="quiz">Try again</button><button class="button" data-action="close-dialog">All done</button></div>`,
              );
          }
        });
        document.addEventListener("change", (e) => {
          if (e.target.matches("[data-task]")) {
            const t = state.tasks.find((t) => t.id === e.target.dataset.task);
            if (!t) return;
            const done = e.target.checked;
            t.done = done;
            saveDone(t, done);
            const id = t.id;
            save();
            if ($("#tasks-content")) $("#tasks-content").innerHTML = tasksMarkup();
            if ($("#dash-tasks")) $("#dash-tasks").innerHTML = dashTasks();
            $("#nav-task-count").textContent = remaining();
            refreshToday();
            if ($("#dash-hero")) $("#dash-hero").innerHTML = heroCopy();
            if ($(".assign")) {
              assignOpen.add(id);
              render();
            }
            const replacement = $$("[data-task]").find(
              (el) => el.dataset.task === id,
            );
            if (replacement) replacement.focus();
            else if ($(`[data-filter="${taskFilter}"]`))
              $(`[data-filter="${taskFilter}"]`).focus();
            announce(
              storageAvailable
                ? done
                  ? "One step forward. Task completed."
                  : "Task moved back to your to-do list."
                : "Updated for this visit. Browser storage is unavailable.",
            );
          }
          if (e.target.id === "focus-toggle") {
            state.focus = e.target.checked;
            document.body.classList.toggle("focus-mode", state.focus);
            persist("Your learning space has been updated.");
          }
        });
        document.addEventListener("input", (e) => {
          if (e.target.id === "global-search") searchResults(e.target.value);
          if (e.target.id === "studio-text") studioInput(e);
          if (e.target.id === "ask-input") {
            e.target.style.height = "auto";
            e.target.style.height = `${e.target.scrollHeight}px`;
          }
          if (e.target.id === "study-notes") {
            state.notes = e.target.value;
            save();
          }
        });
        document.addEventListener("submit", async (e) => {
          if (e.target.id === "ask-form") {
            e.preventDefault();
            const input = $("#ask-input"),
              q = input.value.trim();
            if (!q) return input.focus();
            input.value = "";
            input.style.height = "auto";
            study(askTopic(q), q, true);
            input.focus();
            return;
          }
          if (e.target.id === "add-live-task-form") {
            e.preventDefault();
            const f = new FormData(e.target),
              title = String(f.get("title") || "").trim(),
              dueOn = String(f.get("dueOn") || "");
            if (!title) {
              $("#task-title").setCustomValidity("Give your task a name.");
              $("#task-title").reportValidity();
              $("#task-title").addEventListener("input", () => $("#task-title").setCustomValidity(""), { once: true });
              return;
            }
            const submit = e.target.querySelector('[type="submit"]');
            submit.disabled = true;
            try {
              const r = await fetch("/api/student/tasks", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, dueOn: dueOn || null }),
              });
              if (!r.ok) throw new Error();
              const { task } = await r.json();
              const added = fromServer(task);
              state.tasks.push(added);
              taskFilter = added.when;
              closeModal();
              render();
              announce("A little more clarity. Your task is added.");
            } catch {
              submit.disabled = false;
              announce("Couldn’t add that. Check your connection and try again.");
            }
            return;
          }
        });
        $("#nav-overlay").addEventListener("click", () => {
          closeNav();
          $(".mobile-menu").focus();
        });
        document.addEventListener("keydown", (e) => {
          // Enter sends; Shift+Enter starts a new line.
          if (e.target.id === "ask-input" && e.key === "Enter" && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            e.target.form.requestSubmit();
          }
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            search();
          }
          if (e.key === "Escape" && $("#sidebar").classList.contains("open")) {
            closeNav();
            $(".mobile-menu").focus();
          }
          if (e.key === "Tab" && $("#sidebar").classList.contains("open")) {
            const focusable = $$("#sidebar a,#sidebar button").filter(
              (x) => x.getClientRects().length,
            );
            const first = focusable[0],
              last = focusable[focusable.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
          if (
            e.target.matches('[role="tab"]') &&
            ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)
          ) {
            e.preventDefault();
            const filters = ["today", "upcoming", "done"],
              i = filters.indexOf(taskFilter);
            taskFilter =
              e.key === "Home"
                ? "today"
                : e.key === "End"
                  ? "done"
                  : filters[(i + (e.key === "ArrowRight" ? 1 : 2)) % 3];
            $("#tasks-content").innerHTML = tasksMarkup();
            $(`[data-filter="${taskFilter}"]`).focus();
          }
        });
        // Writing Studio: text copied inside the essay isn't "from outside" when pasted back.
        document.addEventListener("copy", (e) => {
          if (e.target.id === "studio-text") studioClip = e.target.value.slice(e.target.selectionStart, e.target.selectionEnd);
        });
        document.addEventListener("cut", (e) => {
          if (e.target.id === "studio-text") studioClip = e.target.value.slice(e.target.selectionStart, e.target.selectionEnd);
        });
        document.addEventListener("dragstart", (e) => {
          if (e.target.id === "studio-text") studioClip = e.target.value.slice(e.target.selectionStart, e.target.selectionEnd);
        });
        document.addEventListener("beforeinput", (e) => {
          if (e.target.id === "studio-text") studioSelStart = e.target.selectionStart;
        });
        document.addEventListener("paste", (e) => {
          if (e.target.id === "studio-text") studioExternal = (e.clipboardData?.getData("text/plain") || "").replace(/\r\n/g, "\n") !== studioClip;
        });
        document.addEventListener("drop", (e) => {
          if (e.target.id === "studio-text") studioExternal = (e.dataTransfer?.getData("text/plain") || "").replace(/\r\n/g, "\n") !== studioClip;
        });
        // Remember which assignments are open, so a redraw (ticking one off) keeps them open.
        document.addEventListener(
          "toggle",
          (e) => {
            if (!e.target.matches?.("details[data-assign]")) return;
            if (e.target.open) assignOpen.add(e.target.dataset.assign);
            else assignOpen.delete(e.target.dataset.assign);
          },
          true,
        );
        window.addEventListener("hashchange", route);
        route();
      })();
    </script>
  </body>
</html>
