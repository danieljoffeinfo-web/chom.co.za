    <style>
      /* Chom Business design tokens. Light is the default; dark is opt-in from Settings. */
      :root {
        color-scheme: light;
        --bg: #eeebda;
        --paper: #f7f5eb;
        --card: #f7f5eb;
        --ink: #282b4a;
        --text: #282b4a;
        --muted: #5f6178;
        --line: #dcd8c3;
        --soft: #e4e0cb;
        --orange: #282b4a;
        --on-orange: #eeebda;
        --peach: #dcd8c3;
        --blue: #282b4a;
        --blue-hover: #383c63;
        --blue-soft: #e4e0cb;
        --ink-hover: #383c63;
        --accent-on-fill: #eeebda;
        --r: 24px;
        --sidebar: 248px;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #282b4a;
        --paper: #33375c;
        --card: #33375c;
        --ink: #eeebda;
        --text: #eeebda;
        --muted: #aba9b8;
        --line: #464a70;
        --soft: #3c4068;
        --blue: #eeebda;
        --blue-hover: #dcd8c3;
        --blue-soft: #3c4068;
        --ink-hover: #dcd8c3;
        --accent-on-fill: #282b4a;
        --orange: #eeebda;
        --on-orange: #282b4a;
        --peach: #464a70;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 "Inter Tight", Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a {
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
        padding: 0;
      }
      a {
        text-decoration: none;
      }
      svg {
        display: block;
        flex-shrink: 0;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 3px solid var(--orange);
        outline-offset: 4px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        color: var(--ink);
      }
      h1,
      h2,
      .wordmark {
        font-family:
          "Inter Tight", Inter, system-ui, sans-serif;
      }
      h1 {
        font-size: 36px;
        line-height: 1.15;
        letter-spacing: -0.43px;
        font-weight: 400;
      }
      h2 {
        font-size: 18px;
        letter-spacing: -0.15px;
        font-weight: 500;
      }
      h3 {
        font-size: 14px;
        font-weight: 500;
      }
      input,
      textarea,
      select {
        color: var(--text);
      }
      input::placeholder,
      textarea::placeholder {
        color: var(--muted);
        opacity: 1;
      }
      .icon {
        width: 20px;
        height: 20px;
        fill: currentColor;
        stroke: none;
      }
      .icon.small {
        width: 16px;
        height: 16px;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      .muted {
        color: var(--muted);
      }
      .skip-link {
        position: fixed;
        top: -100px;
        left: 20px;
        z-index: 100;
        padding: 12px 20px;
        background: var(--ink);
        color: var(--card);
        border-radius: 8px;
      }
      .skip-link:focus {
        top: 10px;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: var(--sidebar);
        background: var(--paper);
        border-right: 1px solid var(--line);
        z-index: 40;
        display: flex;
        flex-direction: column;
        padding: 24px 18px 18px 0;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 0 13px 0 26px;
      }
      .brand-logo {
        display: block;
        height: 30px;
        width: auto;
        color: var(--ink);
      }
      .wordmark {
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.47px;
      }
      .wordmark span {
        font-size: 12px;
        font-weight: 400;
        letter-spacing: -0.07px;
        margin-left: 5px;
        color: var(--muted);
      }
      .school-switch {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 30px 10px 22px 23px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
      }
      .school-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--soft);
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .school-switch strong {
        font-size: 12px;
        font-weight: 500;
        color: var(--ink);
        display: block;
      }
      .nav-label {
        font-size: 11px;
        color: var(--muted);
        margin: 0 13px 10px 26px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .nav a {
        padding: 11px 13px 11px 26px;
        display: flex;
        align-items: center;
        gap: 11px;
        border-radius: 0 24px 24px 0;
        font-weight: 500;
        font-size: 13px;
        min-height: 43px;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .nav a > .icon {
        width: 18px;
        height: 18px;
        color: var(--muted);
      }
      .nav a:hover {
        background: var(--soft);
      }
      .nav a.active {
        background: var(--blue-soft);
        color: var(--blue);
        font-weight: 500;
      }
      .nav a.active > .icon {
        color: var(--blue);
      }
      .nav .badge {
        margin-left: auto;
        font-size: 10px;
        min-width: 20px;
        height: 20px;
        border-radius: 6px;
        background: var(--line);
        color: var(--muted);
        display: grid;
        place-items: center;
      }
      .nav a.active .badge {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .nav.secondary {
        margin-top: 26px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding-top: 34px;
        padding-left: 18px;
      }
      .mini-chom {
        border-radius: 8px;
        background: var(--soft);
        padding: 16px;
      }
      .mini-chom .mini-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--ink);
      }
      .mini-chom .mini-title .icon {
        color: var(--blue);
      }
      .mini-chom p {
        font-size: 11px;
        line-height: 1.65;
        margin-top: 7px;
        color: var(--muted);
      }
      .mini-chom button {
        font-size: 11px;
        font-weight: 500;
        margin-top: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        color: var(--blue);
      }
      .sidebar-footer {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: var(--muted);
        padding: 17px 11px 0;
      }
      .sidebar-footer i {
        width: 5px;
        height: 5px;
        background: var(--muted);
        border-radius: 50%;
      }
      .shell {
        margin-left: var(--sidebar);
      }
      .notification-dot {
        position: absolute;
        top: 6px;
        right: 7px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--ink);
        box-shadow: 0 0 0 2px var(--card);
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 35px;
        height: 35px;
        background: var(--blue-soft);
        border: 3px solid var(--card);
        box-shadow: 0 0 0 1px var(--line);
        border-radius: 50%;
        font-weight: 500;
        font-size: 11px;
        color: var(--blue);
      }
      .mobile-close {
        display: none;
      }
      .page {
        max-width: 1500px;
        margin: auto;
        padding: 34px 36px 26px;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 28px;
      }
      .greeting {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .page-heading p {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .page-heading p strong {
        font-weight: 500;
        color: var(--ink);
      }
      .date-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 12px;
        white-space: nowrap;
        font-size: 11px;
        color: var(--muted);
      }
      .dashboard {
        display: grid;
        grid-template-columns: minmax(0, 1.65fr) minmax(290px, 1fr);
        gap: 24px;
      }
      .main-column,
      .right-column {
        display: flex;
        flex-direction: column;
        gap: 24px;
        min-width: 0;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        overflow: hidden;
      }
      .panel-head {
        padding: 22px 24px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .panel-head > .icon {
        color: var(--muted);
      }
      .panel-title {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .count {
        min-width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: var(--soft);
        font-size: 11px;
        font-weight: 500;
        color: var(--muted);
      }
      .text-button {
        font-size: 12px;
        font-weight: 500;
        color: var(--blue);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .text-button:hover {
        text-decoration: underline;
      }
      .button {
        background: var(--ink);
        color: var(--card);
        padding: 8px 24px;
        border-radius: 4px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        letter-spacing: 0.25px;
        font-weight: 500;
        min-height: 36px;
        transition: background 0.15s;
      }
      .button:hover {
        background: var(--ink-hover);
      }
      .button.secondary {
        background: var(--card);
        color: var(--blue);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      .button.secondary:hover {
        background: var(--soft);
      }
      .button.outline {
        background: var(--card);
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .filter-row {
        display: flex;
        gap: 22px;
        padding: 0 24px;
        border-bottom: 1px solid var(--line);
      }
      .filter {
        position: relative;
        font-size: 12px;
        color: var(--muted);
        padding: 0 0 13px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .filter.active {
        color: var(--ink);
        font-weight: 500;
      }
      .filter.active:after {
        position: absolute;
        content: "";
        bottom: -1px;
        height: 2px;
        left: 0;
        right: 0;
        background: var(--ink);
        border-radius: 4px;
      }
      .filter span {
        font-size: 10px;
        font-weight: 500;
        line-height: 16px;
        min-width: 16px;
        border-radius: 4px;
        background: var(--soft);
        color: var(--muted);
      }
      .task-list {
        padding: 0 24px;
      }
      .task-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 17px 0;
        border-bottom: 1px solid var(--soft);
        min-height: 72px;
      }
      .task-row:last-child {
        border: 0;
      }
      .task-check {
        display: flex;
        align-items: center;
        cursor: pointer;
        min-height: 24px;
      }
      .task-check input {
        appearance: none;
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--line);
        border-radius: 5px;
        margin: 0;
        cursor: pointer;
        background: var(--card);
        display: grid;
        place-items: center;
      }
      .task-check input:checked {
        background: var(--ink);
        border-color: var(--ink);
      }
      .task-check input:checked:after {
        content: "";
        display: block;
        width: 7px;
        height: 4px;
        border: solid var(--card);
        border-width: 0 0 1.7px 1.7px;
        transform: rotate(-45deg) translateY(-1px);
      }
      .task-content {
        flex: 1;
        min-width: 0;
      }
      .task-name {
        font-size: 13px;
        font-weight: 500;
        display: block;
        overflow-wrap: anywhere;
      }
      .task-sub {
        color: var(--muted);
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
      }
      .subject-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        display: inline-block;
        background: var(--ink);
      }
      .subject-dot.English {
        background: var(--ink);
      }
      .subject-dot.History {
        background: var(--muted);
      }
      .subject-dot.Afrikaans {
        background: var(--muted);
      }
      .subject-dot.Science {
        background: var(--ink);
      }
      .task-row.completed .task-name {
        color: var(--muted);
        text-decoration: line-through;
        font-weight: 400;
      }
      .due {
        font-size: 10px;
        color: var(--blue);
        padding: 4px 8px;
        background: var(--blue-soft);
        border-radius: 5px;
        white-space: nowrap;
      }
      .due.done {
        background: none;
        color: var(--muted);
        padding-right: 0;
      }
      .task-more {
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        padding: 14px 24px;
        border-top: 1px solid var(--line);
        display: block;
        width: 100%;
        background: var(--card);
      }
      .task-more:hover {
        background: var(--soft);
      }
      .task-empty {
        padding: 28px 0;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .schedule-subtitle {
        color: var(--muted);
        font-size: 11px;
        margin-top: 4px;
      }
      .icon-link {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        color: var(--muted);
      }
      .icon-link:hover {
        background: var(--soft);
        color: var(--blue);
      }
      .schedule-days {
        display: flex;
        margin: 0 24px 16px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      .day {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        flex: 1;
        padding: 4px 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .day b {
        width: 36px;
        height: 36px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        font-size: 18px;
        font-weight: 400;
        letter-spacing: 0;
        color: var(--text);
        transition: background 0.15s;
      }
      .day.today {
        color: var(--blue);
      }
      .day.today b {
        color: var(--blue);
      }
      .day.selected b {
        background: var(--ink);
        color: var(--card);
      }
      .day:hover:not(.selected) b {
        background: var(--soft);
      }
      .schedule-list {
        list-style: none;
        margin: 0;
        padding: 0 24px 10px;
        position: relative;
      }
      .schedule-list:before {
        content: "";
        position: absolute;
        left: 81px;
        top: 18px;
        bottom: 28px;
        width: 1px;
        background: var(--line);
      }
      .slot {
        display: grid;
        grid-template-columns: 38px minmax(0, 1fr);
        gap: 12px;
        align-items: start;
      }
      .slot-time {
        font-size: 11px;
        color: var(--muted);
        padding-top: 11px;
        font-variant-numeric: tabular-nums;
      }
      .slot-body {
        position: relative;
        padding: 9px 12px 10px 26px;
        border-radius: 8px;
        margin-bottom: 2px;
      }
      .slot-body:before {
        content: "";
        position: absolute;
        left: 4px;
        top: 15px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--c);
        border: 0;
        box-sizing: border-box;
      }
      .slot-body h3 {
        font-size: 13px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .slot-body p {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      .slot.now .slot-time {
        color: var(--blue);
        font-weight: 500;
      }
      .slot.now .slot-body {
        background: var(--blue-soft);
      }
      .slot.now .slot-body:before {
        background: var(--ink);
        border-color: var(--ink);
        box-shadow: 0 0 0 3px rgba(255, 90, 31, 0.2);
      }
      .now-tag {
        font-size: 10px;
        font-weight: 500;
        color: var(--blue);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .slot.break .slot-time {
        padding-top: 7px;
        color: var(--muted);
      }
      .slot.break .slot-body {
        padding-top: 6px;
        padding-bottom: 6px;
      }
      .slot.break .slot-body:before {
        top: 12px;
        left: 5px;
        width: 5px;
        height: 5px;
        border: 0;
        background: var(--line);
      }
      .slot.break .slot-body p {
        margin: 0;
        font-style: italic;
        color: var(--muted);
      }
      .classes {
        margin-bottom: 28px;
      }
      .classes-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .classes-head h2 {
        font-size: 22px;
        font-weight: 400;
      }
      .subject-tiles {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: 24px;
      }
      .course-card {
        grid-column: span 3;
        display: flex;
        flex-direction: column;
        text-align: left;
        min-width: 0;
        border: 1px solid color-mix(in srgb, var(--c) 18%, var(--line));
        border-radius: 12px;
        overflow: hidden;
        background: var(--card);
        transition:
          box-shadow 0.2s,
          border-color 0.2s;
      }
      .course-card:nth-child(n + 5) {
        grid-column: span 4;
      }
      .course-card:hover {
        border-color: color-mix(in srgb, var(--c) 40%, var(--card));
        box-shadow:
          0 1px 2px 0 rgba(60, 64, 67, 0.3),
          0 2px 6px 2px rgba(60, 64, 67, 0.15);
      }
      .course-banner {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 100px;
        padding: 16px 84px 16px 16px;
        color: color-mix(in srgb, var(--c) 72%, #000);
        border-top: 4px solid var(--c);
        background:
          radial-gradient(circle at 88% 135%, color-mix(in srgb, var(--c) 10%, transparent) 0 34%, transparent 34.5%),
          color-mix(in srgb, var(--c) 9%, var(--card));
      }
      .course-name {
        font-size: 22px;
        line-height: 1.25;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .course-card:hover .course-name {
        text-decoration: underline;
      }
      .course-sub {
        font-size: 13px;
        margin-top: 4px;
        color: color-mix(in srgb, var(--c) 45%, var(--ink));
      }
      .course-avatar {
        position: absolute;
        right: 16px;
        bottom: -36px;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: color-mix(in srgb, var(--c) 20%, var(--card));
        border: 3px solid var(--card);
        box-shadow: 0 1px 3px rgba(60, 64, 67, 0.18);
        font-size: 22px;
        font-weight: 500;
        color: color-mix(in srgb, var(--c) 78%, #000);
      }
      .course-body {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 16px 96px 18px 16px;
        min-height: 82px;
      }
      .course-label {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.2px;
      }
      .course-next {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .course-card.live .course-next {
        color: #1e8e3e;
        font-weight: 500;
      }
      .course-next i,
      .now-tag:before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #1e8e3e;
        display: inline-block;
      }
      .course-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
        padding: 10px 16px;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .course-foot .icon {
        color: var(--muted);
      }
      .lesson-list {
        list-style: none;
        padding: 0;
        margin: 12px 0 0;
      }
      .lesson-list li {
        display: flex;
        justify-content: space-between;
        padding: 11px 0;
        border-top: 1px solid var(--line);
        font-size: 13px;
      }
      .lesson-list li span:last-child {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .schedule-footer {
        padding: 1px 24px 20px;
      }
      .schedule-footer a {
        font-size: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        color: var(--muted);
      }
      .schedule-footer a:hover {
        color: var(--blue);
      }
      .assignment-list {
        padding: 0 24px 6px;
      }
      .assignment-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        border-top: 1px solid var(--line);
        padding: 18px 0;
      }
      .assignment-row:hover .assignment-name {
        text-decoration: underline;
      }
      .subject-icon {
        width: 36px;
        height: 39px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--blue-soft);
        color: var(--blue);
      }
      .subject-icon.mint {
        background: var(--soft);
        color: var(--muted);
      }
      .assignment-copy {
        flex: 1;
        min-width: 0;
      }
      .assignment-name {
        display: block;
        font-size: 13px;
        font-weight: 500;
      }
      .assignment-meta {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .assignment-progress {
        width: 64px;
        flex-shrink: 0;
        font-size: 10px;
        color: var(--muted);
      }
      .assignment-progress .track {
        margin-top: 6px;
      }
      .track {
        height: 4px;
        display: block;
        border-radius: 8px;
        background: var(--soft);
        overflow: hidden;
      }
      .track i {
        display: block;
        height: 100%;
        width: var(--value);
        background: var(--ink);
        border-radius: 8px;
      }
      .progress-panel {
        padding: 23px 24px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
      }
      .progress-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .progress-head .icon {
        color: var(--muted);
      }
      .progress-visual {
        display: flex;
        gap: 19px;
        align-items: center;
        margin: 24px 0 20px;
      }
      .progress-ring {
        position: relative;
        width: 76px;
        height: 76px;
        flex: none;
        display: grid;
        place-items: center;
      }
      .progress-ring svg {
        position: absolute;
        inset: 0;
        width: 76px;
        height: 76px;
        transform: rotate(-90deg);
      }
      .progress-ring strong {
        font-size: 20px;
        color: var(--ink);
        letter-spacing: -0.22px;
        font-weight: 500;
      }
      .progress-message strong {
        font-size: 14px;
        font-weight: 500;
      }
      .progress-message p {
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
        max-width: 175px;
        margin-top: 5px;
      }
      .progress-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--line);
        padding-top: 15px;
        font-size: 11px;
        color: var(--muted);
      }
      .progress-foot button {
        font-size: 11px;
        font-weight: 500;
        color: var(--blue);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .school-panel .panel-head {
        padding-bottom: 10px;
      }
      .school-links {
        padding: 0 24px 12px;
      }
      .school-link {
        display: flex;
        align-items: center;
        width: 100%;
        text-align: left;
        gap: 11px;
        padding: 13px 0;
        border-bottom: 1px solid var(--soft);
      }
      .school-link:last-child {
        border: 0;
      }
      .school-link > .icon {
        color: var(--muted);
        width: 18px;
        height: 18px;
      }
      .school-link span {
        flex: 1;
        font-size: 12px;
        font-weight: 500;
      }
      .school-link small {
        font-size: 10px;
        color: var(--muted);
      }
      .school-link:hover span {
        text-decoration: underline;
      }
      .page-footer {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-top: 28px;
        color: var(--muted);
        font-size: 10px;
      }
      .page-footer span:first-child {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .page-footer .icon {
        width: 12px;
        height: 12px;
      }
      .overlay {
        display: none;
      }
      .view-header {
        margin-bottom: 28px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
      }
      .view-header p {
        font-size: 14px;
        color: var(--muted);
        margin-top: 12px;
        max-width: 650px;
      }
      .content-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }
      .content-card {
        padding: 27px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
      }
      .content-card p {
        color: var(--muted);
        font-size: 13px;
        margin-top: 9px;
      }
      .content-card .button {
        margin-top: 22px;
      }
      .content-card h2 {
        margin: 15px 0 0;
      }
      .content-card .subject-icon {
        width: 44px;
        height: 46px;
      }
      .large-stat {
        font-size: 42px;
        font-weight: 400;
        letter-spacing: -0.50px;
        color: var(--ink);
        margin-top: 14px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      .data-table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      .data-table th {
        text-align: left;
        font-weight: 500;
        font-size: 11px;
        color: var(--muted);
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
      }
      .data-table td {
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }
      .data-table tr:last-child td {
        border: 0;
      }
      .data-table td:first-child {
        font-weight: 500;
      }
      .empty-message {
        padding: 40px 28px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }
      .info-strip {
        padding: 15px 19px;
        border-radius: 8px;
        background: var(--blue-soft);
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 24px;
      }
      .section-title {
        margin: 30px 0 18px;
      }
      .week-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(140px, 1fr));
        gap: 14px;
        padding: 24px;
        min-width: 780px;
      }
      .week-col h3 {
        font-size: 13px;
        margin-bottom: 18px;
      }
      .week-class {
        border-left: 4px solid var(--c);
        border-radius: 0 8px 8px 0;
        background: color-mix(in srgb, var(--c) 7%, var(--card));
        padding: 12px;
        margin-bottom: 11px;
        font-size: 12px;
      }
      .week-class strong {
        display: block;
        margin: 4px 0;
        font-size: 12px;
        font-weight: 500;
      }
      .week-class small {
        font-size: 10px;
        color: var(--muted);
      }
      .week-class time {
        font-size: 11px;
        color: var(--muted);
      }
      .notes-area {
        width: 100%;
        border: 1px solid var(--line);
        padding: 14px;
        border-radius: 8px;
        background: var(--soft);
        min-height: 170px;
        resize: vertical;
        font-size: 13px;
        line-height: 1.75;
      }
      .field {
        margin: 20px 0;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 500;
        margin-bottom: 8px;
      }
      .field input,
      .field select {
        display: block;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px 13px;
        background: var(--card);
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .form-actions {
        display: flex;
        gap: 9px;
        justify-content: flex-end;
        margin-top: 25px;
      }
      .notice {
        font-size: 12px;
        line-height: 1.65;
        background: var(--soft);
        color: var(--muted);
        padding: 14px 16px;
        border-radius: 8px;
        margin-top: 22px;
      }
      .dialog {
        border: 1px solid var(--line);
        border-radius: 8px;
        width: min(580px, calc(100% - 32px));
        padding: 0;
        color: var(--text);
        box-shadow: 0 24px 100px #20212425;
        max-height: calc(100dvh - 48px);
        background: var(--card);
      }
      .dialog::backdrop {
        background: #20212445;
        backdrop-filter: blur(5px);
      }
      .dialog-header {
        padding: 25px 26px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        border-bottom: 1px solid var(--line);
      }
      .dialog-header h2 {
        font-size: 21px;
        letter-spacing: -0.20px;
      }
      .dialog-close {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--soft);
        color: var(--muted);
      }
      .dialog-body {
        padding: 24px 26px 28px;
        font-size: 14px;
        line-height: 1.7;
      }
      .dialog-body > p {
        color: var(--muted);
      }
      .dialog-body h3 {
        margin-top: 20px;
      }
      .dialog-body ul,
      .dialog-body ol {
        padding-left: 20px;
        color: var(--muted);
      }
      .dialog-body li {
        margin: 10px 0;
      }
      .dialog-body .search-field {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 13px;
      }
      .search-field input {
        border: 0;
        outline: none;
        width: 100%;
        background: none;
      }
      .search-field:focus-within {
        outline: 3px solid rgba(255, 90, 31, 0.2);
        border-color: var(--line);
      }
      .search-results {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .search-result {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 11px;
        border-radius: 8px;
        text-align: left;
      }
      .search-result:hover {
        background: var(--soft);
      }
      .search-result small {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }
      .search-result strong {
        font-weight: 500;
      }
      .topic-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 22px;
      }
      .topic-option {
        text-align: left;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }
      .topic-option:hover {
        background: var(--soft);
      }
      .topic-option .icon {
        color: var(--blue);
      }
      .topic-option span {
        flex: 1;
      }
      .topic-option small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 4px;
      }
      .study-example {
        padding: 22px;
        background: var(--blue-soft);
        border-radius: 8px;
        margin: 20px 0;
        font-size: 19px;
        font-weight: 500;
        text-align: center;
        color: var(--blue);
      }
      .quiz-answers {
        display: grid;
        gap: 10px;
        margin-top: 20px;
      }
      .quiz-answer {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        text-align: left;
      }
      .quiz-answer:hover {
        background: var(--soft);
      }
      .quiz-answer.correct {
        border-color: var(--ink);
        background: var(--blue-soft);
        opacity: 1;
      }
      .quiz-answer.incorrect {
        border-color: var(--muted);
        background: var(--soft);
        opacity: 1;
      }
      .quiz-feedback {
        font-size: 13px;
        margin-top: 20px;
        color: var(--muted);
        min-height: 26px;
      }
      .toast {
        position: fixed;
        bottom: 26px;
        left: calc(50% + var(--sidebar) / 2);
        transform: translate(-50%, 12px);
        padding: 13px 21px;
        background: var(--ink);
        color: var(--card);
        font-size: 13px;
        border-radius: 8px;
        box-shadow: 0 6px 22px #20212415;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
        max-width: calc(100% - 32px);
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .storage-warning {
        margin: 0 0 22px;
        padding: 14px 16px;
        border-radius: 8px;
        background: var(--soft);
        font-size: 13px;
        color: var(--muted);
      }
      .note-card {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--blue-soft);
        padding: 20px;
        border-radius: 8px;
        line-height: 1.75;
        color: var(--muted);
        margin: 18px 0;
      }
      .switch-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
        gap: 20px;
      }
      .switch-row label {
        font-size: 14px;
      }
      .switch-row input {
        accent-color: var(--blue);
        width: 18px;
        height: 18px;
      }
      .task-tools {
        display: flex;
        gap: 9px;
      }
      .focus-mode .school-panel,
      .focus-mode .mini-chom {
        display: none;
      }
      @keyframes text-focus {
        from {
          opacity: 0;
          filter: blur(4px);
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .page-heading h1,
        .view-header h1 {
          animation: text-focus 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .page-heading > div > p,
        .view-header p {
          animation: text-focus 0.65s cubic-bezier(0.22, 1, 0.36, 1) 60ms both;
        }
      }
      @media (max-width: 1200px) {
        :root {
          --sidebar: 200px;
        }
        .sidebar {
          padding-left: 13px;
          padding-right: 13px;
        }
        .page {
          padding-left: 26px;
          padding-right: 26px;
        }
        .dashboard {
          gap: 20px;
          grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr);
        }
        .main-column,
        .right-column {
          gap: 20px;
        }
        h1 {
          font-size: 32px;
        }
        .panel-head {
          padding: 21px 21px 17px;
        }
        .task-list,
        .assignment-list {
          padding-left: 21px;
          padding-right: 21px;
        }
        .date-pill {
          font-size: 10px;
        }
      }
      @media (max-width: 1050px) {
        :root {
          --sidebar: 184px;
        }
        .brand {
          padding: 0 7px;
          gap: 7px;
        }
        .wordmark {
          font-size: 27px;
        }
        .wordmark span {
          font-size: 10px;
        }
        .brand-mark {
          width: 29px;
          height: 29px;
        }
        .sidebar {
          padding-left: 10px;
          padding-right: 10px;
        }
        .nav a {
          font-size: 12px;
          gap: 10px;
        }
        .page {
          padding-left: 23px;
          padding-right: 23px;
        }
        .page-heading {
          align-items: flex-start;
        }
        .date-pill {
          display: none;
        }
        .dashboard {
          grid-template-columns: minmax(0, 1fr);
        }
        .right-column {
          display: grid;
          grid-template-columns: 1fr 1fr;
          align-items: start;
        }
        .content-grid {
          gap: 18px;
        }
      }
      @media (max-width: 900px) {
        :root {
          --sidebar: 0px;
        }
        .course-card,
        .course-card:nth-child(n + 5) {
          grid-column: span 6;
        }
        .course-card:last-child {
          grid-column: span 12;
        }
        .sidebar {
          width: 245px;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
          padding: 25px 20px;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .sidebar .wordmark {
          font-size: 28px;
        }
        .sidebar .brand-mark {
          width: 31px;
          height: 31px;
        }
        .sidebar .nav a {
          font-size: 13px;
        }
        .sidebar .brand {
          padding-left: 8px;
        }
        .mobile-close {
          display: grid;
          position: absolute;
          right: 15px;
          top: 27px;
          width: 28px;
          height: 28px;
          place-items: center;
        }
        .overlay.open {
          display: block;
          position: fixed;
          inset: 0;
          background: #2021243f;
          z-index: 35;
          backdrop-filter: blur(3px);
        }
        .avatar {
          width: 32px;
          height: 32px;
          font-size: 10px;
        }
        .page {
          padding: 28px 24px 24px;
        }
        .page-heading {
          margin-bottom: 24px;
        }
        h1 {
          font-size: 32px;
          letter-spacing: -0.37px;
        }
        .page-heading p {
          font-size: 13px;
          margin-top: 10px;
        }
        .right-column {

      /* Shared floating actions leave every page header free of application chrome. */
      .page {
        padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px));
      }
      #main:focus {
        outline: none;
      }
      .quick-actions {
        position: fixed;
        right: max(28px, env(safe-area-inset-right, 0px));
        bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 7px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        box-shadow:
          0 8px 32px rgba(20, 20, 20, 0.06),
          0 2px 6px rgba(20, 20, 20, 0.06);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .quick-button {
        display: grid;
        place-items: center;
        position: relative;
        width: 44px;
        height: 44px;
        flex: none;
        border-radius: 8px;
        color: var(--muted);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .quick-button > .icon {
        width: 20px;
        height: 20px;
      }
      .quick-button:hover,
      .quick-button:focus-visible {
        background: var(--blue-soft);
        color: var(--blue);
      }
      .quick-button .notification-dot {
        top: 9px;
        right: 10px;
      }
      .quick-button .avatar {
        width: 32px;
        height: 32px;
        border: 2px solid var(--card);
        font-size: 10px;
      }
      .quick-button::after {
        content: attr(data-hint);
        position: absolute;
        left: 50%;
        bottom: calc(100% + 17px);
        transform: translate(-50%, 3px);
        padding: 6px 9px;
        border-radius: 7px;
        background: var(--ink);
        color: var(--card);
        font-size: 11px;
        line-height: 1.4;
        white-space: nowrap;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.15s,
          transform 0.15s;
      }
      .quick-button:focus-visible::after {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .dock-divider {
        width: 1px;
        height: 22px;
        background: var(--line);
        margin: 0 4px;
      }
      .quick-actions .mobile-menu,
      .dock-divider.mobile-only {
        display: none;
      }
      .toast {
        bottom: calc(103px + env(safe-area-inset-bottom, 0px));
      }
      @media (hover: hover) and (pointer: fine) {
        .quick-button:hover::after {
          opacity: 1;
          transform: translate(-50%, 0);
        }
      }
      @media (max-width: 900px) {
        .quick-actions {
          left: 50%;
          right: auto;
          transform: translateX(-50%);
          bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        }
        .quick-actions .mobile-menu {
          display: grid;
        }
        .dock-divider.mobile-only {
          display: block;
        }
        .toast {
          bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        }
      }

        margin-top: 8px;
      }
      .cd-section .cd-head {
        padding: 0 0 20px;
      }
      .cd-assign {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        padding: 0 24px 24px;
      }
      .cd-acard,
      .cd-class,
      .cd-service {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
        padding: 20px;
        border: 1px solid var(--line);
        text-align: left;
        color: var(--ink);
        transition: border-color 0.15s;
      }
      .cd-acard:hover,
      .cd-class:hover,
      .cd-service:hover {
        border-color: var(--ink);
      }
      .cd-acard {
        border-radius: 16px;
        background: var(--bg);
      }
      .cd-aicon {
        width: 48px;
        height: 48px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: var(--blue-soft);
        color: var(--blue);
      }
      .cd-acard strong,
      .cd-class strong,
      .cd-service strong {
        display: block;
        font-size: 18px;
        font-weight: 800;
      }
      .cd-acard small,
      .cd-service small {
        display: block;
        margin-top: 4px;
        font-size: 14px;
        color: var(--muted);
      }
      .cd-bar-label {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 700;
      }
      .cd-bar {
        display: block;
        height: 8px;
        margin-top: 8px;
        border-radius: 8px;
        background: var(--line);
        overflow: hidden;
      }
      .cd-bar i {
        display: block;
        height: 100%;
        width: var(--value);
        border-radius: 8px;
        background: var(--orange);
      }
      .cd-classes {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
      }
      .cd-class {
        border-radius: 24px;
        background: var(--card);
      }
      .cd-class-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .cd-avatar {
        width: 44px;
        height: 44px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--bg);
        border: 1px solid var(--line);
        font-size: 15px;
        font-weight: 800;
      }
      .cd-class small {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }
      .cd-next {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .cd-next span {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .cd-next b {
        font-size: 15px;
        font-weight: 700;
      }
      .cd-class.live {
        background: var(--ink);
        border-color: var(--ink);
        color: var(--card);
      }
      .cd-class.live small {
        color: var(--card);
      }
      .cd-class.live .cd-avatar {
        background: var(--orange);
        border-color: var(--orange);
        color: var(--on-orange);
      }
      .cd-class.live .cd-next {
        border-top-color: var(--muted);
      }
      .cd-class.live .cd-next span {
        color: var(--accent-on-fill);
      }
      .cd-beyond {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
      .cd-service {
        gap: 20px;
        padding: 24px;
        border-radius: 24px;
        background: var(--card);
      }
      .cd-service > .icon {
        width: 40px;
        height: 40px;
        color: var(--orange);
      }
      .page-footer {
        color: var(--muted);
        border-color: var(--line);
        font-size: 13px;
        flex-wrap: wrap;
      }
      .now-tag:before {
        display: none;
      }
      @media (max-width: 520px) {
        .cd {
          gap: 32px;
        }
        .cd-head {
          padding: 20px 20px 12px;
        }
        .cd-assign {
          padding: 0 20px 20px;
        }
        .cd-now {
          padding: 20px;
        }
        .cd-num {
          font-size: 36px;
        }
        .cd-stats,
        .cd-classes {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 16px;
        }
        .cd-class {
          padding: 16px;
        }
        .schedule-panel .schedule-days,
        .schedule-panel .schedule-list,
        .schedule-panel .schedule-footer {
          margin-left: 16px;
          margin-right: 16px;
          padding-left: 0;
          padding-right: 0;
        }
      }
      /* Dashboard task list */
      .dt-all {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--ink);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
      }
      .dt-all:hover {
        background: var(--ink);
        color: var(--card);
      }
      .dt-group {
        padding: 8px 24px 16px;
      }
      .dt-group + .dt-group {
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .dt-group:last-child {
        padding-bottom: 24px;
      }
      .dt-group-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.2px;
        color: var(--ink);
      }
      .dt-group-title span {
        font-size: 14px;
        font-weight: 700;
        color: var(--muted);
      }
      .dt-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .dt-row {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 64px;
        padding: 12px 16px 12px 20px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--bg);
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .dt-row:hover {
        border-color: var(--ink);
      }
      .dt-copy {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .dt-name {
        font-size: 16px;
        font-weight: 700;
        color: var(--ink);
        overflow-wrap: anywhere;
      }
      .dt-subject {
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
      }
      .dt-due {
        flex-shrink: 0;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--peach);
        color: var(--ink);
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }
      .dt-due.is-done {
        background: none;
        color: var(--muted);
        padding-right: 0;
      }
      .dt-check {
        appearance: none;
        flex-shrink: 0;
        width: 28px;
        height: 28px;
        margin: 0;
        border: 2px solid var(--ink);
        border-radius: 8px;
        background: var(--card);
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .dt-check:checked {
        background: var(--ink);
      }
      .dt-check:checked:after {
        content: "";
        width: 10px;
        height: 6px;
        border: solid var(--card);
        border-width: 0 0 2.5px 2.5px;
        transform: rotate(-45deg) translateY(-1px);
      }
      .dt-row.done {
        background: none;
      }
      .dt-row.done .dt-name {
        color: var(--muted);
        text-decoration: line-through;
        font-weight: 600;
      }
      @media (max-width: 520px) {
        .dt-group {
          padding-left: 16px;
          padding-right: 16px;
        }
        .dt-row {
          flex-wrap: wrap;
          padding: 12px 14px;
          gap: 8px 12px;
        }
        .dt-copy {
          flex-basis: calc(100% - 44px);
        }
        .dt-due {
          order: 3;
        }
        .dt-check {
          order: 2;
        }
      }
      /* Panel headers: title left, action right */
      .cd .panel > .cd-head {
        align-items: center;
        padding: 24px 24px 16px;
      }
      .cd .panel > .cd-head .text-button,
      .cd .panel > .cd-head .dt-all {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 0 18px;
        border: 1px solid var(--ink);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 700;
        color: var(--ink);
        text-decoration: none;
      }
      .cd .panel > .cd-head .text-button:hover,
      .cd .panel > .cd-head .dt-all:hover {
        background: var(--ink);
        color: var(--card);
      }
      .dt-group {
        padding-top: 12px;
      }
      @media (max-width: 520px) {
        .cd .panel > .cd-head {
          padding: 20px 16px 16px;
        }
      }
      .cd + .page-footer {
        max-width: 1180px;
        margin-left: auto;
        margin-right: auto;
      }
      .sign-out {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        margin-top: 12px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 16px;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink);
      }
      .sign-out:hover {
        border-color: var(--ink);
        background: var(--soft);
      }
    </style>

00781 -126.597656 69.203125 -114.929688 69.203125 -100.796875 C 69.203125 -86.398438 73.800781 -74.664062 83 -65.59375 C 92.195312 -56.53125 103.332031 -52 116.40625 -52 Z M 116.40625 -52"/><path transform="translate(841.792207 810.576174)" d="M 217.203125 -100.796875 L 217.203125 0 L 160.40625 0 L 160.40625 -100.796875 C 160.40625 -118.128906 156.335938 -130.59375 148.203125 -138.1875 C 140.066406 -145.789062 129.597656 -149.59375 116.796875 -149.59375 C 109.867188 -149.59375 103.335938 -147.394531 97.203125 -143 C 91.066406 -138.601562 86.128906 -132.738281 82.390625 -125.40625 C 78.660156 -118.070312 76.796875 -109.867188 76.796875 -100.796875 L 76.796875 0 L 20 0 L 20 -202 L 76.796875 -202 L 76.796875 -188 C 81.328125 -193.601562 88.523438 -198.070312 98.390625 -201.40625 C 108.265625 -204.738281 117.601562 -206.40625 126.40625 -206.40625 C 141.332031 -206.40625 154.992188 -203.40625 167.390625 -197.40625 C 179.796875 -191.40625 188.929688 -183.738281 194.796875 -174.40625 C 201.203125 -182.9375 208.671875 -189.535156 217.203125 -194.203125 C 225.734375 -198.867188 234.398438 -202.066406 243.203125 -203.796875 C 252.003906 -205.535156 259.867188 -206.40625 266.796875 -206.40625 C 287.597656 -206.40625 304.796875 -201.671875 318.390625 -192.203125 C 331.992188 -182.734375 342.128906 -170 348.796875 -154 C 355.460938 -138 358.796875 -120.265625 358.796875 -100.796875 L 358.796875 0 L 302.40625 0 L 302.40625 -100.796875 C 302.40625 -116.265625 298.335938 -128.265625 290.203125 -136.796875 C 282.066406 -145.328125 272.265625 -149.59375 260.796875 -149.59375 C 248.535156 -149.59375 238.203125 -144.789062 229.796875 -135.1875 C 221.398438 -125.59375 217.203125 -114.128906 217.203125 -100.796875 Z M 217.203125 -100.796875"/><path transform="translate(1197.789217 810.576174)" d="M 54.796875 -56 C 64.128906 -56 71.59375 -53 77.1875 -47 C 82.789062 -41 85.59375 -33.734375 85.59375 -25.203125 C 85.59375 -16.929688 82.789062 -9.796875 77.1875 -3.796875 C 71.59375 2.203125 64.128906 5.203125 54.796875 5.203125 C 45.734375 5.203125 38.332031 2.203125 32.59375 -3.796875 C 26.863281 -9.796875 24 -16.929688 24 -25.203125 C 24 -33.734375 26.863281 -41 32.59375 -47 C 38.332031 -53 45.734375 -56 54.796875 -56 Z M 54.796875 -56"/></g></svg><h1 style="font-size:28px;margin:0 0 12px">${title}</h1><p style="margin:0 0 24px;line-height:1.5">${body}</p><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">${actions}</div></div></main>`;
          };
          if (document.body) show();
          else document.addEventListener("DOMContentLoaded", show, { once: true });
          return never;
        }
        const button = (href, label, primary) =>
          `<a href="${href}" style="display:inline-block;padding:12px 20px;border-radius:999px;font-weight:600;text-decoration:none;${primary ? "background:#282B4A;color:#EEEBDA" : "border:1px solid #282B4A;color:#282B4A"}">${label}</a>`;
        // A server error (5xx) is retried once like a dropped connection; 401 and 403 aren't.
        const load = () =>
          fetch("/api/student/me", { credentials: "same-origin", redirect: "manual", cache: "no-store" }).then(
            (r) => {
              if (r.status >= 500) throw new Error(String(r.status));
              return r;
            },
          );
        window.chomMe = load()
          .catch(() => new Promise((r) => setTimeout(r, 800)).then(load))
          .then((r) => {
            if (r.ok) return r.json();
            // A redirect (e.g. to sign in) reaches us opaque, as status 0: treat it as signed out.
            if (r.status === 401 || r.type === "opaqueredirect") {
              location.replace("/sign-in");
              return never;
            }
            if (r.status === 403)
              return stop(
                "This is the student dashboard",
                "You’re signed in with a teacher or parent account in this browser. Go to your own dashboard, or sign out to sign in as a student.",
                button("/start", "Go to my dashboard", true) + button("/sign-out", "Sign out", false),
              );
            throw new Error(String(r.status));
          })
          .catch(() =>
            stop(
              "We couldn’t load your dashboard",
              "Check your connection and try again.",
              button(location.pathname, "Try again", true),
            ),
          );

    <script>
      (async () => {
        "use strict";
        const me = await window.chomMe;
        // The student's real tasks: their teachers' work and their own reminders.
        const liveTasks = await fetch("/api/student/tasks", { credentials: "same-origin", redirect: "manual", cache: "no-store" })
          .then((r) => (r.ok ? r.json() : null))
          .then((d) => (d && Array.isArray(d.tasks) ? d.tasks : null))
          .catch(() => null);
        // The list didn't load: say so, rather than "all caught up".
        const tasksFailed = !liveTasks;
        const tasksFailedNote = `<p class="task-empty" role="alert">We couldn’t load your tasks. <button type="button" class="text-button" data-action="reload-page">Try again</button></p>`;
        if (!me.today)
          me.today = new Date().toLocaleDateString("en-CA", { timeZone: "Africa/Johannesburg" });
        const $ = (s) => document.querySelector(s),
          $$ = (s) => [...document.querySelectorAll(s)];
        const icon = (name, small = false) =>
          `<svg class="icon${small ? " small" : ""}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
        const esc = (value) =>
          String(value ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const storeKey = `chom-learn-v2:${me.id}`;
        const defaults = {
          notes: "",
          focus: false,
          theme: "light",
          notificationsRead: false,
        };
        let storageAvailable = true,
          saved = {};
        try {
          saved =
            JSON.parse(localStorage.getItem(storeKey) || "{}") || {};
        } catch (e) {
          storageAvailable = false;
        }
        const state = { ...defaults, ...saved };
        // A real task in the shape the page draws: due today (or overdue, or no date)
        // goes under Today; a later date under Upcoming.
        function fromServer(t) {
          const dueDay = t.dueAt
            ? new Date(t.dueAt).toLocaleDateString("en-CA", { timeZone: "Africa/Johannesburg" })
            : null;
          const label = !dueDay
            ? "Anytime"
            : dueDay < me.today
              ? `Overdue · ${shortDue(dueDay)}`
              : dueDay === me.today
                ? "Due today"
                : `Due ${shortDue(dueDay)}`;
          return {
            ...t,
            subject: t.subject || "My task",
            when: !dueDay || dueDay <= me.today ? "today" : "upcoming",
            time: label,
            dueDay,
          };
        }
        function shortDue(iso) {
          const m = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          return `${Number(iso.slice(8, 10))} ${m[Number(iso.slice(5, 7)) - 1]}`;
        }
        state.tasks = (liveTasks || []).map(fromServer);
        let currentView = "dashboard",
          taskFilter = "today",
          toastTimer,
          lastFocused;
        const views = {
          dashboard: "My dashboard",
          subjects: "My subjects",
          tasks: "My tasks",
          timetable: "Timetable",
          assignments: "Assignments",
          results: "My results",
          chom: "Study with Chom",
          school: "School life",
          messages: "Messages",
          settings: "Settings",
        };
        const subjectList = [];
        const palette = ["#1967d2", "#129eaf", "#e8710a", "#1e8e3e", "#9334e6", "#c5221f", "#e52592", "#5f6368"];
        const shortName = (raw) => {
          const name = String(raw ?? "").trim();
          const words = name.split(/\s+/).filter(Boolean);
          return words.length > 1 && !/Language$/.test(name)
            ? words[0][0] + words[1][0].toLowerCase()
            : name.slice(0, 2);
        };
        me.subjects.forEach((s, i) =>
            subjectList.push({
              id: s.id,
              name: s.name,
              short: shortName(s.name),
              room: "",
              teacher: s.teacher,
              color: palette[i % palette.length],
              isFocus: s.isFocus,
              target: s.target,
              units: Array.isArray(s.units) ? s.units : [],
            }),
        );
        const displayName = me.firstName;
        const initials = me.initials;
        const gradeShort = me.registerClass || `Grade ${me.grade ?? ""}`;
        const gradeLine = [me.grade != null ? `Grade ${me.grade}` : "", me.registerClass ? `Class ${me.registerClass}` : ""]
          .filter(Boolean)
          .join(" · ");
        $("#school-space-line").textContent = gradeLine;
        $$('[data-action="profile"]').forEach((b) => {
          b.setAttribute("aria-label", `${me.firstName}'s profile`);
          const a = b.querySelector(".avatar");
          if (a) a.textContent = me.initials;
        });
        const remaining = () =>
          state.tasks.filter((t) => t.when === "today" && !t.done).length;
        function applyTheme() {
          const dark = state.theme === "dark";
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          const meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.content = dark ? "#282b4a" : "#eeebda";
        }
        function save() {
          try {
            localStorage.setItem(storeKey, JSON.stringify(state));
            return true;
          } catch (e) {
            storageAvailable = false;
            return false;
          }
        }
        function announce(message) {
          $("#toast").textContent = message;
          $("#toast").classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(
            () => $("#toast").classList.remove("show"),
            2800,
          );
        }
        function persist(message) {
          announce(
            save()
              ? message
              : "Saved for this visit. Browser storage is unavailable.",
          );
        }
        function footer() {
          return `<footer class="page-footer"><span>${icon("heart")}A little support. A lot of possibility.</span><span>${esc(me.schoolName)} · Tasks you add stay on this device</span></footer>`;
        }
        // Dates from the school's calendar are plain YYYY-MM-DD days.
        const day = (iso, opts) => new Date(`${iso}T12:00:00Z`).toLocaleDateString("en-ZA", { timeZone: "UTC", ...opts });
        const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const shortDay = (iso) => `${Number(iso.slice(8, 10))} ${months[Number(iso.slice(5, 7)) - 1]}`;
        function unitNow(x) {
          const now = x.units.filter((u) => u.status === "now");
          // An all-year unit (Physical Education) runs alongside the others: prefer the one that started last.
          const current = now.sort((a, b) => (a.startsOn < b.startsOn ? 1 : -1))[0];
          if (current) return { label: "Now", title: current.title };
          const next = x.units.find((u) => u.status === "upcoming");
          if (me.contentEndsOn && me.today > me.contentEndsOn)
            return { label: "Revision", title: x.units.length ? "All units covered" : "Revise for exams" };
          if (next) return { label: "Next", title: `${next.title} · ${shortDay(next.startsOn)}` };
          return { label: "Your goal", title: x.target ? x.target + "%" : "Not set" };
        }
        function liveClassCard(x) {
          return `<button class="cd-class" data-action="subject" data-subject="${esc(x.id)}"><span class="cd-class-top"><span class="cd-avatar" aria-hidden="true">${esc(x.short)}</span>${x.isFocus ? '<span class="cd-pill small">Focus</span>' : ""}</span><span><strong>${esc(x.name)}</strong><small>${esc(gradeShort)} · ${esc(x.teacher || "Teacher to be confirmed")}${x.target ? ` · Goal ${x.target}%` : ""}</small></span><span class="cd-next"><span>${esc(unitNow(x).label)}</span><b>${esc(unitNow(x).title)}</b></span></button>`;
        }
        function comingSoon(title, copy) {
          return `<section class="panel"><div class="cd-head"><div><span class="cd-label">Coming soon</span><h2>${title}</h2></div></div><p class="muted" style="margin:0;padding:0 24px 28px">${copy}</p></section>`;
        }
        function dueLabel(t) {
          return t.done ? "Done" : t.time;
        }
        function dashTaskRow(t) {
          return `<li><div class="dt-row ${t.done ? "done" : ""}"><span class="dt-copy"><button type="button" class="dt-name" data-action="task-detail" data-id="${esc(t.id)}" style="background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer">${esc(t.title)}${t.attachments && t.attachments.length ? " 📎" : ""}</button><span class="dt-subject">${esc(t.subject)}</span></span><span class="dt-due ${t.done ? "is-done" : ""}">${esc(dueLabel(t))}</span><input type="checkbox" class="dt-check" data-task="${esc(t.id)}" aria-label="Mark ${esc(t.title)} as done" ${t.done ? "checked" : ""}></div></li>`;
        }
        function dashTasks() {
          const today = state.tasks.filter((t) => t.when === "today"),
            upcoming = state.tasks.filter((t) => t.when === "upcoming"),
            left = remaining();
          return `<div class="dt-group"><h3 class="dt-group-title">Due today <span>${tasksFailed ? "" : left ? left + " left" : "All done"}</span></h3>${today.length ? `<ul class="dt-list">${today.map(dashTaskRow).join("")}</ul>` : tasksFailed ? tasksFailedNote : `<p class="task-empty">Nothing due today. You’re all caught up.</p>`}</div>${upcoming.length ? `<div class="dt-group"><h3 class="dt-group-title">Coming up</h3><ul class="dt-list">${upcoming.map(dashTaskRow).join("")}</ul></div>` : ""}`;
        }
        function tasksMarkup() {
          const list = state.tasks.filter((t) =>
            taskFilter === "done"
              ? t.done
              : taskFilter === "upcoming"
                ? t.when === "upcoming" && !t.done
                : t.when === "today",
          );
          return `<div class="filter-row" role="tablist" aria-label="Task filters">${["today", "upcoming", "done"].map((f) => `<button class="filter ${taskFilter === f ? "active" : ""}" role="tab" aria-selected="${taskFilter === f}" aria-controls="task-results" data-filter="${f}">${{ today: "Today", upcoming: "Upcoming", done: "Completed" }[f]}<span>${state.tasks.filter((t) => (f === "done" ? t.done : f === "upcoming" ? t.when === "upcoming" && !t.done : t.when === "today")).length}</span></button>`).join("")}</div><div class="task-list" id="task-results" role="tabpanel" aria-label="${taskFilter} tasks">${list.length ? list.map((t) => `<div class="task-row ${t.done ? "completed" : ""}"><label class="task-check"><input type="checkbox" data-task="${esc(t.id)}" aria-label="Complete ${esc(t.title)}" ${t.done ? "checked" : ""}></label><div class="task-content"><button type="button" class="task-name" data-action="task-detail" data-id="${esc(t.id)}" style="background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer">${esc(t.title)}${t.attachments && t.attachments.length ? " 📎" : ""}</button><span class="task-sub"><i class="subject-dot ${esc(t.subject)}"></i>${esc(t.subject)}</span></div><span class="due ${t.done ? "done" : ""}">${t.done ? "Completed" : esc(t.time)}</span></div>`).join("") : tasksFailed ? tasksFailedNote : `<p class="task-empty">${taskFilter === "done" ? "Your completed tasks will appear here." : taskFilter === "upcoming" ? "A little breathing room. No upcoming tasks." : "Nothing due today. You’re all caught up."}</p>`}</div>`;
        }
        function liveDashboard() {
          const weekday = day(me.today, { weekday: "long" }),
            date = day(me.today, { day: "numeric", month: "long", year: "numeric" }),
            termLabel = me.term ? ` · Term ${me.term.number} · Week ${me.term.week}` : "",
            focus = subjectList.filter((x) => x.isFocus);
          return `<div class="cd"><div class="cd-top"><header class="cd-hero"><span class="cd-label">${esc(weekday)} · ${esc(date)}${esc(termLabel)}</span><h1 class="cd-title">Hey, ${esc(displayName)}.</h1><p class="cd-lede">You’ve got <strong id="remaining-copy">${remaining()} tasks</strong> on your list today.</p></header><section class="cd-stats" aria-label="Your week in numbers"><div class="cd-stat"><span class="cd-num" id="task-count">${remaining()}</span><strong>Tasks due today</strong><small>Tick them off as you go</small></div><div class="cd-stat"><span class="cd-num">${focus.length}</span><strong>Focus subjects</strong><small>${focus.length ? esc(focus.map((x) => x.name).join(", ")) : "Pick them in your answers"}</small></div></section></div><div class="cd-split"><div class="cd-col"><section class="panel dt-panel" aria-labelledby="tasks-title"><div class="cd-head"><div><span class="cd-label">My tasks</span><h2 id="tasks-title">Today’s list</h2></div><a class="dt-all" href="#tasks">See all tasks ${icon("arrow", true)}</a></div><div id="dash-tasks">${dashTasks()}</div></section>${comingUp()}</div></div></div>`;
        }
        function comingUp() {
          const exams = (me.exams || []).slice(0, 3);

          }
          if (a === "reveal-algebra") {
            $("#algebra-answer").hidden = false;
            b.hidden = true;
          }
          if (a === "open-tasks") {
            closeModal();
            go("tasks");
          }
          if (a === "essay-notes") {
            closeModal();
            go("chom");
          }
          if (a === "save-notes") {
            state.notes = $("#study-notes").value;
            persist("Your notes are saved on this device.");
          }
          if (a === "quiz-next") {
            if (quizIndex < 2) {
              quizIndex++;
              quizQuestion();
            } else
              modal(
                "Look at that — you showed up.",
                `<div class="large-stat" style="text-align:center">${quizScore} / 3</div><p style="text-align:center">${quizScore === 3 ? "You’ve got the core ideas of osmosis." : "Every question is a chance to learn. Try again when you’re ready."}</p><div class="form-actions"><button class="button secondary" data-action="study" data-topic="quiz">Try again</button><button class="button" data-action="close-dialog">All done</button></div>`,
              );
          }
        });
        document.addEventListener("change", (e) => {
          if (e.target.matches("[data-task]")) {
            const t = state.tasks.find((t) => t.id === e.target.dataset.task);
            if (!t) return;
            const done = e.target.checked;
            t.done = done;
            saveDone(t, done);
            const id = t.id;
            save();
            if ($("#tasks-content")) $("#tasks-content").innerHTML = tasksMarkup();
            if ($("#dash-tasks")) $("#dash-tasks").innerHTML = dashTasks();
            $("#nav-task-count").textContent = remaining();
            if ($("#task-count")) $("#task-count").textContent = remaining();
            if ($("#tasks-summary"))
              $("#tasks-summary").textContent = remaining() + " left today";
            if ($("#remaining-copy"))
              $("#remaining-copy").textContent = remaining() + " tasks";
            const replacement = $$("[data-task]").find(
              (el) => el.dataset.task === id,
            );
            if (replacement) replacement.focus();
            else if ($(`[data-filter="${taskFilter}"]`))
              $(`[data-filter="${taskFilter}"]`).focus();
            announce(
              storageAvailable
                ? done
                  ? "One step forward. Task completed."
                  : "Task moved back to your to-do list."
                : "Updated for this visit. Browser storage is unavailable.",
            );
          }
          if (e.target.id === "theme-toggle") {
            state.theme = e.target.checked ? "dark" : "light";
            applyTheme();
            persist(e.target.checked ? "Dark mode is on." : "Back to light mode.");
          }
          if (e.target.id === "focus-toggle") {
            state.focus = e.target.checked;
            document.body.classList.toggle("focus-mode", state.focus);
            persist("Your learning space has been updated.");
          }
        });
        document.addEventListener("input", (e) => {
          if (e.target.id === "global-search") searchResults(e.target.value);
          if (e.target.id === "study-notes") {
            state.notes = e.target.value;
            save();
          }
        });
        document.addEventListener("submit", async (e) => {
          if (e.target.id === "add-live-task-form") {
            e.preventDefault();
            const f = new FormData(e.target),
              title = String(f.get("title") || "").trim(),
              dueOn = String(f.get("dueOn") || "");
            if (!title) {
              $("#task-title").setCustomValidity("Give your task a name.");
              $("#task-title").reportValidity();
              $("#task-title").addEventListener("input", () => $("#task-title").setCustomValidity(""), { once: true });
              return;
            }
            const submit = e.target.querySelector('[type="submit"]');
            submit.disabled = true;
            try {
              const r = await fetch("/api/student/tasks", {
                method: "POST",
                credentials: "same-origin",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title, dueOn: dueOn || null }),
              });
              if (!r.ok) throw new Error();
              const { task } = await r.json();
              const added = fromServer(task);
              state.tasks.push(added);
              taskFilter = added.when;
              closeModal();
              render();
              announce("A little more clarity. Your task is added.");
            } catch {
              submit.disabled = false;
              announce("Couldn’t add that. Check your connection and try again.");
            }
            return;
          }
        });
        $("#nav-overlay").addEventListener("click", () => {
          closeNav();
          $(".mobile-menu").focus();
        });
        document.addEventListener("keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            search();
          }
          if (e.key === "Escape" && $("#sidebar").classList.contains("open")) {
            closeNav();
            $(".mobile-menu").focus();
          }
          if (e.key === "Tab" && $("#sidebar").classList.contains("open")) {
            const focusable = $$("#sidebar a,#sidebar button").filter(
              (x) => x.getClientRects().length,
            );
            const first = focusable[0],
              last = focusable[focusable.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
          if (
            e.target.matches('[role="tab"]') &&
            ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)
          ) {
            e.preventDefault();
            const filters = ["today", "upcoming", "done"],
              i = filters.indexOf(taskFilter);
            taskFilter =
              e.key === "Home"
                ? "today"
                : e.key === "End"
                  ? "done"
                  : filters[(i + (e.key === "ArrowRight" ? 1 : 2)) % 3];
            $("#tasks-content").innerHTML = tasksMarkup();
            $(`[data-filter="${taskFilter}"]`).focus();
          }
        });
        window.addEventListener("hashchange", route);
        route();
      })();
    </script>
  </body>
</html>
