<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #eeebda;
      font-family: Arial, Helvetica, sans-serif;
      color: #282b4a;
    "
  >
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 440px; background: #ffffff; border-radius: 16px"
          >
            <tr>
              <td style="padding: 32px 28px">
                <p
                  style="
                    margin: 0 0 24px;
                    font-size: 20px;
                    font-weight: 800;
                    letter-spacing: -0.5px;
                  "
                >
                  chom learn
                </p>
                <p style="margin: 0 0 8px; font-size: 16px">Your code is:</p>
                <p style="margin: 0 0 24px; font-size: 34px; font-weight: 800; letter-spacing: 8px">
                  {{ .Token }}
                </p>
                <p style="margin: 0 0 8px; font-size: 14px; line-height: 1.5">
                  Type it on the Chom sign-in page to confirm it’s you. It works once and expires in
                  an hour.
                </p>
                <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #6b6d85">
                  If you didn’t ask for this code, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
