          modal(
            "A little osmosis check.",
            `<p>Question ${quizIndex + 1} of ${quiz.length} · Life Sciences</p><h3>${q.q}</h3><div class="quiz-answers">${q.answers.map((a, i) => `<button class="quiz-answer" data-answer="${i}">${a}</button>`).join("")}</div><p class="quiz-feedback" id="quiz-feedback" role="status"></p><div class="form-actions"><button class="button" id="quiz-next" data-action="quiz-next" hidden>${quizIndex === 2 ? "See my result" : "Next question"}</button></div>`,
          );
        }
        function quizAnswer(value) {
          if (answered) return;
          answered = true;
          const q = quiz[quizIndex],
            correct = value === q.correct;
          if (correct) quizScore++;
          $$("[data-answer]").forEach((b) => {
            b.disabled = true;
            if (+b.dataset.answer === q.correct) b.classList.add("correct");
            else if (+b.dataset.answer === value) b.classList.add("incorrect");
          });
          $("#quiz-feedback").textContent =
            (correct ? "That’s it! " : "Almost. ") + q.why;
          $("#quiz-next").hidden = false;
        }
        function search() {
          modal(
            "Find your way.",
            `<div class="search-field">${icon("search", true)}<input id="global-search" aria-label="Search tasks and pages" placeholder="Search tasks, subjects, or pages..." autocomplete="off" maxlength="120"></div><div class="search-results" id="search-results"></div>`,
          );
          searchResults("");
          $("#global-search").focus();
        }
        function searchResults(q) {
          const term = q.trim().toLowerCase();
          const items = [
            ...Object.entries(views).map(([id, title]) => ({
              title,
              sub: "Go to page",
              view: id,
            })),
            ...state.tasks.map((t) => ({
              title: t.title,
              sub:
                t.subject +
                " · " +
                (t.done
                  ? "Completed"
                  : t.when === "today"
                    ? "Today"
                    : "Tomorrow"),
              view: "tasks",
              filter: t.done ? "done" : t.when,
            })),
          ].filter((x) => (x.title + " " + x.sub).toLowerCase().includes(term));
          $("#search-results").innerHTML = items.length
            ? items
                .slice(0, 8)
                .map(
                  (x) =>
                    `<button class="search-result" data-action="search-go" data-view="${x.view}" data-task-filter="${x.filter || "today"}"><span><strong>${esc(x.title)}</strong><small>${esc(x.sub)}</small></span>${icon("chevron", true)}</button>`,
                )
                .join("")
            : '<p class="empty-message">Nothing here yet. Try a subject name or “tasks”.</p>';
        }
        const serviceContent = {
          sport: [
            "Sports & activities",
            `<p>Make time for the things you enjoy outside class.</p><h3>Hockey practice</h3><p>Today at 15:30 · Sample activity</p><div class="notice">Confirm practice times, venue, and transport with your school. Activity sign-up is not connected in this preview.</div>`,
          ],
          transport: [
            "Your ride home",
            `<p>Your saved sample transport information.</p><h3>Bus 14 · 15:55</h3><p>Check your school’s transport notice for the collection point.</p><div class="notice">This is sample schedule data, not live tracking. Confirm the bus time before making travel plans.</div>`,
          ],
          support: [
            "You don’t have to figure it all out alone.",
            `<p>School can feel like a lot. A teacher, parent, or school counsellor can help you work through what’s on your mind.</p><h3>Ask for a private conversation</h3><p>Contact your school office or speak to a teacher you trust to find out how to meet with the counsellor.</p><div class="notice">This preview does not send messages or book counselling sessions. You don’t need to share personal details here.</div>`,
          ],
          news: [
            "Around your school",
            `<p>Your school news feed is ready for future updates.</p><div class="notice">No live announcements are connected in this preview. Check your school’s usual channels for current notices.</div>`,
          ],
          career: [
            "A future with room for you.",
            `<p>Start with curiosity. You don’t need to have it all worked out.</p><ol><li>Which subjects or activities make you lose track of time?</li><li>What problems do you enjoy solving?</li><li>Who could tell you more about a career you’re curious about?</li></ol><div class="form-actions"><button class="button secondary" data-action="essay-notes">Write in my notebook</button></div>`,
          ],
          uniform: [
            "School essentials",
            `<p>Your school’s uniform shop will be accessible from here.</p><div class="notice">The shop is not connected in this preview. Contact your school for its approved supplier, sizes, and opening hours.</div>`,
          ],
        };
        document.addEventListener("click", (e) => {
          const filter = e.target.closest("[data-filter]");
          if (filter) {
            taskFilter = filter.dataset.filter;
            $("#tasks-content").innerHTML = tasksMarkup();
            $(`[data-filter="${taskFilter}"]`).focus();
            return;
          }
          const day = e.target.closest("[data-day]");
          if (day) {
            selectedDay = +day.dataset.day;
            $(".schedule-panel").outerHTML = schedulePanel();
            $(`[data-day="${selectedDay}"]`).focus();
            return;
          }
          const answer = e.target.closest("[data-answer]");
          if (answer) {
            quizAnswer(+answer.dataset.answer);
            return;
          }
          const b = e.target.closest("[data-action]");
          if (!b) return;
          const a = b.dataset.action;
          if (a === "open-nav") {
            $("#sidebar").classList.add("open");
            $("#nav-overlay").classList.add("open");
            $(".mobile-menu").setAttribute("aria-expanded", "true");
            $("#sidebar").setAttribute("role", "dialog");
            $("#sidebar").setAttribute("aria-modal", "true");
            syncNavAccessibility();
            $(".mobile-close").focus();
          }
          if (a === "close-nav") {
            closeNav();
            $(".mobile-menu").focus();
          }
          if (a === "close-dialog") closeModal();
          if (a === "navigate") go(b.dataset.view);
          if (a === "add-task") addTask();
          if (a === "subject") subjectDialog(b.dataset.subject);
          if (a === "assignment") assignment(b.dataset.id);
          if (a === "study") study(b.dataset.topic);
          if (a === "search") search();
          if (a === "search-go") {
            closeModal();
            taskFilter = b.dataset.taskFilter || "today";
            go(b.dataset.view);
            if (currentView === b.dataset.view) render();
          }
          if (a === "notifications") {
            state.notificationsRead = true;
            save();
            $("#notification-dot").hidden = true;
            modal(
              "Your little updates.",
              `<p>You’re all caught up with this sample workspace.</p><div class="topic-options"><button class="topic-option" data-action="search-go" data-view="results">${icon("chart")}<span>Your Geography result is ready<small>78% · Sample assessment result</small></span>${icon("chevron", true)}</button><button class="topic-option" data-action="search-go" data-view="assignments">${icon("file")}<span>Two assignments due Friday<small>History essay and Life Sciences lab report</small></span>${icon("chevron", true)}</button></div>`,
            );
          }
          if (a === "profile")
            modal(
              "Hi, Amara.",
              `<div style="display:flex;align-items:center;gap:16px"><span class="avatar" style="width:54px;height:54px;font-size:17px">AN</span><div><h3 style="margin:0">Amara</h3><p class="muted">Grade 10 · Class B</p></div></div><div class="notice">You’re viewing a sample student profile. No school account is connected.</div><div class="form-actions"><button class="button secondary" data-action="search-go" data-view="settings">My preferences</button></div>`,
            );
          if (a === "service") {
            const info = serviceContent[b.dataset.service];
            if (info) modal(info[0], info[1]);
          }
          if (a === "reveal-algebra") {
            $("#algebra-answer").hidden = false;
            b.hidden = true;
          }
          if (a === "open-tasks") {
            closeModal();
            go("tasks");
          }
          if (a === "essay-notes") {
            closeModal();
            go("chom");
          }
          if (a === "save-notes") {
            state.notes = $("#study-notes").value;
            persist("Your notes are saved on this device.");
          }
          if (a === "quiz-next") {
            if (quizIndex < 2) {
              quizIndex++;
              quizQuestion();
            } else
              modal(
                "Look at that — you showed up.",
                `<div class="large-stat" style="text-align:center">${quizScore} / 3</div><p style="text-align:center">${quizScore === 3 ? "You’ve got the core ideas of osmosis." : "Every question is a chance to learn. Try again when you’re ready."}</p><div class="form-actions"><button class="button secondary" data-action="study" data-topic="quiz">Try again</button><button class="button" data-action="close-dialog">All done</button></div>`,
              );
          }
        });
        document.addEventListener("change", (e) => {
          if (e.target.matches("[data-task]")) {
            const t = state.tasks.find((t) => t.id === e.target.dataset.task);
            if (!t) return;
            const done = e.target.checked;
            t.done = done;
            const id = t.id;
            save();
            if ($("#tasks-content")) $("#tasks-content").innerHTML = tasksMarkup();
            if ($("#dash-tasks")) $("#dash-tasks").innerHTML = dashTasks();
            $("#nav-task-count").textContent = remaining();
            if ($("#task-count")) $("#task-count").textContent = remaining();
            if ($("#tasks-summary"))
              $("#tasks-summary").textContent = remaining() + " left today";
            if ($("#remaining-copy"))
              $("#remaining-copy").textContent = remaining() + " tasks";
            const replacement = $$("[data-task]").find(
              (el) => el.dataset.task === id,
            );
            if (replacement) replacement.focus();
            else if ($(`[data-filter="${taskFilter}"]`))
              $(`[data-filter="${taskFilter}"]`).focus();
            announce(
              storageAvailable
                ? done
                  ? "One step forward. Task completed."
                  : "Task moved back to your to-do list."
                : "Updated for this visit. Browser storage is unavailable.",
            );
          }
          if (e.target.id === "theme-toggle") {
            state.theme = e.target.checked ? "dark" : "light";
            applyTheme();
            persist(e.target.checked ? "Dark mode is on." : "Back to light mode.");
          }
          if (e.target.id === "focus-toggle") {
            state.focus = e.target.checked;
            document.body.classList.toggle("focus-mode", state.focus);
            persist("Your learning space has been updated.");
          }
        });
        document.addEventListener("input", (e) => {
          if (e.target.id === "global-search") searchResults(e.target.value);
          if (e.target.id === "study-notes") {
            state.notes = e.target.value;
            save();
          }
        });
        document.addEventListener("submit", (e) => {
          if (e.target.id === "add-task-form") {
            e.preventDefault();
            const f = new FormData(e.target),
              title = f.get("title").trim();
            if (!title) {
              $("#task-title").setCustomValidity("Give your task a name.");
              $("#task-title").reportValidity();
              $("#task-title").addEventListener(
                "input",
                () => $("#task-title").setCustomValidity(""),
                { once: true },
              );
              return;
            }
            state.tasks.push({
              id:
                "task-" +
                Date.now() +
                "-" +
                Math.random().toString(36).slice(2, 8),
              title,
              subject: f.get("subject"),
              when: f.get("when"),
              time: f.get("when") === "today" ? "Today" : "Tomorrow",
              done: false,
            });
            taskFilter = f.get("when");
            persist("A little more clarity. Your task is added.");
            closeModal();
            render();
          }
          if (e.target.id === "assignment-form") {
            e.preventDefault();
            const f = new FormData(e.target),
              id = e.target.dataset.id;
            state.assignmentNotes[id] = f.get("notes");
            state.assignmentProgress[id] = +f.get("progress");
            persist("Your draft is saved on this device.");
            closeModal();
            render();
          }
        });
        $("#nav-overlay").addEventListener("click", () => {
          closeNav();
          $(".mobile-menu").focus();
        });
        document.addEventListener("keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            search();
          }
          if (e.key === "Escape" && $("#sidebar").classList.contains("open")) {
            closeNav();
            $(".mobile-menu").focus();
          }
          if (e.key === "Tab" && $("#sidebar").classList.contains("open")) {
            const focusable = $$("#sidebar a,#sidebar button").filter(
              (x) => x.getClientRects().length,
            );
            const first = focusable[0],
              last = focusable[focusable.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
          if (
            e.target.matches('[role="tab"]') &&
            ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)
          ) {
            e.preventDefault();
            const filters = ["today", "upcoming", "done"],
              i = filters.indexOf(taskFilter);
            taskFilter =
              e.key === "Home"
                ? "today"
                : e.key === "End"
                  ? "done"
                  : filters[(i + (e.key === "ArrowRight" ? 1 : 2)) % 3];
            $("#tasks-content").innerHTML = tasksMarkup();
            $(`[data-filter="${taskFilter}"]`).focus();
          }
        });
        window.addEventListener("hashchange", route);
        route();
      })();
    </script>
  </body>
</html>
