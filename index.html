<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2860f5" />
    <meta
      name="description"
      content="A little more clarity for your school day. Plan your tasks, see your classes and study with Chom Learn."
    />
    <title>Chom Learn — Your school day, sorted</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%232860f5'/%3E%3Cpath d='M28 13a11 11 0 1 0 0 14' fill='none' stroke='%23ffffff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --bg: #f7f7f8;
        --paper: #fff;
        --ink: #171717;
        --text: #272729;
        --muted: #707075;
        --line: #eaeaed;
        --blue: #2860f5;
        --blue-hover: #174de2;
        --blue-soft: #eef3ff;
        --apricot: #ffc6a6;
        --apricot-soft: #fff2e9;
        --soft: #f3f3f5;
        --r: 22px;
        --sidebar: 224px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          "Segoe UI",
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a {
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
        padding: 0;
      }
      a {
        text-decoration: none;
      }
      svg {
        display: block;
        flex-shrink: 0;
      }
      button:disabled {
        cursor: default;
        opacity: 0.55;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 3px solid #2860f580;
        outline-offset: 4px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        color: var(--ink);
      }
      h1,
      h2,
      .study-title,
      .wordmark {
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI",
          system-ui, sans-serif;
      }
      h1 {
        font-size: 36px;
        line-height: 1.15;
        letter-spacing: -1.3px;
        font-weight: 650;
      }
      h2 {
        font-size: 18px;
        letter-spacing: -0.45px;
        font-weight: 600;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
      }
      input,
      textarea,
      select {
        color: var(--text);
      }
      input::placeholder,
      textarea::placeholder {
        color: #77777c;
        opacity: 1;
      }
      .icon {
        width: 20px;
        height: 20px;
        fill: currentColor;
        stroke: none;
      }
      .icon.small {
        width: 16px;
        height: 16px;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      .muted {
        color: var(--muted);
      }
      .skip-link {
        position: fixed;
        top: -100px;
        left: 20px;
        z-index: 100;
        padding: 12px 20px;
        background: var(--blue);
        color: white;
        border-radius: 10px;
      }
      .skip-link:focus {
        top: 10px;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: var(--sidebar);
        background: var(--paper);
        border-right: 1px solid var(--line);
        z-index: 40;
        display: flex;
        flex-direction: column;
        padding: 30px 18px 18px;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        gap: 9px;
        align-items: center;
        padding: 0 13px;
      }
      .brand-mark {
        width: 32px;
        height: 32px;
      }
      .wordmark {
        font-size: 30px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -1.4px;
      }
      .wordmark span {
        font-size: 12px;
        font-weight: 400;
        letter-spacing: -0.2px;
        margin-left: 5px;
        color: var(--muted);
      }
      .school-switch {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 33px 10px 26px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
        font-size: 11px;
        color: var(--muted);
      }
      .school-icon {
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: var(--soft);
        display: grid;
        place-items: center;
        color: #747477;
      }
      .school-switch strong {
        font-size: 12px;
        font-weight: 550;
        color: var(--ink);
        display: block;
      }
      .nav-label {
        font-size: 11px;
        color: var(--muted);
        margin: 0 13px 10px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .nav a {
        padding: 11px 13px;
        display: flex;
        align-items: center;
        gap: 11px;
        border-radius: 10px;
        font-weight: 500;
        font-size: 13px;
        min-height: 43px;
        transition:
          background 0.15s,
          color 0.15s;
      }
      .nav a > .icon {
        width: 18px;
        height: 18px;
        color: #8a8a90;
      }
      .nav a:hover {
        background: var(--soft);
      }
      .nav a.active {
        background: var(--blue-soft);
        color: var(--blue);
        font-weight: 600;
      }
      .nav a.active > .icon {
        color: var(--blue);
      }
      .nav .badge {
        margin-left: auto;
        font-size: 10px;
        min-width: 20px;
        height: 20px;
        border-radius: 6px;
        background: #ededf0;
        color: #646469;
        display: grid;
        place-items: center;
      }
      .nav a.active .badge {
        background: #dae5ff;
        color: var(--blue);
      }
      .nav.secondary {
        margin-top: 26px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding-top: 34px;
      }
      .mini-chom {
        border-radius: 16px;
        background: #f5f6f9;
        padding: 16px;
      }
      .mini-chom .mini-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ink);
      }
      .mini-chom .mini-title .icon {
        color: var(--blue);
      }
      .mini-chom p {
        font-size: 11px;
        line-height: 1.65;
        margin-top: 7px;
        color: var(--muted);
      }
      .mini-chom button {
        font-size: 11px;
        font-weight: 550;
        margin-top: 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        color: var(--blue);
      }
      .sidebar-footer {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: #77777c;
        padding: 17px 11px 0;
      }
      .sidebar-footer i {
        width: 5px;
        height: 5px;
        background: #aaaab0;
        border-radius: 50%;
      }
      .shell {
        margin-left: var(--sidebar);
      }
      .topbar {
        height: 80px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 36px;
        background: #fff;
        gap: 20px;
      }
      .breadcrumb {
        font-size: 13px;
        font-weight: 550;
        white-space: nowrap;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .search-button {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        color: var(--muted);
        padding: 9px 12px;
        border-radius: 9px;
        background: #f5f5f7;
        width: 242px;
        text-align: left;
      }
      .search-button kbd {
        font: 10px inherit;
        color: #7e7e84;
        margin-left: auto;
        padding: 0 4px;
      }
      .utility {
        height: 34px;
        width: 34px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        position: relative;
        color: #66666b;
      }
      .utility:hover {
        background: var(--soft);
      }
      .notification-dot {
        position: absolute;
        top: 6px;
        right: 7px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 2px white;
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 35px;
        height: 35px;
        background: #f5d9c8;
        border: 3px solid #fff;
        box-shadow: 0 0 0 1px var(--line);
        border-radius: 50%;
        font-weight: 600;
        font-size: 11px;
        color: #795e4a;
      }
      .profile-copy {
        font-size: 11px;
        text-align: left;
        line-height: 1.5;
      }
      .profile-copy strong {
        font-size: 12px;
        display: block;
        font-weight: 600;
      }
      .mobile-menu,
      .mobile-close {
        display: none;
      }
      .page {
        max-width: 1500px;
        margin: auto;
        padding: 34px 36px 26px;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 28px;
      }
      .greeting {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .page-heading p {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
      }
      .page-heading p strong {
        font-weight: 500;
        color: #505055;
      }
      .date-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 12px;
        white-space: nowrap;
        font-size: 11px;
        color: #68686e;
      }
      .dashboard {
        display: grid;
        grid-template-columns: minmax(0, 1.65fr) minmax(290px, 1fr);
        gap: 24px;
      }
      .main-column,
      .right-column {
        display: flex;
        flex-direction: column;
        gap: 24px;
        min-width: 0;
      }
      .study-card {
        background: white;
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 28px 30px 24px;
        position: relative;
        overflow: hidden;
      }
      .study-overline {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 12px;
        font-weight: 500;
        color: #737379;
      }
      .study-status {
        width: 6px;
        height: 6px;
        background: var(--blue);
        border-radius: 50%;
        display: block;
      }
      .study-title {
        font-size: 57px;
        line-height: 1.045;
        letter-spacing: -2.6px;
        font-weight: 700;
        margin: 24px 0 17px;
        color: var(--ink);
        max-width: none;
      }
      .headline-line {
        display: flex;
        align-items: center;
        gap: 13px;
        white-space: nowrap;
      }
      .headline-line + .headline-line {
        margin-top: 4px;
      }
      .app-tile {
        display: inline-grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        vertical-align: middle;
        position: relative;
        background: linear-gradient(160deg, #3d74ff, var(--blue) 70%);
        box-shadow:
          inset 0 1px 1px #ffffff60,
          0 3px 5px #2860f518;
        flex: none;
        color: white;
      }
      .app-tile > .icon {
        width: 31px;
        height: 31px;
      }
      .study-description {
        font-size: 14px;
        line-height: 1.55;
        color: var(--muted);
        max-width: 360px;
      }
      .study-input {
        display: flex;
        align-items: center;
        background: #f6f6f8;
        border: 1px solid #ebebef;
        border-radius: 13px;
        padding: 8px 8px 8px 15px;
        gap: 10px;
        margin-top: 24px;
      }
      .study-input > .icon {
        color: #88888e;
        width: 18px;
        height: 18px;
      }
      .study-input input {
        border: 0;
        outline: none;
        min-width: 0;
        flex: 1;
        font-size: 13px;
        background: transparent;
      }
      .study-input:focus-within {
        border-color: #b3c5f8;
        outline: 3px solid #2860f518;
      }
      .study-input input:focus-visible {
        outline: none;
      }
      .send-button {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: var(--blue);
        color: #fff;
        display: grid;
        place-items: center;
        transition: background 0.15s;
      }
      .send-button:hover {
        background: var(--blue-hover);
      }
      .prompt-chips {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .prompt-chips button {
        border: 1px solid #e4e4e9;
        background: #fff;
        font-size: 11px;
        padding: 6px 10px;
        border-radius: 20px;
        color: #6c6c72;
        transition: background 0.15s;
      }
      .prompt-chips button:hover {
        background: var(--soft);
        color: var(--ink);
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--r);
        overflow: hidden;
      }
      .panel-head {
        padding: 22px 24px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .panel-head > .icon {
        color: #77777d;
      }
      .panel-title {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .count {
        min-width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: #f0f0f3;
        font-size: 11px;
        font-weight: 500;
        color: #6b6b71;
      }
      .text-button {
        font-size: 12px;
        font-weight: 500;
        color: var(--blue);
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .text-button:hover {
        text-decoration: underline;
      }
      .button {
        background: var(--blue);
        color: #fff;
        padding: 11px 18px;
        border-radius: 11px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 550;
        min-height: 42px;
        transition: background 0.15s;
      }
      .button:hover {
        background: var(--blue-hover);
      }
      .button.secondary {
        background: var(--soft);
        color: var(--ink);
      }
      .button.secondary:hover {
        background: #e8e8ed;
      }
      .button.outline {
        background: white;
        border: 1px solid var(--line);
        color: var(--ink);
      }
      .filter-row {
        display: flex;
        gap: 22px;
        padding: 0 24px;
        border-bottom: 1px solid var(--line);
      }
      .filter {
        position: relative;
        font-size: 12px;
        color: var(--muted);
        padding: 0 0 13px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .filter.active {
        color: var(--ink);
        font-weight: 550;
      }
      .filter.active:after {
        position: absolute;
        content: "";
        bottom: -1px;
        height: 2px;
        left: 0;
        right: 0;
        background: var(--ink);
        border-radius: 4px;
      }
      .filter span {
        font-size: 10px;
        font-weight: 500;
        line-height: 16px;
        min-width: 16px;
        border-radius: 4px;
        background: #f0f0f3;
        color: #75757c;
      }
      .task-list {
        padding: 0 24px;
      }
      .task-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 17px 0;
        border-bottom: 1px solid #f0f0f3;
        min-height: 72px;
      }
      .task-row:last-child {
        border: 0;
      }
      .task-check {
        display: flex;
        align-items: center;
        cursor: pointer;
        min-height: 24px;
      }
      .task-check input {
        appearance: none;
        width: 18px;
        height: 18px;
        border: 1.5px solid #d4d4db;
        border-radius: 5px;
        margin: 0;
        cursor: pointer;
        background: #fff;
        display: grid;
        place-items: center;
      }
      .task-check input:checked {
        background: var(--blue);
        border-color: var(--blue);
      }
      .task-check input:checked:after {
        content: "";
        display: block;
        width: 7px;
        height: 4px;
        border: solid white;
        border-width: 0 0 1.7px 1.7px;
        transform: rotate(-45deg) translateY(-1px);
      }
      .task-content {
        flex: 1;
        min-width: 0;
      }
      .task-name {
        font-size: 13px;
        font-weight: 500;
        display: block;
        overflow-wrap: anywhere;
      }
      .task-sub {
        color: var(--muted);
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
      }
      .subject-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        display: inline-block;
        background: var(--blue);
      }
      .subject-dot.English {
        background: #e3a67e;
      }
      .subject-dot.History {
        background: #8c9bbb;
      }
      .subject-dot.Afrikaans {
        background: #a3a3ab;
      }
      .subject-dot.Science {
        background: #6f8cc8;
      }
      .task-row.completed .task-name {
        color: #85858b;
        text-decoration: line-through;
        font-weight: 400;
      }
      .due {
        font-size: 10px;
        color: #89532f;
        padding: 4px 8px;
        background: var(--apricot-soft);
        border-radius: 5px;
        white-space: nowrap;
      }
      .due.done {
        background: none;
        color: #808087;
        padding-right: 0;
      }
      .task-more {
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        padding: 14px 24px;
        border-top: 1px solid var(--line);
        display: block;
        width: 100%;
        background: #fff;
      }
      .task-more:hover {
        background: var(--soft);
      }
      .task-empty {
        padding: 28px 0;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .schedule-subtitle {
        color: var(--muted);
        font-size: 11px;
        margin-top: 4px;
      }
      .schedule-days {
        display: flex;
        margin: 0 20px 22px;
        gap: 5px;
        justify-content: space-between;
      }
      .day {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        flex: 1;
        padding: 8px 3px;
        border-radius: 10px;
        color: #7c7c82;
        font-size: 10px;
      }
      .day b {
        font-size: 14px;
        font-weight: 550;
        color: var(--ink);
      }
      .day.selected {
        background: var(--blue);
        color: #e5ecff;
      }
      .day.selected b {
        color: white;
      }
      .day:hover:not(.selected) {
        background: var(--soft);
      }
      .schedule-list {
        padding: 0 24px 6px;
      }
      .class-row {
        display: flex;
        gap: 14px;
        padding: 0 0 18px;
        position: relative;
      }
      .class-time {
        font-size: 11px;
        line-height: 1.5;
        color: #696971;
        width: 35px;
        flex-shrink: 0;
        padding-top: 9px;
        font-variant-numeric: tabular-nums;
      }
      .class-time small {
        font-size: 10px;
        display: block;
        color: #8b8b92;
        margin-top: 3px;
      }
      .class-card {
        flex: 1;
        min-width: 0;
        padding: 12px 13px;
        border-left: 2px solid #98b2fa;
        background: #f0f4ff;
        border-radius: 0 10px 10px 0;
      }
      .class-card.english {
        background: #fff5ed;
        border-color: #ebc4a8;
      }
      .class-card.science {
        background: #f7f7f9;
        border-color: #d5d5dd;
      }
      .class-card.history {
        background: #f5f7fa;
        border-color: #c1ccdf;
      }
      .class-card h3 {
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 6px;
        align-items: center;
        color: var(--ink);
        font-weight: 550;
      }
      .class-card p {
        font-size: 10px;
        color: #74747d;
        margin-top: 4px;
      }
      .class-tag {
        font-size: 9px;
        font-weight: 500;
        padding: 1px 5px;
        border-radius: 4px;
        color: var(--blue);
        background: #e3ecff;
      }
      .schedule-footer {
        padding: 1px 24px 20px;
      }
      .schedule-footer a {
        font-size: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        color: #5f6068;
      }
      .schedule-footer a:hover {
        color: var(--blue);
      }
      .assignment-list {
        padding: 0 24px 6px;
      }
      .assignment-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        border-top: 1px solid var(--line);
        padding: 18px 0;
      }
      .assignment-row:hover .assignment-name {
        text-decoration: underline;
      }
      .subject-icon {
        width: 36px;
        height: 39px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: var(--blue-soft);
        color: var(--blue);
      }
      .subject-icon.mint {
        background: var(--apricot-soft);
        color: #b07b59;
      }
      .assignment-copy {
        flex: 1;
        min-width: 0;
      }
      .assignment-name {
        display: block;
        font-size: 13px;
        font-weight: 500;
      }
      .assignment-meta {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      .assignment-progress {
        width: 64px;
        flex-shrink: 0;
        font-size: 10px;
        color: var(--muted);
      }
      .assignment-progress .track {
        margin-top: 6px;
      }
      .track {
        height: 4px;
        display: block;
        border-radius: 10px;
        background: #eeeef3;
        overflow: hidden;
      }
      .track i {
        display: block;
        height: 100%;
        width: var(--value);
        background: var(--blue);
        border-radius: 10px;
      }
      .progress-panel {
        padding: 23px 24px;
        background: #fff4ec;
        border: 1px solid #f5e5d9;
        border-radius: var(--r);
      }
      .progress-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .progress-head .icon {
        color: #a67f64;
      }
      .progress-visual {
        display: flex;
        gap: 19px;
        align-items: center;
        margin: 24px 0 20px;
      }
      .progress-ring {
        position: relative;
        width: 76px;
        height: 76px;
        flex: none;
        display: grid;
        place-items: center;
      }
      .progress-ring svg {
        position: absolute;
        inset: 0;
        width: 76px;
        height: 76px;
        transform: rotate(-90deg);
      }
      .progress-ring strong {
        font-size: 20px;
        color: #282220;
        letter-spacing: -0.65px;
        font-weight: 600;
      }
      .progress-message strong {
        font-size: 14px;
        font-weight: 550;
      }
      .progress-message p {
        font-size: 11px;
        line-height: 1.6;
        color: #827065;
        max-width: 175px;
        margin-top: 5px;
      }
      .progress-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #eedfd4;
        padding-top: 15px;
        font-size: 11px;
        color: #85736a;
      }
      .progress-foot button {
        font-size: 11px;
        font-weight: 550;
        color: #655247;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .school-panel .panel-head {
        padding-bottom: 10px;
      }
      .school-links {
        padding: 0 24px 12px;
      }
      .school-link {
        display: flex;
        align-items: center;
        width: 100%;
        text-align: left;
        gap: 11px;
        padding: 13px 0;
        border-bottom: 1px solid #f0f0f3;
      }
      .school-link:last-child {
        border: 0;
      }
      .school-link > .icon {
        color: #86868e;
        width: 18px;
        height: 18px;
      }
      .school-link span {
        flex: 1;
        font-size: 12px;
        font-weight: 500;
      }
      .school-link small {
        font-size: 10px;
        color: #77777f;
      }
      .school-link:hover span {
        text-decoration: underline;
      }
      .page-footer {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-top: 28px;
        color: #85858d;
        font-size: 10px;
      }
      .page-footer span:first-child {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .page-footer .icon {
        width: 12px;
        height: 12px;
      }
      .overlay {
        display: none;
      }
      .view-header {
        margin-bottom: 28px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
      }
      .view-header p {
        font-size: 14px;
        color: var(--muted);
        margin-top: 12px;
        max-width: 650px;
      }
      .content-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }
      .content-card {
        padding: 27px;
        background: white;
        border: 1px solid var(--line);
        border-radius: var(--r);
      }
      .content-card p {
        color: var(--muted);
        font-size: 13px;
        margin-top: 9px;
      }
      .content-card .button {
        margin-top: 22px;
      }
      .content-card h2 {
        margin: 15px 0 0;
      }
      .content-card .subject-icon {
        width: 44px;
        height: 46px;
      }
      .large-stat {
        font-size: 42px;
        font-weight: 650;
        letter-spacing: -1.5px;
        color: var(--ink);
        margin-top: 14px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      .data-table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      .data-table th {
        text-align: left;
        font-weight: 500;
        font-size: 11px;
        color: var(--muted);
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
      }
      .data-table td {
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }
      .data-table tr:last-child td {
        border: 0;
      }
      .data-table td:first-child {
        font-weight: 500;
      }
      .empty-message {
        padding: 40px 28px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }
      .info-strip {
        padding: 15px 19px;
        border-radius: 12px;
        background: var(--blue-soft);
        color: #5470aa;
        font-size: 12px;
        margin-bottom: 24px;
      }
      .section-title {
        margin: 30px 0 18px;
      }
      .week-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(140px, 1fr));
        gap: 14px;
        padding: 24px;
        min-width: 780px;
      }
      .week-col h3 {
        font-size: 13px;
        margin-bottom: 18px;
      }
      .week-class {
        border-left: 2px solid #abc2fb;
        border-radius: 0 9px 9px 0;
        background: #f0f4ff;
        padding: 12px;
        margin-bottom: 11px;
        font-size: 12px;
      }
      .week-class strong {
        display: block;
        margin: 4px 0;
        font-size: 12px;
        font-weight: 550;
      }
      .week-class small {
        font-size: 10px;
        color: var(--muted);
      }
      .week-class time {
        font-size: 11px;
        color: #677da9;
      }
      .notes-area {
        width: 100%;
        border: 1px solid #e0e0e6;
        padding: 14px;
        border-radius: 12px;
        background: #fafafb;
        min-height: 170px;
        resize: vertical;
        font-size: 13px;
        line-height: 1.75;
      }
      .field {
        margin: 20px 0;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 550;
        margin-bottom: 8px;
      }
      .field input,
      .field select {
        display: block;
        width: 100%;
        border: 1px solid #dedee5;
        border-radius: 10px;
        padding: 11px 13px;
        background: #fff;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .form-actions {
        display: flex;
        gap: 9px;
        justify-content: flex-end;
        margin-top: 25px;
      }
      .notice {
        font-size: 12px;
        line-height: 1.65;
        background: #f5f5f7;
        color: #6f6f78;
        padding: 14px 16px;
        border-radius: 11px;
        margin-top: 22px;
      }
      .dialog {
        border: 1px solid #e5e5eb;
        border-radius: 24px;
        width: min(580px, calc(100% - 32px));
        padding: 0;
        color: var(--text);
        box-shadow: 0 24px 100px #17172525;
        max-height: calc(100dvh - 48px);
        background: #fff;
      }
      .dialog::backdrop {
        background: #1b1c2c45;
        backdrop-filter: blur(5px);
      }
      .dialog-header {
        padding: 25px 26px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        border-bottom: 1px solid var(--line);
      }
      .dialog-header h2 {
        font-size: 21px;
        letter-spacing: -0.6px;
      }
      .dialog-close {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--soft);
        color: #717178;
      }
      .dialog-body {
        padding: 24px 26px 28px;
        font-size: 14px;
        line-height: 1.7;
      }
      .dialog-body > p {
        color: var(--muted);
      }
      .dialog-body h3 {
        margin-top: 20px;
      }
      .dialog-body ul,
      .dialog-body ol {
        padding-left: 20px;
        color: #65656e;
      }
      .dialog-body li {
        margin: 10px 0;
      }
      .dialog-body .search-field {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid #dedee7;
        border-radius: 12px;
        padding: 12px 13px;
      }
      .search-field input {
        border: 0;
        outline: none;
        width: 100%;
        background: none;
      }
      .search-field:focus-within {
        outline: 3px solid #2860f51c;
        border-color: #aac0f6;
      }
      .search-results {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .search-result {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 11px;
        border-radius: 10px;
        text-align: left;
      }
      .search-result:hover {
        background: var(--soft);
      }
      .search-result small {
        display: block;
        font-size: 11px;
        color: var(--muted);
      }
      .search-result strong {
        font-weight: 500;
      }
      .topic-options {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 22px;
      }
      .topic-option {
        text-align: left;
        padding: 16px;
        border: 1px solid #e6e6ec;
        border-radius: 12px;
        background: white;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }
      .topic-option:hover {
        background: var(--soft);
      }
      .topic-option .icon {
        color: var(--blue);
      }
      .topic-option span {
        flex: 1;
      }
      .topic-option small {
        display: block;
        color: var(--muted);
        font-size: 11px;
        margin-top: 4px;
      }
      .study-example {
        padding: 22px;
        background: var(--blue-soft);
        border-radius: 14px;
        margin: 20px 0;
        font-size: 19px;
        font-weight: 550;
        text-align: center;
        color: #325cba;
      }
      .quiz-answers {
        display: grid;
        gap: 10px;
        margin-top: 20px;
      }
      .quiz-answer {
        border: 1px solid #e0e0e6;
        border-radius: 11px;
        padding: 14px;
        text-align: left;
      }
      .quiz-answer:hover {
        background: var(--soft);
      }
      .quiz-answer.correct {
        border-color: #86a6f8;
        background: var(--blue-soft);
        opacity: 1;
      }
      .quiz-answer.incorrect {
        border-color: #e0b799;
        background: var(--apricot-soft);
        opacity: 1;
      }
      .quiz-feedback {
        font-size: 13px;
        margin-top: 20px;
        color: #5069a3;
        min-height: 26px;
      }
      .toast {
        position: fixed;
        bottom: 26px;
        left: calc(50% + var(--sidebar) / 2);
        transform: translate(-50%, 12px);
        padding: 13px 21px;
        background: #202022;
        color: #fff;
        font-size: 13px;
        border-radius: 12px;
        box-shadow: 0 6px 22px #17172815;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
        max-width: calc(100% - 32px);
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .storage-warning {
        margin: 0 0 22px;
        padding: 14px 16px;
        border-radius: 12px;
        background: var(--apricot-soft);
        font-size: 13px;
        color: #875e41;
      }
      .note-card {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: var(--blue-soft);
        padding: 20px;
        border-radius: 12px;
        line-height: 1.75;
        color: #526b9b;
        margin: 18px 0;
      }
      .switch-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 0;
        border-bottom: 1px solid var(--line);
        gap: 20px;
      }
      .switch-row label {
        font-size: 14px;
      }
      .switch-row input {
        accent-color: var(--blue);
        width: 18px;
        height: 18px;
      }
      .task-tools {
        display: flex;
        gap: 9px;
      }
      .focus-mode .school-panel,
      .focus-mode .mini-chom {
        display: none;
      }
      @keyframes text-focus {
        from {
          opacity: 0;
          filter: blur(4px);
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          filter: blur(0);
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .page-heading h1,
        .view-header h1 {
          animation: text-focus 0.65s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .page-heading > div > p,
        .view-header p {
          animation: text-focus 0.65s cubic-bezier(0.22, 1, 0.36, 1) 60ms both;
        }
        .headline-line {
          animation: text-focus 0.7s cubic-bezier(0.22, 1, 0.36, 1) 80ms both;
        }
        .headline-line + .headline-line {
          animation-delay: 140ms;
        }
        .study-description {
          animation: text-focus 0.65s cubic-bezier(0.22, 1, 0.36, 1) 180ms both;
        }
      }
      @media (min-width: 1450px) {

        .study-card {
          padding: 30px 32px 26px;

          font-size: 10px;
        }

          height: 29px;
        }

          padding-left: 10px;

        }

          padding-left: 23px;

        }

        }

          gap: 18px;
        }

    <script>
      (() => {
        "use strict";
        const $ = (s) => document.querySelector(s),
          $$ = (s) => [...document.querySelectorAll(s)];
        const icon = (name, small = false) =>
          `<svg class="icon${small ? " small" : ""}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
        const esc = (value) =>
          String(value ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;",
              })[c],
          );
        const initialTasks = [
          {
            id: "maths",
            title: "Exercise 4.2: quadratic equations",
            subject: "Maths",
            when: "today",
            time: "15:00",
            done: false,
          },
          {
            id: "english",
            title: "Reading log, chapter 6",
            subject: "English",
            when: "today",
            time: "Today",
            done: false,
          },
          {
            id: "history",
            title: "Outline your WWI essay",
            subject: "History",
            when: "today",
            time: "Today",
            done: false,
          },
          {
            id: "afrikaans",
            title: "Practise your vocabulary set",
            subject: "Afrikaans",
            when: "today",
            time: "Done",
            done: true,
          },
          {

        const defaults = {
          tasks: initialTasks,
          notes: "",
          assignmentNotes: {},
          assignmentProgress: { history: 60, science: 20 },
          focus: false,
          notificationsRead: false,
        };
        let storageAvailable = true,
          saved = {};

          saved =
            JSON.parse(localStorage.getItem("chom-learn-v2") || "{}") || {};
        } catch (e) {
          storageAvailable = false;
        }
        const state = {
          ...defaults,
          ...saved,
          tasks:
            Array.isArray(saved.tasks) &&
            saved.tasks.every(
              (t) =>
                t &&
                typeof t.id === "string" &&
                typeof t.title === "string" &&
                typeof t.subject === "string",
            )
              ? saved.tasks
              : initialTasks,
          assignmentNotes: {
            ...defaults.assignmentNotes,
            ...saved.assignmentNotes,
          },
          assignmentProgress: {
            ...defaults.assignmentProgress,
            ...saved.assignmentProgress,
          },
        };
        let currentView = "dashboard",
          taskFilter = "today",
          selectedDay = 1,
          toastTimer,
          lastFocused;
        const views = {
          dashboard: "My dashboard",
          tasks: "My tasks",
          timetable: "Timetable",
          assignments: "Assignments",
          results: "My results",

          {

            title: "Mathematics",
            room: "Room 12",

            end: "13:15",
            title: "History",
            room: "Room 9",
            teacher: "",
            type: "history",

        const weekly = [
          [

            "Mathematics",
            "Afrikaans",
            "Geography",
            "Life Sciences",
            "Art",

            "History",

            "English",
            "Geography",

          [

            "Life Sciences",
            "Art",
            "Geography",
            "English",
            "History",

        const dayNames = [

          "Tuesday",
          "Wednesday",
          "Thursday",
          "Friday",

        const remaining = () =>
          state.tasks.filter((t) => t.when === "today" && !t.done).length;
        function save() {
          try {
            localStorage.setItem("chom-learn-v2", JSON.stringify(state));
            return true;
          } catch (e) {
            storageAvailable = false;
            return false;
          }
        }
        function announce(message) {
          $("#toast").textContent = message;
          $("#toast").classList.add("show");
          clearTimeout(toastTimer);
          toastTimer = setTimeout(
            () => $("#toast").classList.remove("show"),
            2800,
          );
        }
        function persist(message) {
          announce(
            save()
              ? message
              : "Saved for this visit. Browser storage is unavailable.",
          );
        }
        function footer() {
          return `<footer class="page-footer"><span>${icon("heart")}A little support. A lot of possibility.</span><span>Sample school data · Your changes stay on this device</span></footer>`;
        }
        function studyCard() {
          return `<section class="study-card" aria-labelledby="study-title"><div class="study-overline"><span class="study-status" aria-hidden="true"></span>Study with Chom</div><h2 class="study-title" id="study-title"><span class="headline-line">Big ideas.</span><span class="headline-line">Small <span class="app-tile" aria-hidden="true">${icon("book")}</span> steps.</span></h2><p class="study-description">Understand a tricky topic.<br>Find a little more clarity.</p><form class="study-input" id="study-form">${icon("message", true)}<input aria-label="What would you like to study?" name="question" placeholder="What’s on your mind?" maxlength="200" autocomplete="off"><button class="send-button" aria-label="Explore study help">${icon("up", true)}</button></form><div class="prompt-chips"><button data-action="study" data-topic="algebra">Explain algebra</button><button data-action="study" data-topic="quiz">Quiz me on osmosis</button><button data-action="study" data-topic="plan">Help me plan</button></div></section>`;
        }
        function tasksMarkup() {
          const list = state.tasks.filter((t) =>
            taskFilter === "done"
              ? t.done
              : taskFilter === "upcoming"
                ? t.when === "upcoming" && !t.done
                : t.when === "today",
          );
          return `<div class="filter-row" role="tablist" aria-label="Task filters">${["today", "upcoming", "done"].map((f) => `<button class="filter ${taskFilter === f ? "active" : ""}" role="tab" aria-selected="${taskFilter === f}" aria-controls="task-results" data-filter="${f}">${{ today: "Today", upcoming: "Upcoming", done: "Completed" }[f]}<span>${state.tasks.filter((t) => (f === "done" ? t.done : f === "upcoming" ? t.when === "upcoming" && !t.done : t.when === "today")).length}</span></button>`).join("")}</div><div class="task-list" id="task-results" role="tabpanel" aria-label="${taskFilter} tasks">${list.length ? list.map((t) => `<div class="task-row ${t.done ? "completed" : ""}"><label class="task-check"><input type="checkbox" data-task="${esc(t.id)}" aria-label="Complete ${esc(t.title)}" ${t.done ? "checked" : ""}></label><div class="task-content"><span class="task-name">${esc(t.title)}</span><span class="task-sub"><i class="subject-dot ${esc(t.subject)}"></i>${esc(t.subject)}</span></div><span class="due ${t.done ? "done" : ""}">${t.done ? "Completed" : esc(t.time === "Done" ? "Today" : t.time)}</span></div>`).join("") : `<p class="task-empty">${taskFilter === "done" ? "Your completed tasks will appear here." : taskFilter === "upcoming" ? "A little breathing room. No upcoming tasks." : "Nothing due today. You’re all caught up."}</p>`}</div>`;
        }
        function tasksPanel() {
          return `<section class="panel"><div class="panel-head"><div class="panel-title"><h2>Your tasks</h2><span class="count" id="task-count">${remaining()}</span></div><button class="text-button" data-action="add-task">${icon("plus", true)}Add task</button></div><div id="tasks-content">${tasksMarkup()}</div><button class="task-more" data-action="navigate" data-view="tasks">View all tasks ${icon("arrow", true).replace('class="icon small"', 'class="icon small" style="display:inline;vertical-align:middle;margin-left:5px"')}</button></section>`;
        }
        function scheduleRows(day) {
          const classes =
            day === 1
              ? periods
              : weekly[day].slice(0, 4).map((title, i) => ({
                  ...periods[i],
                  title,
                  room: "Sample timetable",
                  teacher: "",
                }));
          return classes
            .map(
              (p, i) =>
                `<div class="class-row"><time class="class-time">${p.time}<small>${p.end}</small></time><div class="class-card ${p.type}"><h3>${p.title}${i === 0 && day === 1 ? '<span class="class-tag">Period 1</span>' : ""}</h3><p>${p.room}${p.teacher ? " · " + p.teacher : ""}</p></div></div>`,
            )
            .join("");
        }
        function schedulePanel() {
          return `<section class="panel schedule-panel"><div class="panel-head"><div><h2>Your day at a glance</h2><p class="schedule-subtitle">${dayNames[selectedDay]} · 6 classes</p></div>${icon("calendar", true)}</div><div class="schedule-days" aria-label="School days">${dayNames.map((d, i) => `<button class="day ${i === selectedDay ? "selected" : ""}" data-day="${i}" aria-label="${d} ${5 + i} October" aria-pressed="${i === selectedDay}">${d.slice(0, 3)}<b>${5 + i}</b></button>`).join("")}</div><div class="schedule-list">${scheduleRows(selectedDay)}</div><div class="schedule-footer"><a href="#timetable">View full timetable ${icon("arrow", true)}</a></div></section>`;
        }
        function assignmentRows() {
          return ["history", "science"]
            .map(
              (id, i) =>
                `<button class="assignment-row" data-action="assignment" data-id="${id}"><span class="subject-icon ${i ? "mint" : ""}">${icon(i ? "flask" : "file")}</span><span class="assignment-copy"><span class="assignment-name">${i ? "Osmosis lab report" : "World War I essay"}</span><span class="assignment-meta">${i ? "Life Sciences" : "History"} · Due Fri, 9 Oct</span></span><span class="assignment-progress">${state.assignmentProgress[id]}% drafted<span class="track"><i style="--value:${state.assignmentProgress[id]}%;${i ? "background:#d69d77" : ""}"></i></span></span>${icon("chevron", true)}</button>`,
            )
            .join("");
        }
        function assignmentsPanel() {
          return `<section class="panel"><div class="panel-head"><h2>Upcoming assignments</h2><a class="text-button" href="#assignments">View all ${icon("arrow", true)}</a></div><div class="assignment-list">${assignmentRows()}</div></section>`;
        }
        function progressPanel() {
          return `<section class="progress-panel"><div class="progress-head"><h2>Your progress</h2>${icon("leaf")}</div><div class="progress-visual"><div class="progress-ring"><svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="34" fill="none" stroke="#f2dfd1" stroke-width="6"/><circle cx="40" cy="40" r="34" fill="none" stroke="#d69d77" stroke-width="6" stroke-linecap="round" stroke-dasharray="207 214"/></svg><strong>97%</strong></div><div class="progress-message"><strong>Showing up matters.</strong><p>Your attendance this term. Keep making space for learning.</p></div></div><div class="progress-foot"><span>One day at a time.</span><button data-action="navigate" data-view="results">My progress ${icon("arrow", true)}</button></div></section>`;
        }
        function schoolPanel() {
          return `<section class="panel school-panel"><div class="panel-head"><h2>Beyond the classroom</h2></div><div class="school-links"><button class="school-link" data-action="service" data-service="sport">${icon("ball")}<span>Sports & activities</span><small>Hockey, 15:30</small></button><button class="school-link" data-action="service" data-service="transport">${icon("bus")}<span>My transport</span><small>Bus 14</small></button><button class="school-link" data-action="service" data-service="support">${icon("heart")}<span>Someone to talk to</span>${icon("chevron", true)}</button></div></section>`;
        }
        function dashboard() {
          return `<header class="page-heading"><div><div class="greeting"><h1>Hey, Amara.</h1></div><p>You’ve got <strong id="remaining-copy">${remaining()} tasks</strong> on your list today.</p></div><span class="date-pill">${icon("calendar", true)}Tuesday, 6 October 2026</span></header><div class="dashboard"><div class="main-column">${studyCard()}${tasksPanel()}${assignmentsPanel()}</div><div class="right-column">${schedulePanel()}${progressPanel()}${schoolPanel()}</div></div>`;
        }
        function viewHeader(title, copy, extra = "") {
          return `<header class="view-header"><div><h1>${title}</h1><p>${copy}</p></div>${extra}</header>`;
        }
        function render() {
          document.body.classList.toggle("focus-mode", !!state.focus);
          $("#breadcrumb").textContent = views[currentView];
          document.title = `${views[currentView]} — Chom Learn`;
          $$("[data-view]")
            .filter((el) => el.closest("nav"))
            .forEach((a) => {
              a.classList.toggle("active", a.dataset.view === currentView);
              if (a.dataset.view === currentView)
                a.setAttribute("aria-current", "page");

            announce(
              storageAvailable
                ? done
                  ? "One step forward. Task completed."
                  : "Task moved back to your to-do list."
                : "Updated for this visit. Browser storage is unavailable.",
            );
          }
          if (e.target.id === "focus-toggle") {
            state.focus = e.target.checked;
            document.body.classList.toggle("focus-mode", state.focus);
            persist("Your learning space has been updated.");
          }
        });
        document.addEventListener("input", (e) => {
          if (e.target.id === "global-search") searchResults(e.target.value);
          if (e.target.id === "study-notes") {
            state.notes = e.target.value;
            save();
          }
        });
        document.addEventListener("submit", (e) => {
          if (e.target.id === "study-form") {
            e.preventDefault();
            const q = new FormData(e.target).get("question").trim();
            const topic = /algebra|quadratic|math/i.test(q)
              ? "algebra"
              : /osmosis|quiz|biology/i.test(q)
                ? "quiz"
                : /plan|week|task|friday/i.test(q)
                  ? "plan"
                  : /essay|writ/i.test(q)
                    ? "essay"
                    : "topics";
            study(topic, q);
          }
          if (e.target.id === "add-task-form") {
            e.preventDefault();
            const f = new FormData(e.target),
              title = f.get("title").trim();
            if (!title) {
              $("#task-title").setCustomValidity("Give your task a name.");
              $("#task-title").reportValidity();
              $("#task-title").addEventListener(
                "input",
                () => $("#task-title").setCustomValidity(""),
                { once: true },
              );
              return;
            }
            state.tasks.push({
              id:
                "task-" +
                Date.now() +
                "-" +
                Math.random().toString(36).slice(2, 8),
              title,
              subject: f.get("subject"),
              when: f.get("when"),
              time: f.get("when") === "today" ? "Today" : "Tomorrow",
              done: false,
            });
            taskFilter = f.get("when");
            persist("A little more clarity. Your task is added.");
            closeModal();
            render();
          }
          if (e.target.id === "assignment-form") {
            e.preventDefault();
            const f = new FormData(e.target),
              id = e.target.dataset.id;
            state.assignmentNotes[id] = f.get("notes");
            state.assignmentProgress[id] = +f.get("progress");
            persist("Your draft is saved on this device.");
            closeModal();
            render();
          }
        });
        $("#nav-overlay").addEventListener("click", () => {
          closeNav();
          $(".mobile-menu").focus();
        });
        document.addEventListener("keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            search();
          }
          if (e.key === "Escape" && $("#sidebar").classList.contains("open")) {
            closeNav();
            $(".mobile-menu").focus();
          }
          if (e.key === "Tab" && $("#sidebar").classList.contains("open")) {
            const focusable = $$("#sidebar a,#sidebar button").filter(
              (x) => x.getClientRects().length,
            );
            const first = focusable[0],
              last = focusable[focusable.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
          if (
            e.target.matches('[role="tab"]') &&
            ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)
          ) {
            e.preventDefault();
            const filters = ["today", "upcoming", "done"],
              i = filters.indexOf(taskFilter);
            taskFilter =
              e.key === "Home"
                ? "today"
                : e.key === "End"
                  ? "done"
                  : filters[(i + (e.key === "ArrowRight" ? 1 : 2)) % 3];
            $("#tasks-content").innerHTML = tasksMarkup();
            $(`[data-filter="${taskFilter}"]`).focus();
          }
        });
        window.addEventListener("hashchange", route);
        route();
      })();
    </script>
  </body>
</html>
