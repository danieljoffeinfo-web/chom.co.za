<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#203c33" />
    <meta
      name="description"
      content="A little more clarity for your school day. Plan your tasks, see your classes and study with Chom Learn."
    />
    <title>Chom Learn — Your school day, sorted</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23203c33'/%3E%3Cpath d='M28 13a11 11 0 1 0 0 14' fill='none' stroke='%23dbebbe' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;450;500;550;600;650;700;750;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f7f9f8;
        --paper: #fff;
        --ink: #203c33;
        --text: #2b3832;
        --muted: #68736d;
        --line: #e6ebe8;
        --forest: #234c3a;
        --forest-hover: #163725;
        --violet: #ded7f8;
        --violet-ink: #61528b;
        --leaf: #dbebbe;
        --soft: #edf3ee;
        --r: 20px;
        --sidebar: 224px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        font:
          13px/1.6 "Plus Jakarta Sans",
          sans-serif;
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
      }
      button,
      a,
      input,
      select,
      textarea {
        -webkit-tap-highlight-color: transparent;
      }
      button,
      a {
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
      }
      a {
        text-decoration: none;
      }
      button {
        padding: 0;
      }
      svg {
        display: block;
        flex-shrink: 0;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 3px solid #8b71c4;
        outline-offset: 4px;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        color: var(--ink);
      }
      h1 {
        font-size: 32px;
        line-height: 1.25;
        letter-spacing: -1.2px;
        font-weight: 750;
      }
      h2 {
        font-size: 17px;
        letter-spacing: -0.45px;
        font-weight: 750;
      }
      h3 {
        font-size: 14px;
        font-weight: 700;
      }
      input,
      textarea,
      select {
        color: var(--text);
      }
      .icon {
        width: 20px;
        height: 20px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon.small {
        width: 16px;
        height: 16px;
      }
      .hidden,
      [hidden] {
        display: none !important;
      }
      .muted {
        color: var(--muted);
      }
      .skip-link {
        position: fixed;
        top: -100px;
        left: 20px;
        z-index: 100;
        padding: 12px 20px;
        background: var(--forest);
        color: white;
        border-radius: 9px;
      }
      .skip-link:focus {
        top: 10px;
      }
      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: var(--sidebar);
        background: var(--paper);
        border-right: 1px solid var(--line);
        z-index: 40;
        display: flex;
        flex-direction: column;
        padding: 31px 19px 18px;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 0 13px;
      }
      .brand-mark {
        width: 34px;
        height: 34px;
        color: var(--forest);
      }
      .wordmark {
        font-size: 29px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -1.5px;
      }
      .wordmark span {
        font-weight: 500;
        font-size: 12px;
        letter-spacing: 0;
        margin-left: 5px;
      }
      .school-switch {
        display: flex;
        align-items: center;
        gap: 9px;
        margin: 35px 9px 27px;
        padding-bottom: 22px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .school-icon {
        width: 31px;
        height: 31px;
        border: 1px solid var(--line);
        border-radius: 9px;
        display: grid;
        place-items: center;
        color: var(--ink);
      }
      .school-switch strong {
        font-weight: 650;
        color: var(--ink);
        display: block;
        font-size: 12px;
      }
      .nav-label {
        font-size: 11px;
        color: #79827e;
        margin: 0 13px 9px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .nav a {
        padding: 11px 13px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-radius: 9px;
        font-weight: 550;
        transition:
          background 0.15s,
          color 0.15s;
        min-height: 44px;
      }
      .nav a:hover {
        background: var(--bg);
      }
      .nav a.active {
        background: var(--forest);
        color: white;
      }
      .nav a .icon {
        width: 19px;
        height: 19px;
      }
      .nav .badge {
        margin-left: auto;
        font-size: 10px;
        min-width: 20px;
        height: 20px;
        border-radius: 6px;
        background: var(--soft);
        color: var(--ink);
        display: grid;
        place-items: center;
      }
      .nav a.active .badge {
        background: #456552;
        color: white;
      }
      .nav.secondary {
        margin-top: 24px;
      }
      .sidebar-bottom {
        margin-top: auto;
        padding-top: 40px;
      }
      .mini-chom {
        border-radius: 13px;
        background: #f1eef9;
        padding: 15px 14px;
      }
      .mini-chom .mini-title {
        display: flex;
        align-items: center;
        gap: 7px;
        font-weight: 700;
        color: #544571;
      }
      .mini-chom p {
        font-size: 11px;
        line-height: 1.7;
        margin-top: 5px;
        color: #706785;
      }
      .mini-chom button {
        font-size: 11px;
        font-weight: 700;
        margin-top: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
      }
      .sidebar-footer {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: #79827e;
        padding: 18px 11px 0;
      }
      .sidebar-footer i {
        width: 6px;
        height: 6px;
        background: #a1b99b;
        border-radius: 50%;
      }
      .shell {
        margin-left: var(--sidebar);
      }
      .topbar {
        height: 84px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 36px;
        background: #fff;
        gap: 20px;
      }
      .breadcrumb {
        font-size: 13px;
        font-weight: 650;
        white-space: nowrap;
      }
      .top-actions {
        display: flex;
        align-items: center;
        gap: 19px;
      }
      .search-button {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: #78817c;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 9px;
        width: 248px;
        text-align: left;
      }
      .search-button kbd {
        font: 10px inherit;
        color: #89908c;
        margin-left: auto;
        padding: 0 4px;
        background: #f5f7f5;
        border: 1px solid var(--line);
        border-radius: 3px;
      }
      .utility {
        height: 36px;
        width: 36px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        position: relative;
      }
      .utility:hover {
        background: var(--soft);
      }
      .notification-dot {
        position: absolute;
        top: 7px;
        right: 7px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #a38cc6;
        box-shadow: 0 0 0 2px white;
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        background: #ead6c6;
        border: 3px solid #fff;
        box-shadow: 0 0 0 1px #e3e8e4;
        border-radius: 50%;
        font-weight: 700;
        font-size: 11px;
        color: #6e4c35;
      }
      .profile-copy {
        font-size: 11px;
        text-align: left;
        line-height: 1.5;
      }
      .profile-copy strong {
        font-size: 12px;
        display: block;
        font-weight: 700;
      }
      .mobile-menu {
        display: none;
      }
      .page {
        max-width: 1500px;
        margin: auto;
        padding: 30px 36px 26px;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 26px;
      }
      .greeting {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sun {
        width: 29px;
        height: 29px;
        color: #a78939;
      }
      .page-heading p {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .date-pill {
        display: flex;
        align-items: center;
        gap: 8px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 11px;
        white-space: nowrap;
        font-size: 11px;
        color: #65726a;
      }
      .dashboard {
        display: grid;
        grid-template-columns: minmax(0, 1.65fr) minmax(285px, 1fr);
        gap: 24px;
      }
      .main-column,
      .right-column {
        display: flex;
        flex-direction: column;
        gap: 24px;
        min-width: 0;
      }
      .study-card {
        background: var(--violet);
        border-radius: var(--r);
        padding: 27px 28px 23px;
        position: relative;
        overflow: hidden;
        min-height: 292px;
      }
      .study-overline {
        display: flex;
        gap: 7px;
        align-items: center;
        font-size: 11px;
        font-weight: 600;
        color: #53486e;
        position: relative;
        z-index: 1;
      }
      .study-title {
        font-size: 34px;
        line-height: 1.14;
        letter-spacing: -1.35px;
        font-weight: 750;
        margin: 16px 0 10px;
        max-width: 420px;
        color: #332d46;
        position: relative;
        z-index: 1;
      }
      .study-description {
        font-size: 12px;
        line-height: 1.7;
        color: #645b77;
        max-width: 255px;
        position: relative;
        z-index: 1;
      }
      .chom-art {
        position: absolute;
        width: 200px;
        height: 195px;
        right: 7px;
        top: 12px;
        pointer-events: none;
      }
      .study-input {
        display: flex;
        align-items: center;
        background: #fff;
        border-radius: 10px;
        padding: 7px 7px 7px 13px;
        gap: 10px;
        margin-top: 24px;
        position: relative;
        z-index: 2;
        box-shadow: 0 3px 8px #6b529a08;
      }
      .study-input input {
        border: 0;
        outline: none;
        min-width: 0;
        flex: 1;
        font-size: 11px;
        background: transparent;
      }
      .study-input:focus-within {
        outline: 2px solid #746197;
        outline-offset: 3px;
      }
      .study-input input:focus-visible {
        outline: none;
      }
      .send-button {
        width: 31px;
        height: 31px;
        border-radius: 7px;
        background: var(--forest);
        color: #fff;
        display: grid;
        place-items: center;
      }
      .send-button:hover {
        background: var(--forest-hover);
      }
      .prompt-chips {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 11px;
        position: relative;
        z-index: 1;
      }
      .prompt-chips button {
        border: 1px solid #b8aed4;
        background: #ffffff20;
        font-size: 10px;
        padding: 5px 9px;
        border-radius: 6px;
        color: #54466d;
      }
      .prompt-chips button:hover {
        background: #ffffff80;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--r);
        overflow: hidden;
      }
      .panel-head {
        padding: 21px 23px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .panel-title {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .count {
        min-width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        background: #edf2ed;
        font-size: 11px;
        color: #536d5b;
      }
      .text-button {
        font-size: 11px;
        font-weight: 600;
        color: #67746c;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
      }
      .text-button:hover {
        color: var(--ink);
        text-decoration: underline;
      }
      .button {
        background: var(--forest);
        color: #fff;
        padding: 10px 16px;
        border-radius: 9px;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        min-height: 41px;
      }
      .button:hover {
        background: var(--forest-hover);
      }
      .button.secondary {
        background: #f0f4f0;
        color: var(--ink);
      }
      .button.secondary:hover {
        background: #e4ede3;
      }
      .button.outline {
        background: white;
        border: 1px solid #dce4dd;
        color: var(--ink);
      }
      .filter-row {
        display: flex;
        gap: 20px;
        padding: 0 23px;
        border-bottom: 1px solid var(--line);
      }
      .filter {
        position: relative;
        font-size: 11px;
        color: var(--muted);
        padding: 0 0 13px;
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .filter.active {
        color: var(--ink);
        font-weight: 700;
      }
      .filter.active:after {
        position: absolute;
        content: "";
        bottom: -1px;
        height: 2px;
        left: 0;
        right: 0;
        background: var(--forest);
        border-radius: 5px;
      }
      .filter span {
        font-size: 9px;
        font-weight: 600;
        line-height: 15px;
        min-width: 16px;
        border-radius: 4px;
        background: #edf2ed;
      }
      .task-list {
        padding: 0 23px;
      }
      .task-row {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 0;
        border-bottom: 1px solid #f0f2f0;
        min-height: 69px;
      }
      .task-row:last-child {
        border: 0;
      }
      .task-check {
        display: flex;
        align-items: center;
        cursor: pointer;
      }
      .task-check input {
        appearance: none;
        width: 18px;
        height: 18px;
        border: 1.5px solid #cdd6cf;
        border-radius: 5px;
        margin: 0;
        cursor: pointer;
        background: #fff;
        display: grid;
        place-items: center;
      }
      .task-check input:checked {
        background: #dce9d9;
        border-color: #dce9d9;
      }
      .task-check input:checked:after {
        content: "";
        display: block;
        width: 7px;
        height: 4px;
        border: solid #46683b;
        border-width: 0 0 2px 2px;
        transform: rotate(-45deg) translateY(-1px);
      }
      .task-content {
        flex: 1;
        min-width: 0;
      }
      .task-name {
        font-size: 13px;
        font-weight: 650;
        display: block;
        overflow-wrap: anywhere;
      }
      .task-sub {
        color: var(--muted);
        font-size: 11px;
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 3px;
      }
      .subject-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        display: inline-block;
        background: #b89edb;
      }
      .subject-dot.English {
        background: #e5b264;
      }
      .subject-dot.History {
        background: #85aeb6;
      }
      .subject-dot.Afrikaans {
        background: #95b77c;
      }
      .subject-dot.Science {
        background: #93bab1;
      }
      .task-row.completed .task-name {
        color: #859088;
        text-decoration: line-through;
        font-weight: 500;
      }
      .due {
        font-size: 10px;
        color: #86693e;
        padding: 3px 8px;
        background: #faf4e8;
        border-radius: 5px;
        white-space: nowrap;
      }
      .due.done {
        background: none;
        color: #829078;
        padding-right: 0;
      }
      .task-more {
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        padding: 12px 23px;
        border-top: 1px solid var(--line);
        display: block;
        width: 100%;
        background: #fdfefd;
      }
      .task-more:hover {
        background: var(--soft);
      }
      .task-empty {
        padding: 27px 0;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      .schedule-subtitle {
        color: var(--muted);
        font-size: 10px;
        margin-top: 3px;
      }
      .schedule-days {
        display: flex;
        margin: 0 18px 20px;
        gap: 4px;
        justify-content: space-between;
      }
      .day {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        flex: 1;
        padding: 7px 3px;
        border-radius: 9px;
        color: #758077;
        font-size: 10px;
      }
      .day b {
        font-size: 13px;
        font-weight: 650;
        color: #34493b;
      }
      .day.selected {
        background: var(--forest);
        color: #d8e6dc;
      }
      .day.selected b {
        color: white;
      }
      .day:hover:not(.selected) {
        background: var(--soft);
      }
      .schedule-list {
        padding: 0 23px 7px;
      }
      .class-row {
        display: flex;
        gap: 14px;
        padding: 0 0 18px;
        position: relative;
      }
      .class-time {
        font-size: 10px;
        line-height: 1.5;
        color: #728078;
        width: 36px;
        flex-shrink: 0;
        padding-top: 4px;
        font-variant-numeric: tabular-nums;
      }
      .class-time small {
        font-size: 9px;
        display: block;
        color: #939b95;
        margin-top: 3px;
      }
      .class-card {
        flex: 1;
        padding: 9px 11px;
        border-left: 3px solid #ddd6eb;
        background: #f8f6fc;
        border-radius: 0 7px 7px 0;
      }
      .class-card.english {
        background: #fcf8f0;
        border-color: #e2ceaa;
      }
      .class-card.science {
        background: #f1f7f4;
        border-color: #a4c5b8;
      }
      .class-card.history {
        background: #f1f6f9;
        border-color: #b3cbd8;
      }
      .class-card h3 {
        font-size: 12px;
        display: flex;
        justify-content: space-between;
        gap: 5px;
        align-items: center;
        color: #3d4050;
      }
      .class-card p {
        font-size: 10px;
        color: #7f8089;
        margin-top: 3px;
      }
      .class-tag {
        font-size: 8px;
        font-weight: 500;
        padding: 1px 5px;
        border: 1px solid #cdc1e1;
        border-radius: 4px;
        color: #796593;
      }
      .schedule-footer {
        padding: 1px 23px 18px;
      }
      .schedule-footer a {
        font-size: 11px;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 7px;
        color: #5d6d62;
      }
      .assignment-list {
        padding: 0 23px 6px;
      }
      .assignment-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        border-top: 1px solid var(--line);
        padding: 16px 0;
      }
      .assignment-row:hover .assignment-name {
        text-decoration: underline;
      }
      .subject-icon {
        width: 36px;
        height: 39px;
        display: grid;
        place-items: center;
        border-radius: 9px;
        background: #f0eaf9;
        color: #8b6faa;
      }
      .subject-icon.mint {
        background: #e8f2ed;
        color: #7caa8d;
      }
      .assignment-copy {
        flex: 1;
        min-width: 0;
      }
      .assignment-name {
        display: block;
        font-size: 13px;
        font-weight: 650;
      }
      .assignment-meta {
        display: block;
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }
      .assignment-progress {
        width: 61px;
        flex-shrink: 0;
        font-size: 9px;
        color: var(--muted);
      }
      .assignment-progress .track {
        margin-top: 5px;
      }
      .track {
        height: 4px;
        display: block;
        border-radius: 10px;
        background: #edf0ed;
        overflow: hidden;
      }
      .track i {
        display: block;
        height: 100%;
        width: var(--value);
        background: #a99ac8;
        border-radius: 10px;
      }
      .progress-panel {
        padding: 21px 23px;
        background: #edf4e7;
        border: 1px solid #e0ead8;
        border-radius: var(--r);
      }
      .progress-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .progress-head .icon {
        color: #557342;
      }
      .progress-visual {
        display: flex;
        gap: 18px;
        align-items: center;
        margin: 22px 0 16px;
      }
      .progress-ring {
        position: relative;
        width: 76px;
        height: 76px;
        flex: none;
        display: grid;
        place-items: center;
      }
      .progress-ring svg {
        position: absolute;
        inset: 0;
        width: 76px;
        height: 76px;
        transform: rotate(-90deg);
      }
      .progress-ring strong {
        font-size: 17px;
        color: #37552f;
        letter-spacing: -0.6px;
      }
      .progress-message strong {
        font-size: 13px;
        font-weight: 750;
      }
      .progress-message p {
        font-size: 10px;
        line-height: 1.8;
        color: #6c7e64;
        max-width: 175px;
        margin-top: 4px;
      }
      .progress-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #dce6d4;
        padding-top: 13px;
        font-size: 10px;
        color: #638053;
      }
      .progress-foot button {
        font-size: 10px;
        font-weight: 700;
        color: #49613c;
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .school-panel .panel-head {
        padding-bottom: 8px;
      }
      .school-links {
        padding: 0 23px 12px;
      }
      .school-link {
        display: flex;
        align-items: center;
        width: 100%;
        text-align: left;
        gap: 11px;
        padding: 12px 0;
        border-bottom: 1px solid #f0f2f0;
      }
      .school-link:last-child {
        border: 0;
      }
      .school-link > .icon {
        color: #899b8d;
        width: 17px;
        height: 17px;
      }
      .school-link span {
        flex: 1;
        font-size: 12px;
        font-weight: 550;
      }
      .school-link small {
        font-size: 9px;
        color: #859087;
      }
      .school-link:hover span {
        text-decoration: underline;
      }
      .page-footer {
        display: flex;
        justify-content: space-between;
        gap: 15px;
        margin-top: 28px;
        color: #8a948d;
        font-size: 10px;
      }
      .page-footer span:first-child {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .page-footer .icon {
        width: 13px;
        height: 13px;
      }
      .overlay {
        display: none;
      }
      .view-header {
        margin-bottom: 24px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
      }
      .view-header p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 10px;
      }
      .content-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 22px;
      }
      .content-card {
        padding: 25px;
        background: white;
        border: 1px solid var(--line);
        border-radius: 18px;
      }
      .content-card p {
        color: var(--muted);
        font-size: 12px;
        margin-top: 8px;
      }
      .content-card .button {
        margin-top: 20px;
      }
      .content-card h2 {
        margin: 14px 0 0;
      }
      .content-card .subject-icon {
        width: 45px;
        height: 45px;
      }
      .large-stat {
        font-size: 35px;
        font-weight: 750;
        letter-spacing: -1px;
        color: var(--ink);
        margin-top: 13px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      .data-table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12px;
      }
      .data-table th {
        text-align: left;
        font-weight: 550;
        font-size: 10px;
        color: var(--muted);
        padding: 15px 22px;
        border-bottom: 1px solid var(--line);
      }
      .data-table td {
        padding: 18px 22px;
        border-bottom: 1px solid var(--line);
      }
      .data-table tr:last-child td {
        border: 0;
      }
      .data-table td:first-child {
        font-weight: 650;
      }
      .empty-message {
        padding: 36px 26px;
        color: var(--muted);
        font-size: 12px;
        text-align: center;
      }
      .info-strip {
        padding: 14px 18px;
        border-radius: 11px;
        background: #f0edf8;
        color: #645579;
        font-size: 11px;
        margin-bottom: 22px;
      }
      .section-title {
        margin: 28px 0 16px;
      }
      .week-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(140px, 1fr));
        gap: 14px;
        padding: 22px;
        min-width: 780px;
      }
      .week-col h3 {
        font-size: 12px;
        margin-bottom: 17px;
      }
      .week-class {
        border-left: 3px solid #b9a7d6;
        border-radius: 0 8px 8px 0;
        background: #f5f1fa;
        padding: 11px;
        margin-bottom: 10px;
        font-size: 11px;
      }
      .week-class strong {
        display: block;
        margin: 3px 0;
        font-size: 11px;
      }
      .week-class small {
        font-size: 9px;
        color: var(--muted);
      }
      .week-class time {
        font-size: 10px;
        color: #807290;
      }
      .notes-area {
        width: 100%;
        border: 1px solid #dae3dc;
        padding: 13px;
        border-radius: 10px;
        background: #fcfdfb;
        min-height: 160px;
        resize: vertical;
        font-size: 12px;
        line-height: 1.8;
      }
      .field {
        margin: 18px 0;
      }
      .field label {
        display: block;
        font-size: 11px;
        font-weight: 650;
        margin-bottom: 7px;
      }
      .field input,
      .field select {
        display: block;
        width: 100%;
        border: 1px solid #dbe3dd;
        border-radius: 9px;
        padding: 10px 12px;
        background: #fff;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .form-actions {
        display: flex;
        gap: 9px;
        justify-content: flex-end;
        margin-top: 23px;
      }
      .notice {
        font-size: 11px;
        line-height: 1.7;
        background: #f5f7f3;
        color: #73806e;
        padding: 12px 14px;
        border-radius: 9px;
        margin-top: 20px;
      }
      .dialog {
        border: 1px solid #e4e9e3;
        border-radius: 22px;
        width: min(580px, calc(100% - 32px));
        padding: 0;
        color: var(--text);
        box-shadow: 0 24px 100px #1e372a25;
        max-height: calc(100dvh - 48px);
        background: #fff;
      }
      .dialog::backdrop {
        background: #20312755;
        backdrop-filter: blur(4px);
      }
      .dialog-header {
        padding: 24px 25px 17px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 15px;
        border-bottom: 1px solid var(--line);
      }
      .dialog-header h2 {
        font-size: 19px;
      }
      .dialog-close {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--bg);
      }
      .dialog-body {
        padding: 22px 25px 26px;
        font-size: 12px;
        line-height: 1.8;
      }
      .dialog-body > p {
        color: var(--muted);
      }
      .dialog-body h3 {
        margin-top: 18px;
      }
      .dialog-body ul,
      .dialog-body ol {
        padding-left: 20px;
        color: #627365;
      }
      .dialog-body li {
        margin: 8px 0;
      }
      .dialog-body .search-field {
        display: flex;
        align-items: center;
        gap: 9px;
        border: 1px solid #d9e2db;
        border-radius: 10px;
        padding: 11px 12px;
      }
      .search-field input {
        border: 0;
        outline: none;
        width: 100%;
        background: none;
      }
      .search-field:focus-within {
        outline: 2px solid #a795c7;
      }
      .search-results {
        margin-top: 15px;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .search-result {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 13px 10px;
        border-radius: 8px;
        text-align: left;
      }
      .search-result:hover {
        background: var(--soft);
      }
      .search-result small {
        display: block;
        font-size: 10px;
        color: var(--muted);
      }
      .search-result strong {
        font-weight: 600;
      }
      .topic-options {
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin-top: 20px;
      }
      .topic-option {
        text-align: left;
        padding: 15px;
        border: 1px solid #e1e5dd;
        border-radius: 10px;
        background: #fbfcfa;
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 12px;
      }
      .topic-option:hover {
        background: #edf3e9;
      }
      .topic-option .icon {
        color: #788e6b;
      }
      .topic-option span {
        flex: 1;
      }
      .topic-option small {
        display: block;
        color: var(--muted);
        font-size: 10px;
        margin-top: 3px;
      }
      .study-example {
        padding: 20px;
        background: #f4f0fb;
        border-radius: 12px;
        margin: 18px 0;
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        color: #625078;
        letter-spacing: 0.3px;
      }
      .quiz-answers {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }
      .quiz-answer {
        border: 1px solid #dce4dc;
        border-radius: 9px;
        padding: 13px;
        text-align: left;
      }
      .quiz-answer:hover {
        background: var(--soft);
      }
      .quiz-answer.correct {
        border-color: #749d67;
        background: #edf5e7;
      }
      .quiz-answer.incorrect {
        border-color: #cfa286;
        background: #fbf1e8;
      }
      .quiz-feedback {
        font-size: 12px;
        margin-top: 18px;
        color: #4b6541;
        min-height: 25px;
      }
      .toast {
        position: fixed;
        bottom: 26px;
        left: calc(50% + var(--sidebar) / 2);
        transform: translate(-50%, 15px);
        padding: 12px 20px;
        background: var(--ink);
        color: #fff;
        font-size: 12px;
        border-radius: 10px;
        box-shadow: 0 6px 22px #19312321;
        z-index: 100;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
        max-width: calc(100% - 32px);
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .mobile-close {
        display: none;
      }
      .storage-warning {
        margin: 0 0 20px;
        padding: 12px 15px;
        border-radius: 10px;
        background: #fbf0dd;
        font-size: 12px;
        color: #735b30;
      }
      .note-card {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        background: #f8f6fc;
        padding: 18px;
        border-radius: 10px;
        line-height: 1.8;
        color: #605373;
        margin: 16px 0;
      }
      .switch-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 0;
        border-bottom: 1px solid var(--line);
        gap: 20px;

      .switch-row label {
        font-size: 12px;
      }
      .switch-row input {
        accent-color: var(--forest);
        width: 18px;
        height: 18px;
      }
      .task-tools {
        display: flex;
        gap: 9px;
      }
      .focus-mode .school-panel {
        display: none;
      }
      .focus-mode .mini-chom {
        display: none;
      }

        function studyCard() {

            )
            .join("");

          const b = e.target.closest("[data-action]");
          if (!b) return;
          const a = b.dataset.action;
          if (a === "open-nav") {
            $("#sidebar").classList.add("open");
            $("#nav-overlay").classList.add("open");
            $(".mobile-menu").setAttribute("aria-expanded", "true");
            $("#sidebar").setAttribute("role", "dialog");
            $("#sidebar").setAttribute("aria-modal", "true");
            syncNavAccessibility();
            $(".mobile-close").focus();
          }
          if (a === "close-nav") {
            closeNav();
            $(".mobile-menu").focus();
          }
          if (a === "close-dialog") closeModal();
          if (a === "navigate") go(b.dataset.view);
          if (a === "add-task") addTask();
          if (a === "assignment") assignment(b.dataset.id);
          if (a === "study") study(b.dataset.topic);
          if (a === "search") search();
          if (a === "search-go") {
            closeModal();
            taskFilter = b.dataset.taskFilter || "today";
            go(b.dataset.view);
            if (currentView === b.dataset.view) render();
          }
          if (a === "notifications") {
            state.notificationsRead = true;
            save();
            $("#notification-dot").hidden = true;
            modal(
              "Your little updates.",
              `<p>You’re all caught up with this sample workspace.</p><div class="topic-options"><button class="topic-option" data-action="search-go" data-view="results">${icon("chart")}<span>Your Geography result is ready<small>78% · Sample assessment result</small></span>${icon("chevron", true)}</button><button class="topic-option" data-action="search-go" data-view="assignments">${icon("file")}<span>Two assignments due Friday<small>History essay and Life Sciences lab report</small></span>${icon("chevron", true)}</button></div>`,
            );
          }
          if (a === "profile")
            modal(
              "Hi, Amara.",
              `<div style="display:flex;align-items:center;gap:16px"><span class="avatar" style="width:54px;height:54px;font-size:17px">AN</span><div><h3 style="margin:0">Amara</h3><p class="muted">Grade 10 · Class B</p></div></div><div class="notice">You’re viewing a sample student profile. No school account is connected.</div><div class="form-actions"><button class="button secondary" data-action="search-go" data-view="settings">My preferences</button></div>`,
            );
          if (a === "service") {
            const info = serviceContent[b.dataset.service];
            if (info) modal(info[0], info[1]);
          }
          if (a === "reveal-algebra") {
            $("#algebra-answer").hidden = false;
            b.hidden = true;
          }
          if (a === "open-tasks") {
            closeModal();
            go("tasks");
          }
          if (a === "essay-notes") {
            closeModal();
            go("chom");
          }
          if (a === "save-notes") {
            state.notes = $("#study-notes").value;
            persist("Your notes are saved on this device.");
          }
          if (a === "quiz-next") {
            if (quizIndex < 2) {
              quizIndex++;
              quizQuestion();
            } else
              modal(
                "Look at that — you showed up.",
                `<div class="large-stat" style="text-align:center">${quizScore} / 3</div><p style="text-align:center">${quizScore === 3 ? "You’ve got the core ideas of osmosis." : "Every question is a chance to learn. Try again when you’re ready."}</p><div class="form-actions"><button class="button secondary" data-action="study" data-topic="quiz">Try again</button><button class="button" data-action="close-dialog">All done</button></div>`,
              );
          }
        });
        document.addEventListener("change", (e) => {
          if (e.target.matches("[data-task]")) {
            const t = state.tasks.find((t) => t.id === e.target.dataset.task);
            if (!t) return;
            const done = e.target.checked;
            t.done = done;
            const id = t.id;
            save();
            $("#tasks-content").innerHTML = tasksMarkup();
            $("#nav-task-count").textContent = remaining();
            if ($("#task-count")) $("#task-count").textContent = remaining();
            if ($("#tasks-summary"))
              $("#tasks-summary").textContent = remaining() + " left today";
            if ($("#remaining-copy"))
              $("#remaining-copy").textContent = remaining() + " tasks";
            const replacement = $$("[data-task]").find(
              (el) => el.dataset.task === id,
            );
            if (replacement) replacement.focus();
            else $(`[data-filter="${taskFilter}"]`).focus();
            announce(
              storageAvailable
                ? done
                  ? "One step forward. Task completed."
                  : "Task moved back to your to-do list."
                : "Updated for this visit. Browser storage is unavailable.",
            );
          }
          if (e.target.id === "focus-toggle") {
            state.focus = e.target.checked;
            document.body.classList.toggle("focus-mode", state.focus);
            persist("Your learning space has been updated.");
          }
        });
        document.addEventListener("input", (e) => {
          if (e.target.id === "global-search") searchResults(e.target.value);
          if (e.target.id === "study-notes") {
            state.notes = e.target.value;
            save();
          }
        });
        document.addEventListener("submit", (e) => {
          if (e.target.id === "study-form") {
            e.preventDefault();
            const q = new FormData(e.target).get("question").trim();
            const topic = /algebra|quadratic|math/i.test(q)
              ? "algebra"
              : /osmosis|quiz|biology/i.test(q)
                ? "quiz"
                : /plan|week|task|friday/i.test(q)
                  ? "plan"
                  : /essay|writ/i.test(q)
                    ? "essay"
                    : "topics";
            study(topic, q);
          }
          if (e.target.id === "add-task-form") {
            e.preventDefault();
            const f = new FormData(e.target),
              title = f.get("title").trim();
            if (!title) {
              $("#task-title").setCustomValidity("Give your task a name.");
              $("#task-title").reportValidity();
              $("#task-title").addEventListener(
                "input",
                () => $("#task-title").setCustomValidity(""),
                { once: true },
              );
              return;
            }
            state.tasks.push({
              id:
                "task-" +
                Date.now() +
                "-" +
                Math.random().toString(36).slice(2, 8),
              title,
              subject: f.get("subject"),
              when: f.get("when"),
              time: f.get("when") === "today" ? "Today" : "Tomorrow",
              done: false,
            });
            taskFilter = f.get("when");
            persist("A little more clarity. Your task is added.");
            closeModal();
            render();
          }
          if (e.target.id === "assignment-form") {
            e.preventDefault();
            const f = new FormData(e.target),
              id = e.target.dataset.id;
            state.assignmentNotes[id] = f.get("notes");
            state.assignmentProgress[id] = +f.get("progress");
            persist("Your draft is saved on this device.");
            closeModal();
            render();
          }
        });
        $("#nav-overlay").addEventListener("click", () => {
          closeNav();
          $(".mobile-menu").focus();
        });
        document.addEventListener("keydown", (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
            e.preventDefault();
            search();
          }
          if (e.key === "Escape" && $("#sidebar").classList.contains("open")) {
            closeNav();
            $(".mobile-menu").focus();
          }
          if (e.key === "Tab" && $("#sidebar").classList.contains("open")) {
            const focusable = $$("#sidebar a,#sidebar button").filter(
              (x) => x.getClientRects().length,
            );
            const first = focusable[0],
              last = focusable[focusable.length - 1];
            if (e.shiftKey && document.activeElement === first) {
              e.preventDefault();
              last.focus();
            } else if (!e.shiftKey && document.activeElement === last) {
              e.preventDefault();
              first.focus();
            }
          }
          if (
            e.target.matches('[role="tab"]') &&
            ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)
          ) {
            e.preventDefault();
            const filters = ["today", "upcoming", "done"],
              i = filters.indexOf(taskFilter);
            taskFilter =
              e.key === "Home"
                ? "today"
                : e.key === "End"
                  ? "done"
                  : filters[(i + (e.key === "ArrowRight" ? 1 : 2)) % 3];
            $("#tasks-content").innerHTML = tasksMarkup();
            $(`[data-filter="${taskFilter}"]`).focus();
          }
        });
        window.addEventListener("hashchange", route);
        route();
      })();
    </script>
  </body>
</html>
