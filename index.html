<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chom Learn · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --canvas: #faf8f5;
    --surface: #ffffff;
    --ink: #27251e;
    --ink-2: #72706b;
    --ink-3: #92918b;
    --line: #e6e3dc;
    --line-strong: #d1d1cd;
    --accent: #016a71;
    --accent-tint: #e8f1f1;
    --inverse: #27251e;
    --inverse-ink: #faf8f5;
    --inverse-ink-2: #b4b1a8;

    --shadow: 0 1px 2px rgba(0, 0, 0, .06);
    --shadow-hover: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(39, 37, 30, .07);
    --r-card: 16px;
    --r-ctl: 8px;
  }

  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font: 400 15px/1.5 Inter, system-ui, sans-serif;
    font-feature-settings: "cv11", "ss01";
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; flex: none; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    height: 64px;
    display: flex; align-items: center; gap: 24px;
    padding: 0 32px;
    background: rgba(250, 248, 245, .9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--ink); color: var(--canvas);
    display: grid; place-items: center; font-size: 14px; font-weight: 600;
  }
  .brand-school { color: var(--ink-3); font-weight: 400; padding-left: 10px; border-left: 1px solid var(--line-strong); }
  .search {
    flex: 1; max-width: 380px; margin-left: auto;
    display: flex; align-items: center; gap: 10px;
    height: 36px; padding: 0 12px;
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px;
    color: var(--ink-3); font-size: 14px;
  }
  .kbd { margin-left: auto; font-size: 12px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 5px; }
  .topbar-right { display: flex; align-items: center; gap: 8px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: var(--r-ctl);
    display: grid; place-items: center; color: var(--ink-2); position: relative;
  }
  .icon-btn:hover { background: var(--accent-tint); color: var(--accent); }
  .dot { position: absolute; top: 8px; right: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: #e9e4da; color: var(--ink);
    display: grid; place-items: center; font-weight: 600; font-size: 13px;
  }

  /* ---------- page ---------- */
  .page {
    max-width: 1280px; margin: 0 auto;
    padding: 48px 32px 80px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 48px;
    align-items: start;
  }
  .eyebrow { font-size: 13px; color: var(--ink-3); }
  .hello h1 { margin-top: 6px; font-size: 30px; line-height: 1.2; font-weight: 600; letter-spacing: -.025em; text-wrap: balance; }
  .summary {
    margin-top: 20px;
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    height: 30px; padding: 0 12px;
    border: 1px solid var(--line-strong); border-radius: 9999px;
    font-size: 13px; color: var(--ink-2); background: var(--surface);
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .section-head {
    margin: 40px 0 16px;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  .section-head h2 { font-size: 13px; font-weight: 500; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; }

  /* ---------- tiles: 3 + 2 ---------- */
  .tiles {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 20px;
  }
  .tile { grid-column: span 2; }
  .tile:nth-child(4) { grid-column: 2 / span 2; }
  .tile:nth-child(5) { grid-column: 4 / span 2; }

  .tile {
    min-height: 220px;
    padding: 20px;
    border-radius: var(--r-card);
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    display: flex; flex-direction: column;
    text-align: left;
    transition: box-shadow .18s ease, border-color .18s ease, transform .18s ease;
  }
  .tile:hover { box-shadow: var(--shadow-hover); border-color: var(--line-strong); transform: translateY(-1px); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .tile-top { display: flex; align-items: center; justify-content: space-between; }
  .tile-idx { font-size: 13px; font-weight: 500; color: var(--ink-3); }
  .tile-ic {
    width: 40px; height: 40px; border-radius: 10px;
    border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--ink);
  }
  .tile-name { margin-top: auto; font-size: 19px; font-weight: 600; letter-spacing: -.015em; }
  .tile-desc { margin-top: 4px; font-size: 14px; color: var(--ink-2); }
  .tile-foot {
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 13px; color: var(--ink-2);
  }
  .tile-foot strong { color: var(--ink); font-weight: 600; }
  .arrow { color: var(--ink-3); transition: transform .18s ease, color .18s ease; }
  .tile:hover .arrow { color: var(--accent); transform: translateX(3px); }

  .progress { height: 4px; border-radius: 9999px; background: var(--line); overflow: hidden; width: 72px; }
  .progress span { display: block; height: 100%; background: var(--accent); border-radius: inherit; }

  /* Chom: the one inverse surface */
  .tile.inverse {
    background: var(--inverse); border-color: var(--inverse); color: var(--inverse-ink);
  }
  .tile.inverse .tile-idx,
  .tile.inverse .tile-desc,
  .tile.inverse .tile-foot { color: var(--inverse-ink-2); }
  .tile.inverse .tile-ic { border-color: rgba(250,248,245,.18); color: var(--inverse-ink); }
  .tile.inverse .tile-foot { border-top-color: rgba(250,248,245,.14); }
  .tile.inverse .tile-foot strong { color: var(--inverse-ink); }
  .tile.inverse .arrow { color: var(--inverse-ink-2); }
  .tile.inverse:hover .arrow { color: #7fc7c9; }

  /* ---------- My items panel ---------- */
  .panel {
    position: sticky; top: 88px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel-head {
    padding: 18px 20px 14px;
    display: flex; align-items: baseline; justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }
  .panel-head h2 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .panel-head span { font-size: 13px; color: var(--ink-3); }
  .items { list-style: none; padding: 6px; }
  .items li + li .item { border-top: 1px solid var(--line); }
  .items li:hover + li .item, .items li:hover .item { border-top-color: transparent; }
  .item {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px; border-radius: 10px;
    text-align: left; font-size: 14px; font-weight: 500;
  }
  .item:hover { background: var(--accent-tint); }
  .item:hover .item-ic { color: var(--accent); }
  .item:hover .chev { color: var(--accent); }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .item-ic { color: var(--ink-2); }
  .item-label { flex: 1; min-width: 0; }
  .item-sub { display: block; font-weight: 400; font-size: 12.5px; color: var(--ink-3); }
  .chev { color: var(--line-strong); }
  .badge {
    font-size: 11.5px; font-weight: 500;
    padding: 2px 8px; border-radius: 9999px;
    color: var(--accent); background: var(--accent-tint);
  }
  .status-ok {
    font-size: 11.5px; font-weight: 500; color: var(--accent);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .status-ok::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  /* ---------- responsive ---------- */
  @media (max-width: 1100px) {
    .page { grid-template-columns: 1fr; gap: 40px; }
    .panel { position: static; }
  }
  @media (max-width: 760px) {
    .topbar { padding: 0 16px; gap: 12px; }
    .search, .brand-school { display: none; }
    .topbar-right { margin-left: auto; }
    .page { padding: 28px 16px 56px; }
    .hello h1 { font-size: 24px; }
    .tiles { grid-template-columns: 1fr; gap: 12px; }
    .tile, .tile:nth-child(4), .tile:nth-child(5) { grid-column: auto; min-height: 0; }
    .tile-name { margin-top: 20px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-mark">C</span>Chom Learn <span class="brand-school">Student</span></div>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    Search classes, tasks, people
    <span class="kbd">⌘K</span>
  </div>
  <div class="topbar-right">
    <button class="icon-btn" aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="dot"></span>
    </button>
    <div class="avatar" aria-label="Your profile">AN</div>
  </div>
</header>

        <span class="tile-name">Chom</span>
        <span class="tile-desc">Open your Chom space</span>

  </section>
