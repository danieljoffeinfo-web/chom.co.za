<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Chom Learn · Dashboard</title>
<link rel="preconnect" href="https://rsms.me/">
<link rel="stylesheet" href="https://rsms.me/inter/inter.css">
<style>
  /* ------------------------------------------------------------------
     Tokens
     Canvas: warm off-white planner page. Tiles: navy instruments.
     One UI accent (blue) used rarely; sky is a data highlight on navy only.
  ------------------------------------------------------------------ */
  :root {
    --canvas: #f9f7f3;
    --surface: #ffffff;
    --surface-2: #f2efe9;
    --ink: #1b1a17;
    --ink-2: #5d5b55;
    --ink-3: #8b8880;
    --line: #e6e2da;
    --line-2: #d6d1c6;

    --accent: #2a5bd7;
    --accent-tint: #e9eefb;
    --ok: #2f8a57;
    --ok-tint: #e6f3ec;

    --navy: #0f1f3d;
    --navy-2: #152b54;
    --navy-ink: #eef2f9;
    --navy-ink-2: #a3b2ce;
    --navy-ink-3: #6f84a8;
    --navy-line: rgba(255, 255, 255, .10);
    --sky: #8fb4ff;
    --amber: #ffd08a;

    --rail-w: 320px;
    --bar-h: 56px;
    --r-tile: 14px;
    --r-ctl: 8px;
    --r-pill: 9999px;

    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--canvas);
    color: var(--ink);
    font: 400 14px/1.5 InterVariable, Inter, system-ui, sans-serif;
    font-feature-settings: "cv01", "ss03";
    letter-spacing: -.011em;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; letter-spacing: inherit; }
  a { color: inherit; text-decoration: none; }
  svg { display: block; flex: none; }
  .num { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  /* ------------------------------------------------------------------
     Top bar
  ------------------------------------------------------------------ */
  .topbar {
    position: sticky; top: 0; z-index: 10;
    height: var(--bar-h);
    display: flex; align-items: center; gap: 16px;
    padding: 0 24px;
    background: color-mix(in srgb, var(--canvas) 88%, transparent);
    backdrop-filter: saturate(1.2) blur(10px);
    -webkit-backdrop-filter: saturate(1.2) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 590; font-size: 14px; letter-spacing: -.012em;
  }
  .mark {
    width: 24px; height: 24px; border-radius: 7px;
    background: var(--navy); color: #fff;
    display: grid; place-items: center;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
  }
  .brand-role { color: var(--ink-3); font-weight: 400; margin-left: 2px; }
  .brand-role::before { content: "/"; margin-right: 8px; color: var(--line-2); }

  .tabs {
    margin-left: 16px;
    display: flex; gap: 2px; padding: 3px;
    border: 1px solid var(--line); border-radius: var(--r-pill);
    background: var(--surface);
  }
  .tab {
    padding: 5px 12px; border-radius: var(--r-pill);
    font-size: 13px; font-weight: 510; color: var(--ink-2);
    transition: background .15s ease, color .15s ease;
  }
  .tab:hover { background: var(--surface-2); color: var(--ink); }
  .tab.on { background: var(--navy); color: var(--navy-ink); box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }

  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .search {
    width: 272px; height: 32px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 8px 0 10px; margin-right: 6px;
    background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-pill);
    color: var(--ink-3); font-size: 13px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .search:hover { border-color: #c4beb1; }
  .search span { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kbd {
    flex: none !important;
    font-family: var(--mono); font-size: 11px; line-height: 1;
    padding: 4px 5px; border-radius: 5px;
    color: var(--ink-3); background: var(--surface-2); border: 1px solid var(--line);
  }
  .icon-btn {
    width: 32px; height: 32px; border-radius: var(--r-pill);
    display: grid; place-items: center; color: var(--ink-2); position: relative;
    transition: background .15s ease, color .15s ease;
  }
  .icon-btn:hover { background: var(--surface-2); color: var(--ink); }
  .icon-btn.only-m { display: none; }
  .dot {
    position: absolute; top: 7px; right: 8px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 0 2px var(--canvas);
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%; margin-left: 4px;
    background: #e7e1d5; color: var(--ink);
    border: 1px solid var(--line-2);
    display: grid; place-items: center; font-weight: 590; font-size: 11px; letter-spacing: 0;
  }

  /* ------------------------------------------------------------------
     Layout
  ------------------------------------------------------------------ */
  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) var(--rail-w);
    min-height: calc(100vh - var(--bar-h));
  }
  .page {
    width: 100%; max-width: 1064px; margin: 0 auto;
    padding: 40px 40px 88px;
    min-width: 0;
  }

  /* ---------- header ---------- */
  .eyebrow {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--ink-3);
  }
  .eyebrow .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--line-2); }
  h1 {
    margin-top: 8px;
    font-size: 30px; line-height: 1.15; font-weight: 590; letter-spacing: -.028em;
    text-wrap: balance;
  }

  .stats {
    margin-top: 24px;
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 1px 2px rgba(27, 26, 23, .04);
    overflow: hidden;
  }
  .stat { padding: 14px 18px 15px; border-left: 1px solid var(--line); min-width: 0; }
  .stat:first-child { border-left: 0; }
  .stat-l { display: block; font-size: 12px; color: var(--ink-3); }
  .stat-v {
    display: block; margin-top: 3px;
    font-size: 15px; font-weight: 510; letter-spacing: -.012em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stat-v b { font-weight: 590; }
  .stat-v .muted { color: var(--ink-3); font-weight: 400; }
  .stat-v .live { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); margin: 0 6px 1px 0; }

  .section-head {
    margin: 36px 0 14px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-head h2 { font-size: 13px; font-weight: 510; color: var(--ink-2); letter-spacing: -.005em; }
  .ghost {
    font-size: 12.5px; font-weight: 510; color: var(--ink-3);
    padding: 4px 8px; border-radius: 6px;
    transition: background .15s ease, color .15s ease;
  }
  .ghost:hover { background: var(--surface-2); color: var(--ink); }

  /* ------------------------------------------------------------------
     Tiles: 3 on top, 2 centred below (6-track grid, span 2 each)
  ------------------------------------------------------------------ */
  .tiles {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 16px;
  }
  .tile { grid-column: span 2; }
  .tile:nth-child(4) { grid-column: 2 / span 2; }
  .tile:nth-child(5) { grid-column: 4 / span 2; }

  .tile {
    position: relative;
    display: flex; flex-direction: column; gap: 12px;
    min-height: 252px;
    padding: 16px 16px 14px;
    border-radius: var(--r-tile);
    background: linear-gradient(180deg, var(--navy-2) 0%, var(--navy) 100%);
    color: var(--navy-ink);
    text-align: left;
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .10),
      inset 0 0 0 1px rgba(255, 255, 255, .04),
      0 0 0 1px rgba(15, 31, 61, .85),
      0 1px 2px rgba(15, 31, 61, .25);
    transition: transform .18s ease, box-shadow .18s ease;
    min-width: 0;
  }
  .tile:hover {
    transform: translateY(-2px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, .14),
      inset 0 0 0 1px rgba(255, 255, 255, .07),
      0 0 0 1px rgba(15, 31, 61, .9),
      0 1px 2px rgba(15, 31, 61, .3),
      0 18px 36px -16px rgba(15, 31, 61, .5);
  }
  .tile:active { transform: translateY(0); }
  .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .tile-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .idx {
    width: 26px; height: 22px; flex: none;
    display: grid; place-items: center;
    font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: .02em;
    color: var(--navy-ink-2);
    border: 1px solid var(--navy-line); border-radius: 6px;
    background: rgba(255, 255, 255, .03);
  }
  .tile-title { font-size: 15.5px; font-weight: 590; letter-spacing: -.014em; white-space: nowrap; }
  .pill {
    margin-left: auto; flex: none;
    font-size: 11.5px; font-weight: 510; letter-spacing: -.005em;
    padding: 3px 8px; border-radius: var(--r-pill);
    color: var(--navy-ink-2);
    background: rgba(255, 255, 255, .07);
    border: 1px solid rgba(255, 255, 255, .06);
  }
  .pill.hot { color: var(--amber); background: rgba(255, 208, 138, .10); border-color: rgba(255, 208, 138, .16); }
  .pill.sky { color: var(--sky); background: rgba(143, 180, 255, .10); border-color: rgba(143, 180, 255, .16); }

  /* ledger rows — the mini-preview inside each tile */
  .ledger { list-style: none; display: flex; flex-direction: column; }
  .ledger li {
    display: flex; align-items: center; gap: 10px; min-width: 0;
    padding: 8px 0;
    border-top: 1px solid var(--navy-line);
    font-size: 13px;
  }
  .ledger li:first-child { border-top: 0; padding-top: 2px; }
  .l-time {
    flex: none; width: 46px;
    font-family: var(--mono); font-size: 11.5px; font-weight: 500; letter-spacing: 0;
    font-variant-numeric: tabular-nums;
    color: var(--navy-ink-3);
  }
  .l-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .l-text .l-sub { color: var(--navy-ink-2); }
  .l-text .l-sub::before { content: "·"; margin: 0 5px; color: var(--navy-ink-3); }
  .l-meta { flex: none; font-size: 11.5px; color: var(--navy-ink-3); }
  .l-meta.hot { color: var(--amber); }
  .ledger li.is-done .l-text { color: var(--navy-ink-2); }
  .ledger li.next .l-time { color: var(--sky); }
  .ledger li.next .l-text { font-weight: 510; }
  .l-check {
    flex: none; width: 14px; height: 14px; border-radius: 4px;
    border: 1px solid rgba(255, 255, 255, .22);
    background: rgba(255, 255, 255, .03);
  }
  .l-check.done { background: var(--sky); border-color: var(--sky); position: relative; }
  .l-check.done::after {
    content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px;
    border: solid var(--navy); border-width: 0 1.6px 1.6px 0; transform: rotate(45deg);
  }

  /* tiny segmented progress used in Assignments rows */
  .seg { flex: none; display: flex; gap: 2px; }
  .seg i { width: 9px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .12); }
  .seg i.on { background: var(--sky); }

  /* Chom (assistant) body */
  .ask {
    display: flex; align-items: center; gap: 10px;
    height: 40px; padding: 0 8px 0 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, .06);
    border: 1px solid rgba(255, 255, 255, .10);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05);
    color: var(--navy-ink-2); font-size: 13px;
    transition: background .15s ease, border-color .15s ease;
  }
  .tile:hover .ask { background: rgba(255, 255, 255, .09); border-color: rgba(255, 255, 255, .16); }
  .ask span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ask .kbd { color: var(--navy-ink-3); background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.08); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips span {
    font-size: 12px; color: var(--navy-ink-2);
    padding: 4px 9px; border-radius: var(--r-pill);
    border: 1px solid var(--navy-line);
  }
  .recent { font-size: 12px; color: var(--navy-ink-3); display: flex; align-items: center; gap: 8px; }
  .recent b { color: var(--navy-ink-2); font-weight: 510; }

  /* Help me Improve body */
  .bars { list-style: none; display: flex; flex-direction: column; gap: 10px; padding-top: 2px; }
  .bars li { display: grid; grid-template-columns: 1fr auto; row-gap: 6px; column-gap: 10px; align-items: center; font-size: 13px; }
  .b-label { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-label .l-sub { color: var(--navy-ink-2); }
  .b-label .l-sub::before { content: "·"; margin: 0 5px; color: var(--navy-ink-3); }
  .b-val { font-family: var(--mono); font-size: 11.5px; color: var(--navy-ink-3); font-variant-numeric: tabular-nums; }
  .b-val.up { color: var(--sky); }
  .b-track { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, .10); overflow: hidden; }
  .b-track i { display: block; height: 100%; width: var(--v); background: var(--sky); border-radius: inherit; }

  .tile-foot {
    margin-top: auto; padding-top: 12px;
    border-top: 1px solid var(--navy-line);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 12.5px; color: var(--navy-ink-2);
  }
  .tile-foot strong { color: var(--navy-ink); font-weight: 590; }
  .open {
    display: inline-flex; align-items: center; gap: 5px;
    font-weight: 510; color: var(--navy-ink-2);
    transition: color .15s ease;
  }
  .open svg { transition: transform .18s ease; }
  .tile:hover .open { color: var(--navy-ink); }
  .tile:hover .open svg { transform: translateX(2px); }

  /* ------------------------------------------------------------------
     My items rail — flush right, sticky under the top bar
  ------------------------------------------------------------------ */
  .rail {
    position: sticky; top: var(--bar-h);
    height: calc(100vh - var(--bar-h));
    overflow-y: auto;
    background: var(--surface);
    border-left: 1px solid var(--line);
    display: flex; flex-direction: column;
  }
  .rail-head {
    padding: 18px 20px 10px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .rail-head h2 { font-size: 14px; font-weight: 590; letter-spacing: -.012em; }
  .count {
    font-family: var(--mono); font-size: 11px; line-height: 1;
    padding: 4px 6px; border-radius: 5px;
    color: var(--ink-3); background: var(--surface-2); border: 1px solid var(--line);
  }
  .items { list-style: none; padding: 0 10px 20px; display: flex; flex-direction: column; }
  .items .gap { height: 1px; background: var(--line); margin: 8px 10px; }
  .item {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 9px 10px; border-radius: 8px;
    text-align: left; font-size: 13.5px; font-weight: 510; letter-spacing: -.01em;
    color: var(--ink);
    transition: background .15s ease;
  }
  .item:hover { background: var(--surface-2); }
  .item:focus-visible { outline-offset: -2px; }
  .item-ic { color: var(--ink-3); transition: color .15s ease; }
  .item:hover .item-ic { color: var(--ink); }
  .label { flex: 1; min-width: 0; line-height: 1.3; }
  .sub { display: block; margin-top: 1px; font-weight: 400; font-size: 12px; color: var(--ink-3); }
  .meta { flex: none; font-size: 12px; font-weight: 400; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .chev { color: var(--line-2); transition: color .15s ease, transform .15s ease; }
  .item:hover .chev { color: var(--ink-3); transform: translateX(1px); }
  .badge {
    flex: none;
    font-size: 11px; font-weight: 510; letter-spacing: 0;
    padding: 2px 7px; border-radius: var(--r-pill);
    color: var(--accent); background: var(--accent-tint);
  }
  .status {
    flex: none; display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 510; color: var(--ok);
  }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-tint); }

  .items .track { margin-top: 6px; }
  .item-track {
    border: 1px solid var(--line); background: var(--canvas);
    border-radius: 10px; padding: 11px 12px;
  }
  .item-track:hover { background: var(--surface-2); }

  /* ------------------------------------------------------------------
     Responsive
  ------------------------------------------------------------------ */
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 1fr; align-content: start; }
    .page { padding-bottom: 40px; }
    .rail { position: static; height: auto; overflow: visible; border-left: 0; border-top: 1px solid var(--line); }
    .rail-head, .items { max-width: 1064px; margin: 0 auto; width: 100%; }
    .rail-head { padding: 28px 40px 8px; }
    .items { padding: 0 30px 40px; display: grid; grid-template-columns: 1fr 1fr; column-gap: 8px; }
    .items .gap { grid-column: 1 / -1; }
    .items .track { grid-column: 1 / -1; }
  }
  @media (max-width: 900px) {
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .tile, .tile:nth-child(4), .tile:nth-child(5) { grid-column: auto; }
    .tile:nth-child(5) { grid-column: 1 / -1; min-height: 0; }
    .tabs { display: none; }
  }
  @media (max-width: 760px) {
    .topbar { padding: 0 16px; gap: 10px; }
    .search, .brand-role { display: none; }
    .icon-btn.only-m { display: grid; }
    .page { padding: 28px 16px 36px; }
    h1 { font-size: 26px; }
    .stats { grid-template-columns: 1fr 1fr; }
    .stat { padding: 12px 14px 13px; }
    .stat:nth-child(3) { border-left: 0; }
    .stat:nth-child(n+3) { border-top: 1px solid var(--line); }
    .stat-v { white-space: normal; }
    .section-head { margin-top: 28px; }
    .tiles { grid-template-columns: 1fr; gap: 12px; }
    .tile { min-height: 0; }
    .rail-head { padding: 24px 16px 6px; }
    .items { padding: 0 6px 32px; grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
    .tile:hover { transform: none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#" aria-label="Chom Learn home">
    <span class="mark" aria-hidden="true">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M17.2 8.2A6.4 6.4 0 1 0 17.2 15.8"/></svg>
    </span>
    Chom Learn <span class="brand-role">Student</span>
  </a>

  <nav class="tabs" aria-label="Primary">
    <a class="tab on" href="#" aria-current="page">Home</a>
    <a class="tab" href="#">Timetable</a>
    <a class="tab" href="#">Grades</a>
    <a class="tab" href="#">Messages</a>
  </nav>

  <div class="topbar-right">
    <button class="search" aria-label="Search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span>Search classes, tasks, people</span>
      <span class="kbd">⌘K</span>
    </button>
    <button class="icon-btn only-m" aria-label="Search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <button class="icon-btn" aria-label="Notifications, 1 unread">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      <span class="dot"></span>
    </button>
    <button class="avatar" aria-label="Your profile">AN</button>
  </div>
</header>

<div class="layout">
<main class="page">
  <header>
    <p class="eyebrow"><span id="today">Tuesday, 6 October</span><span class="sep"></span><span>Term 4, Week 2</span><span class="sep"></span><span>Grade 10B</span></p>
    <h1 id="greet">Good morning, Amara</h1>

    <div class="stats" role="list" aria-label="Today at a glance">
